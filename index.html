<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Drive Log</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#14171C; --surface:#1E2229; --border:#2A2F38;
    --text:#EDEEF0; --muted:#8B92A0; --faint:#565D6B;
    --amber:#F2A93B; --work:#E0642C; --normal:#4C9F70;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .wrap{max-width:640px;margin:0 auto;padding:24px 16px 48px;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .stats-row{display:flex;align-items:flex-end;gap:8px;}
  .stat-block{display:flex;flex-direction:column;align-items:center;}
  .icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;
            display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{color:var(--text);}
  .icon-btn.active{color:var(--amber);}
  .icon-btn .icon{width:20px;height:20px;}
  .connected-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(76,159,112,.15);
                  color:var(--normal);border:1px solid rgba(76,159,112,.3);padding:3px 10px;
                  border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1;}
  .brand p{color:var(--faint);font-size:12px;margin:2px 0 0;}
  .odo-label{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;text-align:center;}
  .odo{display:inline-flex;background:#0B0D10;border:1px solid var(--border);border-radius:8px;
       padding:5px 6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);}
  .odo span{font-size:16px;font-weight:600;color:var(--amber);width:0.85ch;text-align:center;
            text-shadow:0 0 8px rgba(242,169,59,.45);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;
                  justify-content:center;padding:20px;z-index:50;}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
             max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-card h2{font-size:16px;margin:0 0 14px;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;margin-bottom:24px;}
  .tab-btn{flex:1;padding:8px;border:none;background:transparent;border-radius:7px;font-size:14px;
           font-weight:600;color:var(--muted);cursor:pointer;text-transform:capitalize;}
  .tab-btn.active{background:var(--amber);color:var(--bg);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:18px;margin-bottom:16px;}
  .field-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px;}
  .input, select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
         padding:9px 10px;color:var(--text);font-size:14px;outline:none;}
  .input:focus{border-color:var(--amber);}
  .input-icon{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 10px;position:relative;}
  .places-suggestions{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);
                       border-radius:8px;overflow:hidden;z-index:40;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .places-suggestion{padding:9px 12px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid rgba(42,47,56,.6);}
  .places-suggestion:last-child{border-bottom:none;}
  .places-suggestion:hover, .places-suggestion.hovered{background:var(--bg);}
  .input-icon input{border:none;background:transparent;padding:9px 0;flex:1;color:var(--text);outline:none;font-size:14px;}
  .locate-btn{background:none;border:none;color:var(--amber);display:flex;align-items:center;padding:6px;cursor:pointer;flex-shrink:0;}
  .locate-btn:disabled{color:var(--muted);}
  .locate-btn svg{width:18px;height:18px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toggle-row{display:flex;gap:8px;}
  .toggle{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:600;background:transparent;
          border:1px solid var(--border);color:var(--muted);cursor:pointer;}
  .toggle.normal.on{background:rgba(76,159,112,.18);border-color:var(--normal);color:var(--normal);}
  .toggle.work.on{background:rgba(224,100,44,.18);border-color:var(--work);color:var(--work);}
  .toggle.supervised.on{background:rgba(242,169,59,.18);border-color:var(--amber);color:var(--amber);}
  .btn{width:100%;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;
       display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-amber{background:var(--amber);color:var(--bg);}
  .btn-stop{background:var(--work);color:#fff;}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;padding:10px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;
       font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .tag.work{background:rgba(224,100,44,.15);color:var(--work);border:1px solid rgba(224,100,44,.3);}
  .tag.normal{background:rgba(76,159,112,.15);color:var(--normal);border:1px solid rgba(76,159,112,.3);}
  .chip{padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);
        color:var(--muted);background:transparent;cursor:pointer;text-transform:capitalize;}
  .chip.active{background:var(--amber);color:var(--bg);border-color:var(--amber);}
  table{width:100%;border-collapse:collapse;font-size:12px;}
  thead th{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--border);
           text-align:left;padding:8px 10px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:10px;}
  tbody td{padding:8px 10px;border-bottom:1px solid rgba(42,47,56,.6);white-space:nowrap;}
  .table-scroll{max-height:420px;overflow-y:auto;}
  .route-cell{max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .empty{text-align:center;color:var(--faint);padding:24px;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .err{color:var(--work);font-size:12px;margin:4px 0 0;}
  .note{color:var(--faint);font-size:11px;line-height:1.5;margin-top:16px;}
  .drive-btn{background:rgba(66,133,244,.12);border:1px solid rgba(66,133,244,.35);color:#8fb3ff;}
  .timer{display:flex;align-items:center;gap:6px;color:var(--amber);font-size:18px;font-weight:600;}
  .hidden{display:none !important;}
  .icon{width:15px;height:15px;flex-shrink:0;}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{position:relative;width:44px;height:24px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);
          border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s;}
  .switch.on{background:var(--amber);border-color:var(--amber);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);
                transition:transform .15s,background .15s;}
  .switch.on .knob{transform:translateX(20px);background:var(--bg);}
  .settings-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 0 4px;}
  .settings-desc{color:var(--muted);font-size:12px;line-height:1.5;margin:2px 0 0;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-actions .btn{width:auto;padding:9px 14px;font-size:13px;}
</style>

function mapsConfigured() { return GOOGLE_MAPS_API_KEY && !GOOGLE_MAPS_API_KEY.startsWith("PASTE_"); }

function loadGoogleMapsScript() {
  if (!mapsConfigured()) return;
  if (document.getElementById("googleMapsScript")) return;
  const script = document.createElement("script");
  script.id = "googleMapsScript";
  script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places`;
  script.async = true;
  script.defer = true;
  document.head.appendChild(script);
}

let placesLibraryPromise = null;
function getPlacesLibrary() {
  if (!window.google || !window.google.maps || typeof google.maps.importLibrary !== "function") return null;
  if (!placesLibraryPromise) placesLibraryPromise = google.maps.importLibrary("places");
  return placesLibraryPromise;
}

function debounce(fn, delay) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
}

function attachPlacesAutocomplete(inputEl, onSelect) {
  if (!inputEl) return;
  const wrapper = inputEl.closest(".input-icon");
  if (!wrapper) return;
  let dropdown = wrapper.querySelector(".places-suggestions");
  if (!dropdown) {
    dropdown = document.createElement("div");
    dropdown.className = "places-suggestions";
    wrapper.appendChild(dropdown);
  }
  const hide = () => { dropdown.innerHTML = ""; dropdown.style.display = "none"; };
  const search = debounce(async () => {
    if (!mapsConfigured()) return;
    const libraryPromise = getPlacesLibrary();
    const query = inputEl.value.trim();
    if (!libraryPromise || query.length < 3) { hide(); return; }
    try {
      const { AutocompleteSuggestion, AutocompleteSessionToken } = await libraryPromise;
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions({
        input: query,
        sessionToken: new AutocompleteSessionToken(),
      });
      if (!suggestions || !suggestions.length) { hide(); return; }
      dropdown.innerHTML = suggestions.slice(0, 5).map(s => {
        const text = s.placePrediction && s.placePrediction.text ? s.placePrediction.text.text : "";
        return `<div class="places-suggestion" data-desc="${escAttr(text)}">${text}</div>`;
      }).join("");
      dropdown.style.display = "block";
      dropdown.querySelectorAll(".places-suggestion").forEach(el => {
        el.onmousedown = (e) => {
          e.preventDefault();
          onSelect(el.dataset.desc);
          hide();
        };
      });
    } catch (e) {
      hide();
    }
  }, 300);
  inputEl.addEventListener("input", search);
  inputEl.addEventListener("blur", () => setTimeout(hide, 150));
}

const GOOGLE_SCOPES = "https://www.googleapis.com/auth/spreadsheets";
let googleTokenClient = null;
let googleAccessToken = null;
let googleTokenExpiresAt = 0;

function googleConfigured() {
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf("PASTE_YOUR_CLIENT_ID_HERE") === -1;
}

function ensureTokenClient(callback) {
  if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if (!googleTokenClient) {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: callback,
    });
  } else {
    googleTokenClient.callback = callback;
  }
  return googleTokenClient;
}

function getGoogleToken(promptMode) {
  return new Promise((resolve, reject) => {
    const client = ensureTokenClient((resp) => {
      if (resp && resp.access_token) {
        googleAccessToken = resp.access_token;
        googleTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3300) * 1000);
        resolve(resp.access_token);
      } else {
        reject(resp);
      }
    });
    if (!client) { reject(new Error("Google sign-in library not loaded")); return; }
    client.requestAccessToken({ prompt: promptMode || "" });
  });
}

async function getFreshGoogleToken() {
  if (googleAccessToken && Date.now() < googleTokenExpiresAt - 60000) return googleAccessToken;
  return getGoogleToken("");
}

async function createDriveLogSheet() {
  const token = await getGoogleToken("consent");
  const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({
      properties: { title: "Drive Log" },
      sheets: [{ data: [{ startRow: 0, startColumn: 0, rowData: [{ values: [
        "Date","Start Time","End Time","Distance (km)","Start Point","End Point","Type",
        "Time of Day","Road Type","Weather","Traffic Density","Supervisor Name","Supervisor Licence No."
      ].map(v => ({ userEnteredValue: { stringValue: v } })) }] }] }],
    }),
  });
  if (!res.ok) throw new Error("Failed to create sheet: " + res.status);
  const data = await res.json();
  return { spreadsheetId: data.spreadsheetId, url: data.spreadsheetUrl };
}

function labelFor(list, value) {
  const m = list.find(x => x.v === value);
  return m ? m.l : "";
}

async function appendTripToSheet(spreadsheetId, trip) {
  const token = await getFreshGoogleToken();
  const row = [[
    trip.date, trip.startTime, trip.endTime, Number(trip.distance).toFixed(1),
    trip.startPoint, trip.endPoint, trip.tag === "work" ? "Work" : "Normal",
    trip.timeOfDay ? (trip.timeOfDay === "day" ? "Daytime" : "Nighttime") : "",
    trip.roadType ? labelFor(ROAD_TYPES, trip.roadType) : "",
    trip.weather ? labelFor(WEATHER_TYPES, trip.weather) : "",
    trip.traffic ? labelFor(TRAFFIC_LEVELS, trip.traffic) : "",
    trip.supervisorName || "", trip.supervisorLicence || "",
  ]];
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A:M:append?valueInputOption=USER_ENTERED`,
    { method: "POST", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ values: row }) }
  );
  if (!res.ok) throw new Error("Append failed: " + res.status);
}

const todayStr = () => new Date().toISOString().slice(0, 10);
const nowTimeStr = () => new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

function getCurrentPosition() {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Location isn't available on this device."));
    navigator.geolocation.getCurrentPosition(
      pos => resolve(pos.coords),
      () => reject(new Error("Couldn't get your location — check location permission for this site.")),
      { enableHighAccuracy: true, timeout: 10000 }
    );
  });
}

async function reverseGeocode(lat, lng) {
  const url = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${lat},${lng}&key=${GOOGLE_MAPS_API_KEY}`;
  const res = await fetch(url);
  const data = await res.json();
  if (data.status !== "OK" || !data.results.length) throw new Error("Couldn't find an address for your location.");
  const comps = data.results[0].address_components;
  const get = (type) => (comps.find(c => c.types.includes(type)) || {}).long_name;
  const streetNumber = get("street_number");
  const route = get("route");
  const suburb = get("locality") || get("sublocality") || get("postal_town") || get("administrative_area_level_2");
  const street = [streetNumber, route].filter(Boolean).join(" ");
  return [street, suburb].filter(Boolean).join(", ") || data.results[0].formatted_address;
}

async function useMyLocation(target) {
  if (!mapsConfigured()) { state.locateError = "Location lookup isn't set up for this app yet."; render(); return; }
  state.locateError = "";
  if (target === "start") state.locatingStart = true; else state.locatingEnd = true;
  render();
  try {
    const coords = await getCurrentPosition();
    const address = await reverseGeocode(coords.latitude, coords.longitude);
    if (target === "start") state.startPointInput = address; else state.endPoint = address;
  } catch (e) {
    state.locateError = e.message || "Couldn't get your location.";
  }
  state.locatingStart = false; state.locatingEnd = false;
  render();
}

async function autoFillCurrentLocation() {
  if (state.active || state.startPointInput || !mapsConfigured()) return;
  try {
    const coords = await getCurrentPosition();
    const address = await reverseGeocode(coords.latitude, coords.longitude);
    if (!state.active && !state.startPointInput) {
      state.startPointInput = address;
      render();
    }
  } catch (e) {
    // Silent fail — user can still type manually or tap the locate button.
  }
}

function escAttr(str) {
  return String(str).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

async function addRecentLocations(locs) {
  let list = state.recentLocations.slice();
  locs.forEach(loc => {
    if (!loc) return;
    list = list.filter(l => l.toLowerCase() !== loc.toLowerCase());
    list.unshift(loc);
  });
  list = list.slice(0, 10);
  state.recentLocations = list;
  await storageSet(RECENT_LOCATIONS_KEY, list);
}

let routesLibraryPromise = null;
function getRoutesLibrary() {
  if (!window.google || !window.google.maps || typeof google.maps.importLibrary !== "function") return null;
  if (!routesLibraryPromise) routesLibraryPromise = google.maps.importLibrary("routes");
  return routesLibraryPromise;
}

async function estimateRoute(origin, destination) {
  const libraryPromise = getRoutesLibrary();
  if (!libraryPromise) throw new Error("Distance lookup isn't ready yet — try again in a moment.");
  const { DistanceMatrixService } = await libraryPromise;
  const service = new DistanceMatrixService();
  return new Promise((resolve, reject) => {
    service.getDistanceMatrix({
      origins: [origin],
      destinations: [destination],
      travelMode: google.maps.TravelMode.DRIVING,
      unitSystem: google.maps.UnitSystem.METRIC,
    }, (response, status) => {
      if (status !== "OK") { reject(new Error("Couldn't calculate that route.")); return; }
      const element = response.rows && response.rows[0] && response.rows[0].elements && response.rows[0].elements[0];
      if (!element || element.status !== "OK") { reject(new Error("Couldn't find a driving route between those points.")); return; }
      resolve({
        distanceKm: element.distance.value / 1000,
        durationMin: Math.max(1, Math.round(element.duration.value / 60)),
      });
    });
  });
}

async function runRouteEstimate(origin, destination) {
  if (!mapsConfigured()) { state.estimateError = "Distance lookup isn't set up for this app yet."; render(); return; }
  if (!origin || !destination) return;
  state.estimating = true; state.estimateError = ""; render();
  try {
    const { distanceKm, durationMin } = await estimateRoute(origin, destination);
    state.distance = distanceKm.toFixed(1);
    state.estimatedDuration = durationMin;
  } catch (e) {
    state.estimateError = e.message || "Couldn't calculate distance and time.";
    state.estimatedDuration = null;
  }
  state.estimating = false;
  render();
}

async function runPreTripEstimate(origin, destination) {
  if (!mapsConfigured()) { state.preTripEstimateError = "Distance lookup isn't set up for this app yet."; render(); return; }
  if (!destination) return;
  if (!origin) { state.preTripEstimateError = "Enter a start location first."; render(); return; }
  state.preTripEstimating = true; state.preTripEstimateError = ""; render();
  try {
    const { distanceKm, durationMin } = await estimateRoute(origin, destination);
    state.preTripDistance = distanceKm.toFixed(1);
    state.preTripDuration = durationMin;
  } catch (e) {
    state.preTripEstimateError = e.message || "Couldn't calculate distance and time.";
    state.preTripDistance = null; state.preTripDuration = null;
  }
  state.preTripEstimating = false;
  render();
}

const hasClaudeStorage = typeof window.storage !== "undefined" && !!window.storage;

async function storageGet(key) {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
async function storageSet(key, value) {
  try {
    if (hasClaudeStorage) { await window.storage.set(key, JSON.stringify(value), false); return; }
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { console.error("storage set failed", e); }
}
async function storageDelete(key) {
  try {
    if (hasClaudeStorage) { await window.storage.delete(key, false); return; }
    localStorage.removeItem(key);
  } catch {}
}

function attachLoginHandlers() {

async function loadData() {

  if (state.settings.driveType === undefined) {
    state.settings.driveType = state.settings.recordConditions ? "supervised" : (state.settings.tripType === "work" ? "work" : "normal");
  }
  state.sheetLink = await storageGet(SHEET_LINK_KEY);

let tickerId = null;
function startTicker() {
  if (tickerId) return;
  tickerId = setInterval(() => { if (state.tab === "log" && state.active) renderTimerOnly(); }, 1000);
}
function stopTicker() { if (tickerId) { clearInterval(tickerId); tickerId = null; } }

function renderTimerOnly() {
  const el = document.getElementById("timerDisplay");
  if (!el || !state.active) return;
  const elapsed = Math.max(0, Math.floor((Date.now() - state.active.startedAt) / 1000));
  const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const ss = String(elapsed % 60).padStart(2, "0");
  el.textContent = `${mm}:${ss}`;
}

function odometer(value) {
  const str = Math.round(Math.max(0, value)).toString().padStart(6, "0").slice(-6);
  return `<div class="odo">${str.split("").map(d => `<span>${d}</span>`).join("")}</div>`;
}
function odometerTime(mins) {
  const h = String(Math.min(999, Math.floor(mins / 60))).padStart(3, "0");
  const m = String(mins % 60).padStart(2, "0");
  const str = `${h}:${m}`;
  return `<div class="odo">${str.split("").map(d => `<span>${d}</span>`).join("")}</div>`;
}

function totalMiles() { return state.trips.reduce((s, t) => s + t.distance, 0); }
function tripMinutes(t) {
  const start = new Date(`1970/01/01 ${t.startTime}`);
  let end = new Date(`1970/01/01 ${t.endTime}`);
  if (isNaN(start) || isNaN(end)) return 0;
  if (end < start) end = new Date(end.getTime() + 24 * 60 * 60 * 1000);
  return Math.round((end - start) / 60000);
}
function totalMinutes() { return state.trips.reduce((s, t) => s + tripMinutes(t), 0); }
function formatDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return `${h}h ${m}m`;
}
function weekTotal() {
  const now = new Date();
  const start = new Date(now); start.setDate(now.getDate() - now.getDay()); start.setHours(0,0,0,0);
  return state.trips.filter(t => new Date(t.date) >= start).reduce((s, t) => s + t.distance, 0);
}
function filteredTrips() {
  return state.trips.filter(t => {
    if (state.filterTag !== "all" && t.tag !== state.filterTag) return false;
    if (state.filterFrom && t.date < state.filterFrom) return false;
    if (state.filterTo && t.date > state.filterTo) return false;
    if (state.filterSearch) {
      const q = state.filterSearch.toLowerCase();
      if (!t.startPoint.toLowerCase().includes(q) && !t.endPoint.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

];
const WEATHER_TYPES = [{ v: "dry", l: "Dry" }, { v: "wet", l: "Wet" }];
const TRAFFIC_LEVELS = [{ v: "light", l: "Light" }, { v: "medium", l: "Medium" }, { v: "heavy", l: "Heavy" }];

function renderConditionsModal() {
  const f = state.conditionsForm;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2>Driving conditions</h2>

      <label class="field-label">Time of day</label>
      <select id="condTimeOfDay" class="input" style="margin-bottom:14px;">
        <option value="day" ${f.timeOfDay === "day" ? "selected" : ""}>Daytime</option>
        <option value="night" ${f.timeOfDay === "night" ? "selected" : ""}>Nighttime</option>
      </select>

      <label class="field-label">Road type</label>
      <select id="condRoadType" class="input" style="margin-bottom:14px;">
        ${ROAD_TYPES.map(r => `<option value="${r.v}" ${f.roadType === r.v ? "selected" : ""}>${r.l}</option>`).join("")}
      </select>

      <label class="field-label">Weather</label>
      <select id="condWeather" class="input" style="margin-bottom:14px;">
        ${WEATHER_TYPES.map(w => `<option value="${w.v}" ${f.weather === w.v ? "selected" : ""}>${w.l}</option>`).join("")}
      </select>

      <label class="field-label">Traffic density</label>
      <select id="condTraffic" class="input" style="margin-bottom:14px;">
        ${TRAFFIC_LEVELS.map(t => `<option value="${t.v}" ${f.traffic === t.v ? "selected" : ""}>${t.l}</option>`).join("")}
      </select>

      <label class="field-label">Supervisor</label>
      <select id="condSupervisor" class="input" style="margin-bottom:${state.addingSupervisor ? "10" : "18"}px;">
        <option value="" ${!f.supervisorId ? "selected" : ""}>None</option>
        ${state.supervisors.map(s => `<option value="${s.id}" ${f.supervisorId === s.id ? "selected" : ""}>${s.name} (${s.licence})</option>`).join("")}
        <option value="__new__">+ Add new supervisor</option>
      </select>

      ${state.addingSupervisor ? `
        <div class="card" style="padding:12px;margin-bottom:18px;">
          <label class="field-label">Full name</label>
          <input id="newSupervisorName" class="input" style="margin-bottom:10px;" value="${state.newSupervisorName}" placeholder="e.g. Jane Smith" />
          <label class="field-label">Licence no.</label>
          <input id="newSupervisorLicence" class="input" style="margin-bottom:12px;" value="${state.newSupervisorLicence}" placeholder="e.g. 123456789" />
          <button id="saveSupervisorBtn" class="btn btn-ghost">Add supervisor</button>
        </div>
      ` : ""}

      <button id="saveConditionsTripBtn" class="btn btn-amber">Save trip</button>
    </div>
  </div>`;
}

function renderEditTripModal() {
  const t = state.editingTrip;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <h2 style="margin:0;">Edit drive</h2>
        <button id="closeEditTripBtn" class="icon-btn" title="Close">${icons.close}</button>
      </div>

      <label class="field-label">Date</label>
      <input id="editDate" type="date" class="input" value="${t.date}" style="margin-bottom:14px;" />

      <div class="row-2" style="margin-bottom:14px;">
        <div>
          <label class="field-label">Start time</label>
          <input id="editStartTime" type="time" class="input" value="${t.startTime}" />
        </div>
        <div>
          <label class="field-label">End time</label>
          <input id="editEndTime" type="time" class="input" value="${t.endTime}" />
        </div>
      </div>

      <label class="field-label">Start Location</label>
      <input id="editStartPoint" class="input" value="${escAttr(t.startPoint)}" style="margin-bottom:14px;" />

      <label class="field-label">End Location</label>
      <input id="editEndPoint" class="input" value="${escAttr(t.endPoint)}" style="margin-bottom:14px;" />

      <label class="field-label">Distance (km)</label>
      <input id="editDistance" class="input" inputmode="decimal" value="${t.distance}" style="margin-bottom:14px;" />

      <label class="field-label">Type</label>
      <div class="toggle-row" style="margin-bottom:20px;">
        <button class="toggle normal ${t.tag !== "work" ? "on" : ""}" data-edittag="normal">Normal</button>
        <button class="toggle work ${t.tag === "work" ? "on" : ""}" data-edittag="work">Work</button>
      </div>

      <div class="row-2">
        <button id="deleteEditingTripBtn" class="btn btn-ghost" style="color:var(--work);border-color:rgba(224,100,44,.4);">${icons.trash} Delete</button>
        <button id="saveEditTripBtn" class="btn btn-amber">Save changes</button>
      </div>
    </div>
  </div>`;
}

function renderClearHistoryModal() {
  const count = state.trips.length;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2 style="color:var(--work);">Clear all drive history?</h2>
      <p class="settings-desc" style="margin:0 0 18px;">
        This will permanently delete ${count} logged drive${count === 1 ? "" : "s"} from this device, along with saved supervisors and recent locations.
        ${state.sheetLink ? "Your Google Sheet will not be touched." : ""} This action can't be undone.
      </p>
      <div class="row-2">
        <button id="cancelClearHistoryBtn" class="btn btn-ghost">Cancel</button>
        <button id="confirmClearHistoryBtn" class="btn btn-stop">Clear history</button>
      </div>
    </div>
  </div>`;
}

function renderDeleteSelectedModal() {
  const count = state.selectedTripIds.length;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2 style="color:var(--work);">Delete ${count} drive${count === 1 ? "" : "s"}?</h2>
      <p class="settings-desc" style="margin:0 0 18px;">
        This will permanently remove the selected drive${count === 1 ? "" : "s"} from this device. This action can't be undone.
      </p>
      <div class="row-2">
        <button id="cancelDeleteSelectedBtn" class="btn btn-ghost">Cancel</button>
        <button id="confirmDeleteSelectedBtn" class="btn btn-stop">Delete</button>
      </div>
    </div>
  </div>`;
}

async function syncUnsyncedTrips() {
  if (!state.sheetLink) return;
  const unsynced = state.trips.filter(t => !t.synced);
  if (unsynced.length === 0) return;
  let anyFailed = false;
  for (const t of unsynced) {
    try {
      await appendTripToSheet(state.sheetLink.spreadsheetId, t);
      t.synced = true;
    } catch (e) {
      anyFailed = true;
    }
  }
  await storageSet(TRIPS_KEY, state.trips);
  state.googleError = anyFailed ? "Some drives didn't sync to Sheets — open Settings to try again." : "";
  render();
}

async function finalizeTrip(trip) {
  trip.synced = false;
  state.trips = [trip, ...state.trips];
  await storageSet(TRIPS_KEY, state.trips);
  await addRecentLocations([trip.startPoint, trip.endPoint]);
  if (state.sheetLink) {
    syncUnsyncedTrips();
  }
}

function attachAppHandlers() {
  document.querySelectorAll(".tab-btn").forEach(btn => {
    btn.onclick = () => { state.tab = btn.dataset.tab; render(); };
  });

  const settingsBtn = document.getElementById("settingsBtn");
  if (settingsBtn) settingsBtn.onclick = () => { state.tab = "settings"; render(); };

  if (state.tab === "log") {
    if (!state.active) {
      const spi = document.getElementById("startPointInput");
      if (spi) {
        spi.oninput = (e) => { state.startPointInput = e.target.value; };
        attachPlacesAutocomplete(spi, (desc) => {
          spi.value = desc;
          state.startPointInput = desc;
        });
      }
      const locStartBtn = document.getElementById("locateStartBtn");
      if (locStartBtn) locStartBtn.onclick = () => useMyLocation("start");

      const peti = document.getElementById("preTripEndInput");
      if (peti) {
        peti.oninput = (e) => {
          state.preTripEndLocation = e.target.value;
          const hasText = !!state.preTripEndLocation.trim();
          const section = document.getElementById("preTripEstimateSection");
          const hint = document.getElementById("preTripEndHint");
          if (section) section.style.display = hasText ? "" : "none";
          if (hint) hint.style.display = hasText ? "none" : "";
        };
        attachPlacesAutocomplete(peti, (desc) => {
          peti.value = desc;
          state.preTripEndLocation = desc;
          const section = document.getElementById("preTripEstimateSection");
          const hint = document.getElementById("preTripEndHint");
          if (section) section.style.display = "";
          if (hint) hint.style.display = "none";
        });
      }
      const preTripEstBtn = document.getElementById("preTripEstimateBtn");
      if (preTripEstBtn) preTripEstBtn.onclick = () => {
        const origin = state.startPointInput.trim();
        const dest = state.preTripEndLocation.trim();
        if (dest) runPreTripEstimate(origin, dest);
      };

      const startBtn = document.getElementById("startTripBtn");
      if (startBtn) startBtn.onclick = async () => {
        const trip = {
          tag: state.settings.driveType === "work" ? "work" : "normal",
          startPoint: state.startPointInput.trim() || "Unspecified",
          startTime: nowTimeStr(),
          date: todayStr(),
          startedAt: Date.now(),
        };
        state.active = trip;
        state.startPointInput = "";
        state.preTripEndLocation = "";
        state.preTripDistance = null;
        state.preTripDuration = null;
        state.preTripEstimateError = "";
        state.preTripEstimating = false;
        state.estimatedDuration = null;
        state.estimateError = "";
        state.distanceError = "";
        await storageSet(ACTIVE_KEY, trip);
        startTicker();
        render();
      };
    } else {
      renderTimerOnly();
      const epi = document.getElementById("endPointInput");
      if (epi) {
        epi.oninput = (e) => {
          state.endPoint = e.target.value;
          const estBtn = document.getElementById("estimateRouteBtn");
          if (estBtn) estBtn.disabled = !state.endPoint.trim();
        };
        attachPlacesAutocomplete(epi, (desc) => {
          epi.value = desc;
          state.endPoint = desc;
          const estBtn = document.getElementById("estimateRouteBtn");
          if (estBtn) estBtn.disabled = !state.endPoint.trim();
        });
      }
      const locEndBtn = document.getElementById("locateEndBtn");
      if (locEndBtn) locEndBtn.onclick = () => useMyLocation("end");
      const estimateBtn = document.getElementById("estimateRouteBtn");
      if (estimateBtn) estimateBtn.onclick = () => {
        const dest = state.endPoint.trim();
        if (dest) runRouteEstimate(state.active.startPoint, dest);
      };
      const di = document.getElementById("distanceInput");
      if (di) di.oninput = (e) => {
        state.distance = e.target.value.replace(/[^0-9.]/g, "");
        e.target.value = state.distance;
        if (state.distanceError) {
          state.distanceError = "";
          const errEl = document.getElementById("distanceErrorMsg");
          if (errEl) { errEl.textContent = ""; errEl.style.display = "none"; }
        }
      };
      const stopBtn = document.getElementById("stopTripBtn");
      if (stopBtn) stopBtn.onclick = async () => {
        const distVal = parseFloat(state.distance);
        if (!state.distance || isNaN(distVal) || distVal <= 0) {
          state.distanceError = "Enter a distance to save this drive.";
          render();
          const diAgain = document.getElementById("distanceInput");
          if (diAgain) diAgain.focus();
          return;
        }
        state.distanceError = "";
        const a = state.active;
        const trip = {
          id: uid(), date: a.date, startTime: a.startTime, endTime: nowTimeStr(),
          distance: distVal, startPoint: a.startPoint,
          endPoint: state.endPoint.trim() || "Unspecified", tag: a.tag,
        };
        state.active = null;
        state.endPoint = ""; state.distance = "";
        state.estimatedDuration = null; state.estimateError = "";
        state.startPointInput = "";
        await storageDelete(ACTIVE_KEY);
        stopTicker();
        autoFillCurrentLocation();

        if (state.settings.driveType === "supervised") {
          state.pendingTrip = trip;
          state.conditionsForm = { timeOfDay: "day", roadType: "sealed", weather: "dry", traffic: "medium", supervisorId: state.settings.lastSupervisorId || "" };
          state.addingSupervisor = false;
          state.newSupervisorName = ""; state.newSupervisorLicence = "";
          render();
        } else {
          await finalizeTrip(trip);
          render();
        }
      };
    }
  }

  if (state.tab === "settings") {
    document.querySelectorAll("[data-drivetype]").forEach(btn => {
      btn.onclick = async () => {
        state.settings.driveType = btn.dataset.drivetype;
        await storageSet(SETTINGS_KEY, state.settings);
        render();
      };
    });

    const clearHistoryBtn = document.getElementById("clearHistoryBtn");
    if (clearHistoryBtn) clearHistoryBtn.onclick = () => { state.confirmingClearHistory = true; render(); };

    const connectBtn = document.getElementById("connectSheetBtn");
    if (connectBtn) connectBtn.onclick = async () => {
      state.googleBusy = true; state.googleError = ""; render();
      try {
        const { spreadsheetId, url } = await createDriveLogSheet();
        state.sheetLink = { spreadsheetId, url };
        await storageSet(SHEET_LINK_KEY, state.sheetLink);
        syncUnsyncedTrips();
      } catch (e) {
        state.googleError = "Couldn't connect. Make sure you allow the sign-in popup and try again.";
      }
      state.googleBusy = false; render();
    };

    const syncNowBtn = document.getElementById("syncNowBtn");
    if (syncNowBtn) syncNowBtn.onclick = async () => {
      state.syncingNow = true; render();
      await syncUnsyncedTrips();
      state.syncingNow = false; render();
    };

    const disconnectBtn = document.getElementById("disconnectSheetBtn");
    if (disconnectBtn) disconnectBtn.onclick = async () => {
      state.sheetLink = null;
      await storageDelete(SHEET_LINK_KEY);
      render();
    };
  }

  if (state.tab === "history") {
    document.querySelectorAll("[data-filtertag]").forEach(btn => {
      btn.onclick = () => { state.filterTag = btn.dataset.filtertag; render(); };
    });
    document.getElementById("filterFrom").onchange = (e) => { state.filterFrom = e.target.value; render(); };
    document.getElementById("filterTo").onchange = (e) => { state.filterTo = e.target.value; render(); };
    document.getElementById("filterSearch").oninput = (e) => { state.filterSearch = e.target.value; render(); };

    const toggleSelectBtn = document.getElementById("toggleSelectModeBtn");
    if (toggleSelectBtn) toggleSelectBtn.onclick = () => {
      state.historySelectMode = !state.historySelectMode;
      state.selectedTripIds = [];
      render();
    };

    const selectAllBox = document.getElementById("selectAllVisible");
    if (selectAllBox) selectAllBox.onchange = (e) => {
      const visibleIds = filteredTrips().map(t => t.id);
      if (e.target.checked) {
        state.selectedTripIds = Array.from(new Set([...state.selectedTripIds, ...visibleIds]));
      } else {
        state.selectedTripIds = state.selectedTripIds.filter(id => !visibleIds.includes(id));
      }
      render();
    };

    document.querySelectorAll(".tripCheckbox").forEach(cb => {
      cb.onchange = (e) => {
        const id = cb.dataset.tripid;
        if (e.target.checked) {
          if (!state.selectedTripIds.includes(id)) state.selectedTripIds.push(id);
        } else {
          state.selectedTripIds = state.selectedTripIds.filter(x => x !== id);
        }
        render();
      };
    });

    document.querySelectorAll(".editTripBtn").forEach(btn => {
      btn.onclick = () => {
        const trip = state.trips.find(t => t.id === btn.dataset.tripid);
        if (trip) { state.editingTrip = { ...trip }; render(); }
      };
    });

    const deleteSelectedBtn = document.getElementById("deleteSelectedBtn");
    if (deleteSelectedBtn) deleteSelectedBtn.onclick = () => {
      if (state.selectedTripIds.length === 0) return;
      state.confirmingDeleteSelected = true;
      render();
    };
  }

  if (state.pendingTrip) {
    const f = state.conditionsForm;
    const bind = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.onchange = (e) => { f[key] = e.target.value; };
    };
    bind("condTimeOfDay", "timeOfDay");
    bind("condRoadType", "roadType");
    bind("condWeather", "weather");
    bind("condTraffic", "traffic");

    const supSelect = document.getElementById("condSupervisor");
    if (supSelect) supSelect.onchange = (e) => {
      if (e.target.value === "__new__") {
        state.addingSupervisor = true;
        f.supervisorId = "";
      } else {
        state.addingSupervisor = false;
        f.supervisorId = e.target.value;
      }
      render();
    };

    const newName = document.getElementById("newSupervisorName");
    if (newName) newName.oninput = (e) => { state.newSupervisorName = e.target.value; };
    const newLic = document.getElementById("newSupervisorLicence");
    if (newLic) newLic.oninput = (e) => { state.newSupervisorLicence = e.target.value; };

    const saveSupBtn = document.getElementById("saveSupervisorBtn");
    if (saveSupBtn) saveSupBtn.onclick = async () => {
      const name = state.newSupervisorName.trim();
      const licence = state.newSupervisorLicence.trim();
      if (!name || !licence) return;
      const sup = { id: uid(), name, licence };
      state.supervisors = [...state.supervisors, sup];
      await storageSet(SUPERVISORS_KEY, state.supervisors);
      f.supervisorId = sup.id;
      state.addingSupervisor = false;
      state.newSupervisorName = ""; state.newSupervisorLicence = "";
      render();
    };

    const saveTripBtn = document.getElementById("saveConditionsTripBtn");
    if (saveTripBtn) saveTripBtn.onclick = async () => {
      const sup = state.supervisors.find(s => s.id === f.supervisorId);
      const trip = {
        ...state.pendingTrip,
        timeOfDay: f.timeOfDay, roadType: f.roadType, weather: f.weather, traffic: f.traffic,
        supervisorName: sup ? sup.name : "", supervisorLicence: sup ? sup.licence : "",
      };
      state.pendingTrip = null;
      if (sup) {
        state.settings.lastSupervisorId = sup.id;
        await storageSet(SETTINGS_KEY, state.settings);
      }
      await finalizeTrip(trip);
      render();
    };
  }

  if (state.confirmingClearHistory) {
    const cancelBtn = document.getElementById("cancelClearHistoryBtn");
    if (cancelBtn) cancelBtn.onclick = () => { state.confirmingClearHistory = false; render(); };

    const confirmBtn = document.getElementById("confirmClearHistoryBtn");
    if (confirmBtn) confirmBtn.onclick = async () => {
      state.trips = [];
      state.supervisors = [];
      state.recentLocations = [];
      state.filterTag = "all"; state.filterFrom = ""; state.filterTo = ""; state.filterSearch = "";
      await storageSet(TRIPS_KEY, state.trips);
      await storageSet(SUPERVISORS_KEY, state.supervisors);
      await storageSet(RECENT_LOCATIONS_KEY, state.recentLocations);
      state.confirmingClearHistory = false;
      render();
    };
  }

  if (state.editingTrip) {
    const et = state.editingTrip;
    document.getElementById("editDate").onchange = (e) => { et.date = e.target.value; };
    document.getElementById("editStartTime").onchange = (e) => { et.startTime = e.target.value; };
    document.getElementById("editEndTime").onchange = (e) => { et.endTime = e.target.value; };
    document.getElementById("editStartPoint").oninput = (e) => { et.startPoint = e.target.value; };
    document.getElementById("editEndPoint").oninput = (e) => { et.endPoint = e.target.value; };
    document.getElementById("editDistance").oninput = (e) => { et.distance = e.target.value.replace(/[^0-9.]/g, ""); e.target.value = et.distance; };

    document.querySelectorAll("[data-edittag]").forEach(btn => {
      btn.onclick = () => { et.tag = btn.dataset.edittag; render(); };
    });

    const closeBtn = document.getElementById("closeEditTripBtn");
    if (closeBtn) closeBtn.onclick = () => { state.editingTrip = null; render(); };

    const deleteBtn = document.getElementById("deleteEditingTripBtn");
    if (deleteBtn) deleteBtn.onclick = async () => {
      state.trips = state.trips.filter(t => t.id !== et.id);
      state.selectedTripIds = state.selectedTripIds.filter(id => id !== et.id);
      await storageSet(TRIPS_KEY, state.trips);
      state.editingTrip = null;
      render();
    };

    const saveBtn = document.getElementById("saveEditTripBtn");
    if (saveBtn) saveBtn.onclick = async () => {
      const dist = parseFloat(et.distance);
      if (!et.startPoint.trim() || !et.endPoint.trim() || isNaN(dist)) return;
      state.trips = state.trips.map(t => t.id === et.id ? {
        ...t, date: et.date, startTime: et.startTime, endTime: et.endTime,
        startPoint: et.startPoint.trim(), endPoint: et.endPoint.trim(),
        distance: dist, tag: et.tag,
      } : t);
      await storageSet(TRIPS_KEY, state.trips);
      state.editingTrip = null;
      render();
    };
  }

  if (state.confirmingDeleteSelected) {
    const cancelBtn = document.getElementById("cancelDeleteSelectedBtn");
    if (cancelBtn) cancelBtn.onclick = () => { state.confirmingDeleteSelected = false; render(); };

    const confirmBtn = document.getElementById("confirmDeleteSelectedBtn");
    if (confirmBtn) confirmBtn.onclick = async () => {
      state.trips = state.trips.filter(t => !state.selectedTripIds.includes(t.id));
      await storageSet(TRIPS_KEY, state.trips);
      state.selectedTripIds = [];
      state.confirmingDeleteSelected = false;
      state.historySelectMode = false;
      render();
    };
  }
}

(async function init() {
  loadGoogleMapsScript();
  state._existingProfile = await storageGet(PROFILE_KEY);
  state.loadingProfile = false;
  render();
})();
</script>
</body>
</html>
