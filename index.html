        tag: state.settings.driveType === "work" ? "work" : state.settings.driveType === "supervised" ? "supervised" : "normal",
      };
      state.logEstimateForm = null;
      state.startPointInput = "";
      state.preTripEndLocation = "";
      state.preTripDistance = null;
      state.preTripDuration = null;
      state.preTripEstimateError = "";
      state.preTripEstimating = false;

      if (state.settings.driveType === "supervised") {
        state.pendingTrip = trip;
        const dn = defaultDayNightFor(trip.date, trip.startTime);
        state.conditionsForm = { timeOfDay: dn, roadType: "sealed", weather: "dry", traffic: "medium", supervisorId: state.settings.lastSupervisorId || "" };
        state.addingSupervisor = false;
        state.newSupervisorName = ""; state.newSupervisorLicence = "";
        render();
      } else {
        await finalizeTrip(trip);
        render();
      }
    };
  }

  if (state.splittingTrip) {
    const s = state.splittingTrip;
    attachTimeInput(document.getElementById("splitTimeInput"), (v) => { s.splitTime = v; });
    const splitMidInput = document.getElementById("splitMidPointInput");
    if (splitMidInput) splitMidInput.oninput = (e) => { s.midPoint = e.target.value; };

    const cancelSplitBtn = document.getElementById("cancelSplitTripBtn");
    if (cancelSplitBtn) cancelSplitBtn.onclick = () => { state.splittingTrip = null; render(); };

    const confirmSplitBtn = document.getElementById("confirmSplitTripBtn");
    if (confirmSplitBtn) confirmSplitBtn.onclick = async () => {
      const original = state.trips.find(t => t.id === s.id);
      if (!original) { state.splittingTrip = null; render(); return; }
      s.splitTime = clampTimeValue(s.splitTime || "");
      const startMin = (() => { const [h, m] = s.startTime.split(":").map(Number); return h * 60 + m; })();
      let endMin = (() => { const [h, m] = s.endTime.split(":").map(Number); return h * 60 + m; })();
      if (endMin <= startMin) endMin += 24 * 60;
      const [sh, sm] = s.splitTime.split(":").map(Number);
      let splitMin = sh * 60 + sm;
      if (splitMin < startMin) splitMin += 24 * 60;
      if (splitMin <= startMin || splitMin >= endMin) {
        s.error = "Pick a split time between the drive's start and end.";
        render();
        return;
      }
      const totalMin = endMin - startMin;
      const ratio = (splitMin - startMin) / totalMin;
      const midPoint = s.midPoint.trim() || "Split point";
      const leg1 = {
        ...original, id: uid(), endTime: s.splitTime, endPoint: midPoint,
        distance: original.distance * ratio,
      };
      const leg2 = {
        ...original, id: uid(), startTime: s.splitTime, startPoint: midPoint,
        distance: original.distance * (1 - ratio),
      };
      delete leg1.startLat; delete leg1.startLng; // coordinates no longer correspond exactly to the split legs
      delete leg2.endLat; delete leg2.endLng;
      state.trips = state.trips.flatMap(t => t.id === s.id ? [leg1, leg2] : [t]);
      await storageSet(TRIPS_KEY, state.trips);
      state.splittingTrip = null;
      state.editingTrip = null;
      render();
    };
  }

  if (state.odometerPrompt) {
    const p = state.odometerPrompt;
    const readingInput = document.getElementById("odometerReadingInput");
    if (readingInput) readingInput.oninput = (e) => { p.value = e.target.value.replace(/[^0-9.]/g, ""); e.target.value = p.value; };

    const skipBtn = document.getElementById("skipOdometerBtn");
    if (skipBtn) skipBtn.onclick = () => { state.odometerPrompt = null; render(); };

    const saveBtn = document.getElementById("saveOdometerBtn");
    if (saveBtn) saveBtn.onclick = async () => {
      const val = parseFloat(p.value);
      if (!p.value || isNaN(val) || val < 0) { p.error = "Enter a valid odometer reading."; render(); return; }
      state.settings.lastOdometerReading = { value: val, date: todayStr() };
      await storageSet(SETTINGS_KEY, state.settings);
      state.odometerPrompt = null;
      render();
    };
  }

  if (state.syncReminderPrompt) {
    const laterBtn = document.getElementById("laterSyncReminderBtn");
    if (laterBtn) laterBtn.onclick = () => { state.syncReminderPrompt = null; render(); };

    const syncBtn = document.getElementById("syncNowReminderBtn");
    if (syncBtn) syncBtn.onclick = async () => {
      state.syncingNow = true; render();
      await syncUnsyncedTrips();
      state.syncingNow = false;
      state.syncReminderPrompt = null;
      render();
    };
  }

  if (state.supervisedCompletionPrompt) {
    const closeBtn = document.getElementById("closeSupervisedCompletionBtn");
    if (closeBtn) closeBtn.onclick = () => { state.supervisedCompletionPrompt = null; render(); };
  }

  if (state.fuelFillupForm) {
    const f = state.fuelFillupForm;
    const dateInput = document.getElementById("fillupDate");
    if (dateInput) dateInput.onchange = (e) => { f.date = e.target.value; };
    const odometerInput = document.getElementById("fillupOdometer");
    if (odometerInput) odometerInput.oninput = (e) => { f.odometer = e.target.value.replace(/[^0-9.]/g, ""); e.target.value = f.odometer; };
    const amountInput = document.getElementById("fillupAmount");
    if (amountInput) amountInput.oninput = (e) => { f.amount = e.target.value.replace(/[^0-9.]/g, ""); e.target.value = f.amount; };
    const priceInput = document.getElementById("fillupPrice");
    if (priceInput) priceInput.oninput = (e) => { f.price = e.target.value.replace(/[^0-9.]/g, ""); e.target.value = f.price; };

    const cancelBtn = document.getElementById("cancelFillupBtn");
    if (cancelBtn) cancelBtn.onclick = () => { state.fuelFillupForm = null; render(); };

    const confirmBtn = document.getElementById("confirmFillupBtn");
    if (confirmBtn) confirmBtn.onclick = async () => {
      const amount = parseFloat(f.amount), price = parseFloat(f.price);
      const odometer = f.odometer ? parseFloat(f.odometer) : null;
      if (!f.date || !amount || isNaN(amount) || amount <= 0 || !price || isNaN(price) || price <= 0) {
        f.error = "Enter a valid amount and price.";
        render();
        return;
      }
      if (f.odometer && (isNaN(odometer) || odometer < 0)) {
        f.error = "Enter a valid odometer reading, or leave it blank.";
        render();
        return;
      }
      state.fuelFillups = [...state.fuelFillups, { id: uid(), date: f.date, odometer, amount, price }];
      await storageSet(FUEL_FILLUPS_KEY, state.fuelFillups);
      state.fuelFillupForm = null;
      render();
    };
  }

  if (state.carLookupForm) {
    const f = state.carLookupForm;

    const yearSelect = document.getElementById("carLookupYear");
    if (yearSelect) yearSelect.onchange = async (e) => {
      f.year = e.target.value; f.make = ""; f.model = ""; f.trimId = "";
      f.makes = []; f.models = []; f.trims = []; f.result = null; f.error = "";
      render();
      if (f.year) {
        try { f.makes = await fegMenu("make", { year: f.year }); }
        catch { f.error = "Lookup failed. Try again or enter the figure manually."; }
        render();
      }
    };
    const makeSelect = document.getElementById("carLookupMake");
    if (makeSelect) makeSelect.onchange = async (e) => {
      f.make = e.target.value; f.model = ""; f.trimId = "";
      f.models = []; f.trims = []; f.result = null; f.error = "";
      render();
      if (f.make) {
        try { f.models = await fegMenu("model", { year: f.year, make: f.make }); }
        catch { f.error = "Lookup failed. Try again or enter the figure manually."; }
        render();
      }
    };
    const modelSelect = document.getElementById("carLookupModel");
    if (modelSelect) modelSelect.onchange = async (e) => {
      f.model = e.target.value; f.trimId = "";
      f.trims = []; f.result = null; f.error = "";
      render();
      if (f.model) {
        try { f.trims = await fegMenu("options", { year: f.year, make: f.make, model: f.model }); }
        catch { f.error = "Lookup failed. Try again or enter the figure manually."; }
        render();
      }
    };
    const trimSelect = document.getElementById("carLookupTrim");
    if (trimSelect) trimSelect.onchange = async (e) => {
      f.trimId = e.target.value; f.result = null; f.error = "";
      render();
      if (f.trimId) {
        try {
          const comb08 = await fegVehicle(f.trimId);
          f.result = state.settings.unit === "mi" ? comb08 : usMpgToL100(comb08);
        } catch { f.error = "Couldn't fetch vehicle data. Try again or enter the figure manually."; }
        render();
      }
    };

    const nonUsMakeSelect = document.getElementById("carLookupNonUsMake");
    if (nonUsMakeSelect) nonUsMakeSelect.onchange = (e) => {
      f.nonUsMake = e.target.value; f.nonUsModel = ""; f.result = null; f.error = "";
      render();
    };
    const nonUsModelSelect = document.getElementById("carLookupNonUsModel");
    if (nonUsModelSelect) nonUsModelSelect.onchange = (e) => {
      f.nonUsModel = e.target.value;
      const entry = CAR_FUEL_DATA.find(c => c.region === f.region && c.make === f.nonUsMake && c.model === f.nonUsModel);
      f.result = entry ? (state.settings.unit === "mi" ? l100ToImpMpg(entry.l100km) : entry.l100km) : null;
      render();
    };

    const closeCarLookupBtn = document.getElementById("closeCarLookupBtn");
    if (closeCarLookupBtn) closeCarLookupBtn.onclick = () => { state.carLookupForm = null; render(); };
    const cancelCarLookupBtn = document.getElementById("cancelCarLookupBtn");
    if (cancelCarLookupBtn) cancelCarLookupBtn.onclick = () => { state.carLookupForm = null; render(); };
    const applyCarLookupBtn = document.getElementById("applyCarLookupBtn");
    if (applyCarLookupBtn) applyCarLookupBtn.onclick = async () => {
      if (f.result == null) return;
      state.settings.fuelRate = String(Math.round(f.result * 10) / 10);
      const label = f.region === "us"
        ? [f.year, f.make, f.model].filter(Boolean).join(" ")
        : [f.nonUsMake, f.nonUsModel].filter(Boolean).join(" ");
      state.settings.selectedVehicle = label ? { label, region: f.region } : null;
      await storageSet(SETTINGS_KEY, state.settings);
      state.carLookupForm = null;
      render();
    };
  }

  if (state.reportForm) {
    const r = state.reportForm;
    const typeSelect = document.getElementById("reportType");
    if (typeSelect) typeSelect.onchange = (e) => {
      r.type = e.target.value;
      if (r.type !== "custom") r.fields = (REPORT_DEFAULTS[r.type] || REPORT_DEFAULTS.normal).slice();
      else if (!r.categories.length) r.categories = ["normal"];
      render();
    };
    document.querySelectorAll("[data-reportcat]").forEach(btn => {
      btn.onclick = () => {
        const cat = btn.dataset.reportcat;
        r.categories = r.categories.includes(cat) ? r.categories.filter(c => c !== cat) : [...r.categories, cat];
        render();
      };
    });
    document.querySelectorAll("[data-reportfield]").forEach(btn => {
      btn.onclick = () => {
        const field = btn.dataset.reportfield;
        r.fields = r.fields.includes(field) ? r.fields.filter(f => f !== field) : [...r.fields, field];
        render();
      };
    });
    const fromInput = document.getElementById("reportFrom");
    if (fromInput) fromInput.onchange = (e) => { r.from = e.target.value; };
    const toInput = document.getElementById("reportTo");
    if (toInput) toInput.onchange = (e) => { r.to = e.target.value; };

    const closeBtn = document.getElementById("closeReportBtn");
    if (closeBtn) closeBtn.onclick = () => { state.reportForm = null; render(); };

    const generateBtn = document.getElementById("generateReportBtn");
    if (generateBtn) generateBtn.onclick = () => generateReportPDF();
  }

  if (state.addDrives) {
    const a = state.addDrives;

    const closeBtn = document.getElementById("closeAddDrivesBtn");
    if (closeBtn) closeBtn.onclick = () => { state.addDrives = null; render(); };

    const backBtn = document.getElementById("backAddDrivesBtn");
    if (backBtn) backBtn.onclick = () => {
      a.step = a.step === 3 ? 2 : 1;
      a.error = "";
      render();
    };

    const openMapsBtn = document.getElementById("openMapsBtn");
    if (openMapsBtn) openMapsBtn.onclick = () => {
      window.open("https://www.google.com/maps", "_blank");
    };

    const fileInput = document.getElementById("timelineFileInput");
    if (fileInput) fileInput.onchange = async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      a.error = ""; a.processing = true; render();
      try {
        const text = await file.text();
        const json = JSON.parse(text);
        const points = parseTimelinePoints(json);
        if (!points.length) throw new Error("Couldn't find any location points in that file — make sure it's the Timeline export.");
        a.points = points;
        a.fileName = file.name;
        const minDate = new Date(points[0].t).toISOString().slice(0, 10);
        const maxDate = new Date(points[points.length - 1].t).toISOString().slice(0, 10);
        a.dateFrom = minDate;
        a.dateTo = maxDate;
        a.step = 2;
      } catch (err) {
        a.error = err.message || "Couldn't read that file — make sure it's a Timeline export (.json).";
      }
      a.processing = false;
      render();
    };

    const fromInput = document.getElementById("importFrom");
    if (fromInput) fromInput.onchange = (e) => { a.dateFrom = e.target.value; };
    const toInput = document.getElementById("importTo");
    if (toInput) toInput.onchange = (e) => { a.dateTo = e.target.value; };

    const runImportBtn = document.getElementById("runImportBtn");
    if (runImportBtn) runImportBtn.onclick = async () => {
      if (!a.dateFrom || !a.dateTo) { a.error = "Choose a date range."; render(); return; }
      a.processing = true; a.error = ""; render();
      await new Promise(resolve => setTimeout(resolve, 10)); // let the "processing" state paint before the (synchronous) crunch below
      try {
        const fromMs = new Date(`${a.dateFrom}T00:00:00`).getTime();
        const toMs = new Date(`${a.dateTo}T23:59:59`).getTime();
        const inRange = a.points.filter(p => p.t >= fromMs && p.t <= toMs);
        a.candidates = detectDrivingSegments(inRange);
        if (a.candidates.length) {
          const dists = a.candidates.map(c => kmToDisplay(c.distanceKm));
          a.distFloor = Math.floor(Math.min(...dists) * 10) / 10;
          a.distCeil = Math.max(a.distFloor + 0.1, Math.ceil(Math.max(...dists) * 10) / 10);
          const defaultMin = kmToDisplay(3); // default threshold: hide drives under ~3km
          a.distMin = Math.max(a.distFloor, Math.min(defaultMin, a.distCeil));
        }
        a.step = 3;
      } catch (err) {
        a.error = err.message || "Couldn't process that date range.";
      }
      a.processing = false;
      render();
      if (a.step === 3 && a.candidates.length && mapsConfigured()) geocodeCandidateAddresses(a);
    };

    document.querySelectorAll(".candidateCheckbox").forEach(cb => {
      cb.onchange = (e) => {
        const c = a.candidates.find(x => x.id === cb.dataset.id);
        if (c) c.selected = e.target.checked;
      };
    });

    const distMinSlider = document.getElementById("distMinSlider");
    if (distMinSlider) {
      distMinSlider.oninput = (e) => {
        const v = parseFloat(e.target.value);
        e.target.parentElement.querySelector("span").textContent = `${v.toFixed(1)} ${unitLabel()}`;
      };
      distMinSlider.onchange = (e) => {
        a.distMin = parseFloat(e.target.value);
        render();
      };
    }

    const confirmImportBtn = document.getElementById("confirmImportBtn");
    if (confirmImportBtn) confirmImportBtn.onclick = async () => {
      const chosen = a.candidates.filter(c => c.selected);
      if (!chosen.length) { a.error = "Select at least one drive to add."; render(); return; }
      confirmImportBtn.disabled = true;
      confirmImportBtn.textContent = "Adding…";
      const newTrips = [];
      for (const c of chosen) {
        const startDate = new Date(c.startMs), endDate = new Date(c.endMs);
        const pad = (n) => String(n).padStart(2, "0");
        let startAddr = c.startAddr || `${c.startLat.toFixed(4)}, ${c.startLng.toFixed(4)}`;
        let endAddr = c.endAddr || `${c.endLat.toFixed(4)}, ${c.endLng.toFixed(4)}`;
        if (mapsConfigured() && (!c.startAddr || !c.endAddr)) {
          try { startAddr = await reverseGeocode(c.startLat, c.startLng, true); } catch (e) {}
          try { endAddr = await reverseGeocode(c.endLat, c.endLng, true); } catch (e) {}
        }
        newTrips.push({
          id: uid(),
          date: `${startDate.getFullYear()}-${pad(startDate.getMonth() + 1)}-${pad(startDate.getDate())}`,
          startTime: `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`,
          endTime: `${pad(endDate.getHours())}:${pad(endDate.getMinutes())}`,
          distance: c.distanceKm,
          startPoint: startAddr,
          endPoint: endAddr,
          startLat: c.startLat, startLng: c.startLng, endLat: c.endLat, endLng: c.endLng,
          tag: "normal",
          synced: false,
          importedFromTimeline: true,
        });
      }
      state.trips = [...newTrips, ...state.trips].sort((x, y) => (x.date + x.startTime < y.date + y.startTime ? 1 : -1));
      await storageSet(TRIPS_KEY, state.trips);
      state.addDrives = null;
      render();
    };
  }
}

(async function init() {
  loadGoogleMapsScript();
  state._existingProfile = await storageGet(PROFILE_KEY);
  const savedSettings = await storageGet(SETTINGS_KEY);
  const requirePin = !!savedSettings && savedSettings.requirePin === true;
  state.loadingProfile = false;
  if (state._existingProfile && !requirePin) {
    state.profile = state._existingProfile;
    await loadData();
  }
  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").catch(() => {});
  });
}
</script>
</body>
</html>
