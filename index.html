          </div>
        `; })()}
      ` : ""}
    </div>
  </div>`;
}

function reportFieldValue(t, field) {
  switch (field) {
    case "date": return formatDateForDisplay(t.date);
    case "startTime": return formatTime24(t.startTime) || "";
    case "endTime": return formatTime24(t.endTime) || "";
    case "startPoint": return t.startPoint || "";
    case "endPoint": return t.endPoint || "";
    case "distance": return `${kmToDisplay(t.distance).toFixed(1)} ${unitLabel()}`;
    case "duration": return formatDuration(tripMinutes(t));
    case "purpose": return t.purpose || "";
    case "fuelCost": { const c = tripFuelCost(t); return c != null ? c.toFixed(2) : ""; }
    case "timeOfDay": return t.timeOfDay ? (t.timeOfDay === "day" ? "Day" : "Night") : "";
    case "roadType": return t.roadType ? labelFor(ROAD_TYPES, t.roadType) : "";
    case "weather": return t.weather ? labelFor(WEATHER_TYPES, t.weather) : "";
    case "traffic": return t.traffic ? labelFor(TRAFFIC_LEVELS, t.traffic) : "";
    case "supervisorName": return t.supervisorName || "";
    default: return "";
  }
}

async function generateReportPDF() {
  const r = state.reportForm;
  if (!r.from || !r.to) { r.error = "Choose a date range."; render(); return; }
  const categories = r.type === "custom" ? r.categories : [r.type];
  if (!categories.length) { r.error = "Choose at least one category."; render(); return; }
  const fields = r.fields.length ? r.fields : (REPORT_DEFAULTS[r.type] || REPORT_DEFAULTS.normal);

  // Everything downstream works only off this pre-filtered subset — trips
  // outside the chosen categories/date range never enter the PDF-building
  // code, so "Work only" etc. fully excludes other data, not just hides it.
  const subset = state.trips.filter(t => categories.includes(t.tag) && t.date >= r.from && t.date <= r.to);
  const tableRows = subset.map(t => fields.map(f => reportFieldValue(t, f)));
  const fieldLabels = fields.map(f => (REPORT_FIELD_DEFS.find(d => d.v === f) || {}).l || f);

  state.reportGenerating = true; r.error = ""; render();
  try {
    const jsPDFCtor = await loadJsPDF();
    const doc = new jsPDFCtor();
    const marginX = 14;
    let y = 18;
    doc.setFontSize(16); doc.setFont(undefined, "bold");
    doc.text("Drive Log", marginX, y);
    doc.setFontSize(10); doc.setFont(undefined, "normal");
    y += 7;
    doc.text(`${state.profile ? state.profile.name : ""}`, marginX, y);
    y += 5;
    doc.text(`${r.type === "custom" ? categories.map(c => labelFor(DRIVE_TYPES, c)).join(" + ") : labelFor(DRIVE_TYPES, r.type)} report · ${formatDateForDisplay(r.from)} – ${formatDateForDisplay(r.to)}`, marginX, y);
    y += 9;

    const totalDistance = subset.reduce((s, t) => s + t.distance, 0);
    const byCat = { normal: 0, work: 0, supervised: 0 };
    subset.forEach(t => { byCat[t.tag] = (byCat[t.tag] || 0) + 1; });
    doc.setFont(undefined, "bold"); doc.text("Summary", marginX, y); doc.setFont(undefined, "normal");
    y += 6;
    doc.text(`Total distance: ${kmToDisplay(totalDistance).toFixed(1)} ${unitLabel()}`, marginX, y); y += 5;
    doc.text(`Total drives: ${subset.length}  (Personal ${byCat.normal || 0} · Business ${byCat.work || 0} · Supervised ${byCat.supervised || 0})`, marginX, y);
    y += 10;

    doc.setFont(undefined, "bold"); doc.text("Trips", marginX, y); doc.setFont(undefined, "normal");
    y += 7;

    const pageWidth = doc.internal.pageSize.getWidth();
    const colWidth = (pageWidth - marginX * 2) / fields.length;
    doc.setFontSize(8); doc.setFont(undefined, "bold");
    fieldLabels.forEach((lbl, i) => doc.text(String(lbl), marginX + i * colWidth, y));
    doc.setFont(undefined, "normal");
    y += 4;
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 4;

    tableRows.forEach(row => {
      if (y > doc.internal.pageSize.getHeight() - 16) { doc.addPage(); y = 18; }
      row.forEach((cell, i) => {
        const text = String(cell).slice(0, 22);
        doc.text(text, marginX + i * colWidth, y);
      });
      y += 5;
    });

    if (tableRows.length === 0) { doc.text("No trips in this range.", marginX, y); }

    doc.save(`drive-log-${r.type}-${r.from}-to-${r.to}.pdf`);
    state.reportForm = null;
  } catch (e) {
    r.error = e.message || "Couldn't generate the PDF.";
  }
  state.reportGenerating = false;
  render();
}

// --- Official learner log book PDF (matches the AU state driving-companion
// paper log book layout: per-drive Daytime/Night-time tables plus a
// Declaration-of-hours summary page) ------------------------------------
const LOGBOOK_ROAD_CODE = { sealed: "S", unsealed: "U", quiet: "Q", busy: "B", multilane: "ML" };
const LOGBOOK_WEATHER_CODE = { dry: "D", wet: "W" };
const LOGBOOK_TRAFFIC_CODE = { light: "L", medium: "M", heavy: "H" };
const LOGBOOK_ROWS_PER_PAGE = 16;
const LOGBOOK_COLS = [
  { key: "date", h1: "Date", h2: "", w: 20 },
  { key: "start", h1: "Time", h2: "Start am/pm", w: 16 },
  { key: "finish", h1: "Time", h2: "Finish am/pm", w: 16 },
  { key: "duration", h1: "Time", h2: "Duration", w: 15 },
  { key: "from", h1: "Location (Suburb)", h2: "From", w: 34 },
  { key: "to", h1: "Location (Suburb)", h2: "To", w: 34 },
  { key: "road", h1: "Conditions", h2: "Road", w: 11 },
  { key: "weather", h1: "Conditions", h2: "Weather", w: 14 },
  { key: "traffic", h1: "Conditions", h2: "Traffic", w: 13 },
  { key: "learnerSig", h1: "Learner's Signature", h2: "", w: 20 },
  { key: "supName", h1: "Qualified Supervising Driver", h2: "Full Name", w: 28 },
  { key: "supLicence", h1: "Qualified Supervising Driver", h2: "Licence No.", w: 20 },
  { key: "supSig", h1: "Qualified Supervising Driver", h2: "Signature", w: 20 },
];
function formatDateAU(dateStr) {
  if (!dateStr) return "";
  const d = new Date(`${dateStr}T00:00:00`);
  if (isNaN(d)) return dateStr;
  return `${String(d.getDate()).padStart(2, "0")}/${String(d.getMonth() + 1).padStart(2, "0")}/${d.getFullYear()}`;
}
function resolvedAUStateCode() {
  try {
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    return AU_TIMEZONE_STATE[timezone] || null;
  } catch (e) { return null; }
}
function chunkArray(arr, size) {
  const out = [];
  for (let i = 0; i < arr.length; i += size) out.push(arr.slice(i, i + size));
  return out;
}
function fitText(doc, str, maxW) {
  if (!str) return "";
  let s = String(str);
  while (s.length && doc.getTextWidth(s) > maxW) s = s.slice(0, -1);
  return s;
}
function logBookTripRow(t) {
  return [
    formatDateAU(t.date), formatTime12(t.startTime), formatTime12(t.endTime), String(tripMinutes(t)),
    t.startPoint || "", t.endPoint || "",
    LOGBOOK_ROAD_CODE[t.roadType] || "", LOGBOOK_WEATHER_CODE[t.weather] || "", LOGBOOK_TRAFFIC_CODE[t.traffic] || "",
    "", t.supervisorName || "", t.supervisorLicence || "", "",
  ];
}
function logBookColRuns(cols) {
  const runs = [];
  let i = 0;
  while (i < cols.length) {
    let j = i;
    while (j + 1 < cols.length && cols[j + 1].h1 === cols[i].h1) j++;
    runs.push({ start: i, end: j });
    i = j + 1;
  }
  return runs;
}
// jsPDF's fill color is shared state between setFillColor() and text
// rendering (setTextColor()/text()) — drawing black text after filling a
// cell leaves the fill color clobbered to black, so setFillColor(...) is
// re-applied immediately before every "FD" rect below rather than once
// up front.
function drawLogBookHeader(doc, x0, y0) {
  const rowH = 7;
  let x = x0;
  const colX = LOGBOOK_COLS.map(c => { const cx = x; x += c.w; return cx; });
  doc.setDrawColor(90); doc.setLineWidth(0.2);
  logBookColRuns(LOGBOOK_COLS).forEach(run => {
    const rx = colX[run.start];
    const rw = LOGBOOK_COLS.slice(run.start, run.end + 1).reduce((s, c) => s + c.w, 0);
    const spanTwoRows = run.end === run.start && !LOGBOOK_COLS[run.start].h2;
    doc.setFont(undefined, "bold"); doc.setFontSize(7.3);
    if (spanTwoRows) {
      doc.setFillColor(230, 230, 230);
      doc.rect(rx, y0, rw, rowH * 2, "FD");
      doc.setTextColor(0);
      doc.text(fitText(doc, LOGBOOK_COLS[run.start].h1, rw - 2), rx + rw / 2, y0 + rowH + 1, { align: "center" });
    } else {
      doc.setFillColor(230, 230, 230);
      doc.rect(rx, y0, rw, rowH, "FD");
      doc.setTextColor(0);
      doc.text(fitText(doc, LOGBOOK_COLS[run.start].h1, rw - 2), rx + rw / 2, y0 + rowH / 2 + 1.3, { align: "center" });
      doc.setFontSize(6.6); doc.setFont(undefined, "normal");
      for (let k = run.start; k <= run.end; k++) {
        doc.setFillColor(230, 230, 230);
        doc.rect(colX[k], y0 + rowH, LOGBOOK_COLS[k].w, rowH, "FD");
        doc.setTextColor(0);
        doc.text(fitText(doc, LOGBOOK_COLS[k].h2, LOGBOOK_COLS[k].w - 2), colX[k] + LOGBOOK_COLS[k].w / 2, y0 + rowH * 2 - 1.8, { align: "center" });
      }
    }
  });
  doc.setFont(undefined, "normal");
  return y0 + rowH * 2;
}
function drawLogBookRows(doc, x0, yStart, rows) {
  const rowH = 6.5;
  doc.setFont(undefined, "normal"); doc.setFontSize(7); doc.setTextColor(0);
  let y = yStart;
  rows.forEach(row => {
    let x = x0;
    LOGBOOK_COLS.forEach((c, i) => {
      doc.rect(x, y, c.w, rowH, "S");
      const val = fitText(doc, row[i], c.w - 2);
      if (val) doc.text(val, x + 1.2, y + rowH - 2);
      x += c.w;
    });
    y += rowH;
  });
  return y;
}
function drawLogBookFooter(doc, x0, y, marginRight, opts) {
  const pageWidth = doc.internal.pageSize.getWidth();
  const fullW = pageWidth - x0 - marginRight;
  y += 6;
  doc.setFont(undefined, "bold"); doc.setFontSize(9); doc.setTextColor(0);
  doc.text("Learner's Permit Holder", x0, y);
  doc.setFont(undefined, "normal");
  doc.text(`Sub Total (minutes): ${opts.subTotalMinutes}`, x0 + fullW * 0.62, y, { align: "left" });
  y += 5.5;
  doc.text(`Name: ${opts.learnerName}`, x0, y);
  y += 5;
  doc.text(`Permit No.: ${opts.permitNo}`, x0, y);
  y += 7;

  doc.setFontSize(7.2);
  doc.text("Road Type: Sealed S · Unsealed U · Quiet Street Q · Busy Road B · Multi-laned Road ML", x0, y); y += 4;
  doc.text("Weather: Dry D · Wet W          Traffic Density: Light L · Medium M · Heavy H", x0, y); y += 6;

  doc.setFont(undefined, "bold"); doc.text("Foreign or Interstate Licence", x0, y); doc.setFont(undefined, "normal");
  y += 4.5;
  doc.text(`Country/State: ${opts.foreignInfo.country || "N/A"}   Expiry Date: ${opts.foreignInfo.expiry || "N/A"}   Yrs Held: ${opts.foreignInfo.years || "N/A"}`, x0, y);
  y += 6;

  doc.setFont(undefined, "italic"); doc.setFontSize(6.4); doc.setTextColor(90);
  const warn = "Warning: Heavy penalties apply for false entries. If the Qualified Supervising Driver's licence cannot be validated, the entry will be rejected and any licence issued will be void. Incomplete entries are invalid.";
  doc.text(doc.splitTextToSize(warn, fullW), x0, y);
  doc.setFont(undefined, "normal"); doc.setTextColor(0);
}
// Draws one physical "form" page (one Daytime or Night-time table + its own
// Sub Total footer, mirroring how the paper log book paginates) and returns
// that page's total minutes.
function drawLogBookFormPage(doc, { sectionLabel, formNo, rows, learnerName, permitNo, foreignInfo }) {
  const marginX = 12, marginTop = 12, marginRight = 12;
  let y = marginTop;
  doc.setFont(undefined, "bold"); doc.setFontSize(14); doc.setTextColor(0);
  doc.text(`Record of ${sectionLabel} Driving Hours`, marginX, y);
  doc.setFont(undefined, "normal"); doc.setFontSize(9);
  doc.text(`Form ${formNo}`, doc.internal.pageSize.getWidth() - marginRight, y, { align: "right" });
  y += 7;

  y = drawLogBookHeader(doc, marginX, y);
  y = drawLogBookRows(doc, marginX, y, rows);
  const subTotalMinutes = rows.reduce((s, r) => s + (parseInt(r[3], 10) || 0), 0);
  drawLogBookFooter(doc, marginX, y, marginRight, { learnerName, permitNo, foreignInfo, subTotalMinutes });
  return subTotalMinutes;
}

async function generateLogBookPDF() {
  const f = state.logBookForm;
  f.error = "";
  if (!f.learnerName.trim()) { f.error = "Enter the learner's full name."; render(); return; }
  if (!f.permitNo.trim()) { f.error = "Enter the learner's permit number."; render(); return; }
  if (!f.from || !f.to) { f.error = "Choose a date range."; render(); return; }

  const subset = state.trips
    .filter(t => t.tag === "supervised" && t.date >= f.from && t.date <= f.to)
    .sort((a, b) => (a.date + formatTime24(a.startTime)).localeCompare(b.date + formatTime24(b.startTime)));
  if (!subset.length) { f.error = "No supervised drives found in that date range."; render(); return; }

  state.logBookGenerating = true; render();
  try {
    state.settings.learnerName = f.learnerName.trim();
    state.settings.learnerPermitNo = f.permitNo.trim();
    state.settings.hasForeignLicence = f.hasForeignLicence;
    state.settings.foreignLicenceCountryState = f.foreignCountryState.trim();
    state.settings.foreignLicenceExpiry = f.foreignExpiry;
    state.settings.foreignLicenceYearsHeld = f.foreignYearsHeld;
    await storageSet(SETTINGS_KEY, state.settings);

    const foreignInfo = f.hasForeignLicence
      ? { country: f.foreignCountryState.trim(), expiry: f.foreignExpiry ? formatDateAU(f.foreignExpiry) : "", years: f.foreignYearsHeld }
      : { country: "", expiry: "", years: "" };

    const dayTrips = subset.filter(t => (t.timeOfDay || "day") !== "night");
    const nightTrips = subset.filter(t => t.timeOfDay === "night");
    const dayPages = chunkArray(dayTrips, LOGBOOK_ROWS_PER_PAGE);
    const nightPages = chunkArray(nightTrips, LOGBOOK_ROWS_PER_PAGE);

    const jsPDFCtor = await loadJsPDF();
    const doc = new jsPDFCtor({ orientation: "landscape", unit: "mm", format: "a4" });
    let firstPage = true;
    let formNo = 0;
    const dayForms = [], nightForms = [];

    dayPages.forEach(pageTrips => {
      if (!firstPage) doc.addPage("a4", "landscape"); firstPage = false;
      formNo++;
      const minutes = drawLogBookFormPage(doc, {
        sectionLabel: "Daytime", formNo, rows: pageTrips.map(logBookTripRow),
        learnerName: f.learnerName.trim(), permitNo: f.permitNo.trim(), foreignInfo,
      });
      dayForms.push({ formNo, minutes });
    });
    nightPages.forEach(pageTrips => {
      if (!firstPage) doc.addPage("a4", "landscape"); firstPage = false;
      formNo++;
      const minutes = drawLogBookFormPage(doc, {
        sectionLabel: "Night-time", formNo, rows: pageTrips.map(logBookTripRow),
        learnerName: f.learnerName.trim(), permitNo: f.permitNo.trim(), foreignInfo,
      });
      nightForms.push({ formNo, minutes });
    });

    // --- Declaration of hours summary page ---------------------------
    if (!firstPage) doc.addPage("a4", "portrait"); firstPage = false;
    const totalTargetMin = Math.round((state.settings.supervisedTotalHoursTarget || 75) * 60);
    const nightTargetMin = Math.round((state.settings.supervisedNightHoursTarget || 15) * 60);
    const dayTotal = dayForms.reduce((s, r) => s + r.minutes, 0);
    const nightTotal = nightForms.reduce((s, r) => s + r.minutes, 0);
    const pw = doc.internal.pageSize.getWidth();
    const mx = 16;
    let y = 18;
    doc.setFont(undefined, "bold"); doc.setFontSize(15);
    doc.text(`Declaration of ${totalTargetMin.toLocaleString()} minutes (${state.settings.supervisedTotalHoursTarget || 75} hours) of driving time`, mx, y, { maxWidth: pw - mx * 2 });
    y += 10;

    function formsTable(title, forms) {
      doc.setFont(undefined, "bold"); doc.setFontSize(10); doc.text(title, mx, y); y += 5;
      doc.setFontSize(8); doc.setFont(undefined, "bold");
      doc.text("Form No.", mx, y); doc.text("Minutes Sub Total", mx + 35, y); doc.text("Running Total", mx + 90, y);
      y += 3.5; doc.setLineWidth(0.2); doc.line(mx, y, mx + 140, y); y += 4;
      doc.setFont(undefined, "normal");
      let running = 0;
      if (!forms.length) { doc.setTextColor(120); doc.text("None", mx, y); doc.setTextColor(0); y += 5; }
      forms.forEach(r => {
        running += r.minutes;
        doc.text(String(r.formNo), mx, y);
        doc.text(String(r.minutes), mx + 35, y);
        doc.text(String(running), mx + 90, y);
        y += 5;
      });
      y += 1;
      doc.setFont(undefined, "bold");
      doc.text(`${title.replace(" driving", " total")}: ${running} minutes`, mx, y);
      doc.setFont(undefined, "normal");
      y += 8;
      return running;
    }
    formsTable("Daytime driving", dayForms);
    formsTable("Night-time driving", nightForms);

async function syncUnsyncedTrips() {
  if (!state.sheetLink) return;
  const unsynced = state.trips.filter(t => !t.synced);
  let anyFailed = false;
  for (const t of unsynced) {
    try {
      await appendTripToSheet(state.sheetLink.spreadsheetId, t);
      t.synced = true;
    } catch (e) {
      anyFailed = true;
    }
  }
  if (unsynced.length) {
    await storageSet(TRIPS_KEY, state.trips);
    // Only touch googleError when this pass actually had something to sync —
    // otherwise a no-op call (e.g. right after connecting, before any drive
    // exists) blindly clears whatever message the caller just set, such as
    // the debug line connectBtn.onclick shows for a moment before this
    // unawaited call's own render() stomps on it.
    state.googleError = anyFailed ? "Some drives didn't sync to Sheets — open Settings to try again." : "";
  }
  // A sync pass (even one that finds nothing to send) counts as a check-in for the reminder timer.
  state.settings.lastSyncAt = todayStr();
  await storageSet(SETTINGS_KEY, state.settings);
  let backupFailed = false;
  try {
    await backupSettingsToSheet(state.sheetLink.spreadsheetId, await getFreshGoogleToken());
  } catch (e) {
    backupFailed = true;
    console.warn("Settings backup failed", e);
  }
  // Same rule as above: only touch googleError when this pass actually had
  // something new to report, so a clean no-op backup doesn't stomp on a
  // message the caller just set (e.g. right after importing/restoring).
  if (unsynced.length || backupFailed) {
    state.googleError = anyFailed
      ? "Some drives didn't sync to Sheets — open Settings to try again."
      : backupFailed
      ? "Drives synced, but the settings backup failed — open Settings to try again."
      : "";
  }
  render();
}

// Bounding-box midpoint of a set of points -- used to center a Static Maps
// request ourselves instead of leaving it to the API's own marker/path
// auto-fit, which reliably comes out biased toward one side of the actual
// route (confirmed side by side against several real requests: the
// route consistently sits low/left of center with auto-fit, dead center
// once this is passed explicitly). zoom is deliberately left for the API
// to keep auto-fitting on its own -- giving it a center is enough for
// that same auto-fit to also frame the markers/path correctly; it's only
// the centering half that needed overriding.
function centerOfBounds(points) {
  if (!points.length) return null;
  let minLat = points[0].lat, maxLat = points[0].lat, minLng = points[0].lng, maxLng = points[0].lng;
  for (const p of points) {
    if (p.lat < minLat) minLat = p.lat; if (p.lat > maxLat) maxLat = p.lat;
    if (p.lng < minLng) minLng = p.lng; if (p.lng > maxLng) maxLng = p.lng;
  }
  return { lat: (minLat + maxLat) / 2, lng: (minLng + maxLng) / 2 };
}
// A small route-thumbnail image via Google's Static Maps API -- a real
// interactive map isn't available once a drive is over (no live Map
// instance to screenshot), and this is a separate, simpler REST API that
// just needs start/end coordinates, not a running JS map. Kept modest in
// size (a plain, non-retina 320x180) since it's stored as a base64 data URL
// inline on the trip itself alongside everything else in local storage --
// full-resolution/retina images across hundreds of trips would add up fast
// against a browser's local storage quota.
function staticMapUrlForTrip(trip) {
  const hasStart = trip.startLat != null, hasEnd = trip.endLat != null;
  if (!hasStart && !hasEnd) return null;
  const points = [];
  if (hasStart) points.push({ lat: trip.startLat, lng: trip.startLng });
  if (hasEnd) points.push({ lat: trip.endLat, lng: trip.endLng });
  const center = centerOfBounds(points);
  const params = new URLSearchParams({ size: "320x180", maptype: "roadmap", key: GOOGLE_MAPS_API_KEY });
  if (center) params.set("center", `${center.lat},${center.lng}`);
  if (hasStart) params.append("markers", `color:0x4C9F70|label:A|${trip.startLat},${trip.startLng}`);
  if (hasEnd) params.append("markers", `color:0xE5484D|label:B|${trip.endLat},${trip.endLng}`);
  if (hasStart && hasEnd) params.append("path", `color:0x4C9FF2|weight:4|${trip.startLat},${trip.startLng}|${trip.endLat},${trip.endLng}`);
  return `https://maps.googleapis.com/maps/api/staticmap?${params.toString()}`;
}
// Same shape as staticMapUrlForTrip, for the Trip Planner's pre-trip "Log
// Drive" window -- traces the actual planned route (already computed and
// on screen at this point, via plannerDirectionsResult) rather than a
// straight line between the first and last stop, since the real shape is
// already known and a straight line across several stops would be
// noticeably wrong for anything but a direct A-to-B route.
function staticMapUrlForPlannerRoute() {
  const p = state.planner;
  if (!p) return null;
  const first = p.stops[0], last = p.stops[p.stops.length - 1];
  // Every stop strictly between the first and last -- a genuinely
  // multi-leg trip's whole point (the "stops" the other maps already mark
  // in orange) was otherwise missing here entirely, only ever showing
  // Start/End regardless of how many legs the drive actually had.
  const middle = p.stops.slice(1, -1).filter(s => s.lat != null);
  const hasStart = first && first.lat != null, hasEnd = last && last.lat != null;
  if (!hasStart && !hasEnd) return null;
  const overview = (plannerDirectionsResult && plannerDirectionsResult.routes[0])
    ? plannerDirectionsResult.routes[0].overview_path.map(ll => ({ lat: ll.lat(), lng: ll.lng() }))
    : [];
  const points = overview.length > 1 ? overview.slice() : [];
  if (hasStart) points.push({ lat: first.lat, lng: first.lng });
  middle.forEach(s => points.push({ lat: s.lat, lng: s.lng }));
  if (hasEnd) points.push({ lat: last.lat, lng: last.lng });
  const center = centerOfBounds(points);
  const params = new URLSearchParams({ size: "320x180", maptype: "roadmap", key: GOOGLE_MAPS_API_KEY });
  if (center) params.set("center", `${center.lat},${center.lng}`);
  if (hasStart) params.append("markers", `color:0x4C9F70|label:A|${first.lat},${first.lng}`);
  middle.forEach(s => params.append("markers", `color:0xE0642C|${s.lat},${s.lng}`));
  if (hasEnd) params.append("markers", `color:0xE5484D|label:B|${last.lat},${last.lng}`);
  if (overview.length > 1) params.append("path", `color:0x4C9FF2|weight:4|enc:${encodePolyline(overview)}`);
  else if (hasStart && hasEnd) params.append("path", `color:0x4C9FF2|weight:4|${first.lat},${first.lng}|${last.lat},${last.lng}`);
  return `https://maps.googleapis.com/maps/api/staticmap?${params.toString()}`;
}
// Fetches that thumbnail and inlines it as a data URL directly on the trip
// object, so it persists in the same local trips array/storage entry as
// everything else -- no separate asset store, no broken image if a URL
// (tied to this app's own API key) ever stopped resolving later. Best-
// effort: a failed fetch (offline, no coordinates, the Static Maps API not
// enabled for this key, etc.) just leaves the trip without an image rather
// than blocking the save over it.
async function attachTripSummaryImage(trip) {
  if (!mapsConfigured()) return;
  const url = staticMapUrlForTrip(trip);
  if (!url) return;
  try {
    const res = await fetch(url);
    if (!res.ok) return;
    const blob = await res.blob();
    trip.summaryImage = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  } catch (e) {
    // Best-effort — a missing thumbnail never blocks saving the trip
    // itself. Logged rather than swallowed outright since a wrong Cloud
    // Console setup (Static Maps API not enabled for this key) would
    // otherwise silently mean every single trip saves with no image at
    // all, with nothing in the UI ever pointing at why.
    console.warn("Static map thumbnail failed", e);
  }
}

// Standard Google encoded-polyline algorithm (the same format Directions
// results and Static Maps' path=enc:... both use) -- turns a GPS breadcrumb
// trail into a compact ASCII string instead of a raw comma-separated list
// of coordinates, which for a real drive (hundreds of points) would blow
// past the Static Maps API's URL length limit.
function encodePolyline(points) {
  let lastLat = 0, lastLng = 0, result = "";
  const encodeValue = (v) => {
    v = v < 0 ? ~(v << 1) : v << 1;
    let out = "";
    while (v >= 0x20) { out += String.fromCharCode((0x20 | (v & 0x1f)) + 63); v >>= 5; }
    return out + String.fromCharCode(v + 63);
  };
  for (const p of points) {
    const lat = Math.round(p.lat * 1e5), lng = Math.round(p.lng * 1e5);
    result += encodeValue(lat - lastLat) + encodeValue(lng - lastLng);
    lastLat = lat; lastLng = lng;
  }
  return result;
}

// The detailed route image lives in IndexedDB, not the main trips array --
// unlike the small thumbnail above, it's fetched only when actually opened
// (see the trip editor), and a browser's IndexedDB quota is typically far
// larger than localStorage's, which is what the rest of this app's storage
// (including every trip's own small thumbnail) shares.
const ROUTE_IMAGE_DB_NAME = "driving-log-route-images";
const ROUTE_IMAGE_STORE = "images";
function openRouteImageDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("IndexedDB unavailable")); return; }
    const req = indexedDB.open(ROUTE_IMAGE_DB_NAME, 1);
    req.onupgradeneeded = () => { req.result.createObjectStore(ROUTE_IMAGE_STORE); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function putTripRouteImage(tripId, dataUrl) {
  const db = await openRouteImageDB();
  await new Promise((resolve, reject) => {
    const tx = db.transaction(ROUTE_IMAGE_STORE, "readwrite");
    tx.objectStore(ROUTE_IMAGE_STORE).put(dataUrl, tripId);
    tx.oncomplete = resolve;
    tx.onerror = () => reject(tx.error);
  });
}
async function getTripRouteImage(tripId) {
  try {
    const db = await openRouteImageDB();
    return await new Promise((resolve, reject) => {
      const req = db.transaction(ROUTE_IMAGE_STORE, "readonly").objectStore(ROUTE_IMAGE_STORE).get(tripId);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  } catch (e) { return null; }
}
async function deleteTripRouteImage(tripId) {
  try {
    const db = await openRouteImageDB();
    await new Promise((resolve, reject) => {
      const tx = db.transaction(ROUTE_IMAGE_STORE, "readwrite");
      tx.objectStore(ROUTE_IMAGE_STORE).delete(tripId);
      tx.oncomplete = resolve;
      tx.onerror = () => reject(tx.error);
    });
  } catch (e) { /* best-effort cleanup */ }
}
// Clear All Drive History wipes every trip at once -- dropping the whole
// database is simpler and just as correct as deleting each trip's image
// individually.
function clearAllRouteImages() {
  try { indexedDB.deleteDatabase(ROUTE_IMAGE_DB_NAME); } catch (e) { /* best-effort cleanup */ }
}

// Bigger than the thumbnail (a real image worth zooming into) and, when
// pathPoints (the actual driven breadcrumb trail — see handleLiveFix) is
// available, draws the real route instead of a straight line. Quick Drive
// and other manually-logged trips never have pathPoints, so they still
// just get the two markers, same as the small thumbnail.
function detailedStaticMapUrlForTrip(trip, pathPoints) {
  const hasStart = trip.startLat != null, hasEnd = trip.endLat != null;
  if (!hasStart && !hasEnd) return null;
  // The real driven path (when available) is what actually needs to be
  // centered/fit correctly here -- a curvy or looping GPS trail is exactly
  // the shape the API's own marker-biased auto-fit (see centerOfBounds)
  // tends to frame off-center, more so than the simple two-point case.
  const points = (pathPoints && pathPoints.length > 1) ? pathPoints.slice() : [];
  if (hasStart) points.push({ lat: trip.startLat, lng: trip.startLng });
  if (hasEnd) points.push({ lat: trip.endLat, lng: trip.endLng });
  const center = centerOfBounds(points);
  const params = new URLSearchParams({ size: "640x400", scale: "2", maptype: "roadmap", key: GOOGLE_MAPS_API_KEY });
  if (center) params.set("center", `${center.lat},${center.lng}`);
  if (hasStart) params.append("markers", `color:0x4C9F70|label:A|${trip.startLat},${trip.startLng}`);
  if (hasEnd) params.append("markers", `color:0xE5484D|label:B|${trip.endLat},${trip.endLng}`);
  if (pathPoints && pathPoints.length > 1) {
    params.append("path", `color:0x4C9FF2|weight:4|enc:${encodePolyline(pathPoints)}`);
  } else if (hasStart && hasEnd) {
    params.append("path", `color:0x4C9FF2|weight:4|${trip.startLat},${trip.startLng}|${trip.endLat},${trip.endLng}`);
  }
  return `https://maps.googleapis.com/maps/api/staticmap?${params.toString()}`;
}

// One shared "Drive Log Route Images" folder for every upload, found once
// per session and reused rather than searched-for on every single trip.
let driveImagesFolderId = null;
async function ensureDriveImagesFolder(token) {
  if (driveImagesFolderId) return driveImagesFolderId;
  const q = encodeURIComponent("name = 'Drive Log Route Images' and mimeType = 'application/vnd.google-apps.folder' and trashed = false and 'me' in owners");
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id)`, { headers: { Authorization: "Bearer " + token } });
  if (res.ok) {
    const data = await res.json();
    if (data.files && data.files[0]) { driveImagesFolderId = data.files[0].id; return driveImagesFolderId; }
  }
  const createRes = await fetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST", headers: { Authorization: "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ name: "Drive Log Route Images", mimeType: "application/vnd.google-apps.folder" }),
  });
  if (!createRes.ok) throw new Error("Couldn't create Drive folder: " + createRes.status);
  const created = await createRes.json();
  driveImagesFolderId = created.id;
  return driveImagesFolderId;
}
// Needs the drive.file scope added to GOOGLE_SCOPES -- a token cached from
// before that scope existed won't carry it, which surfaces here as a 403;
// the caller just leaves the trip without a Drive link rather than failing
// the whole save over it (see attachTripDetailedImage).
async function uploadTripImageToDrive(trip, blob) {
  const token = await getFreshGoogleToken();
  const folderId = await ensureDriveImagesFolder(token);
  const metadata = { name: `${trip.date}-${trip.id}.png`, parents: [folderId] };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(metadata)], { type: "application/json" }));
  form.append("file", blob);
  const res = await fetch("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,webViewLink", {
    method: "POST", headers: { Authorization: "Bearer " + token }, body: form,
  });
  if (!res.ok) throw new Error("Drive upload failed: " + res.status);
  const data = await res.json();
  return data.webViewLink || null;
}
// Generates the detailed image, stores it locally in IndexedDB (fetched
// only when the trip is actually opened — see openTripEditor), and, when
// connected to Sheets, also uploads it to Drive and keeps the link on the
// trip so it round-trips through the sheet (see appendTripToSheet). Each
// step is independently best-effort: a Drive upload failure (e.g. the
// account hasn't reconnected since drive.file was added) still leaves the
// image saved locally.
async function attachTripDetailedImage(trip, pathPoints) {
  if (!mapsConfigured()) return;
  const url = detailedStaticMapUrlForTrip(trip, pathPoints);
  if (!url) return;
  try {
    const res = await fetch(url);
    if (!res.ok) return;
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
    await putTripRouteImage(trip.id, dataUrl);
    trip.hasDetailedImage = true;
    if (state.sheetLink) {
      try {
        const link = await uploadTripImageToDrive(trip, blob);
        if (link) trip.routeImageLink = link;
      } catch (e) { console.warn("Couldn't upload detailed route image to Drive — reconnect Google Sync if this keeps happening", e); }
    }
  } catch (e) { console.warn("Detailed route image failed", e); }
}

async function finalizeTrip(trip) {
  trip.synced = false;
  await attachTripSummaryImage(trip);
  if (trip._pathPoints) {
    await attachTripDetailedImage(trip, trip._pathPoints);
    delete trip._pathPoints;
  }
  state.trips = [trip, ...state.trips];
  await storageSet(TRIPS_KEY, state.trips);
  await addRecentLocations([trip.startPoint, trip.endPoint]);
  if (trip.tag === "supervised") checkSupervisedLicenceComplete();
  // Drives stay local — sync happens only when the user taps "Sync Now" (or the periodic reminder).
}

// Auto-reveal the full start→end address on each History row: any route
// cell whose text is truncated starts a continuous marquee scroll after a
// short idle delay so the whole address eventually passes into view. All
// rows share one loop distance/duration (shorter addresses just get more
// trailing gap padding) so every row starts and loops in lockstep, and the
// loop advances by the exact pixel distance between the two text copies so
// it never visibly jumps.
// Same 3-second-delayed marquee as attachRouteAutoScroll, for the single
// hazard/warnings line in the Trip Planner's route summary card.
function armStaticHazardMarquee() {
  const track = document.getElementById("plannerHazardTrack");
  const clip = document.getElementById("plannerHazardClip");
  if (!track || !clip) return;
  const singleWidth = track.scrollWidth;
  if (singleWidth <= clip.clientWidth + 2) return;
  const text = track.textContent;
  const gapPx = 48, distance = singleWidth + gapPx, duration = Math.max(4, distance / 26);
  track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
  track.animate(
    [{ transform: "translateX(0px)" }, { transform: `translateX(-${distance}px)` }],
    { duration: duration * 1000, iterations: Infinity, easing: "linear", delay: 3000 }
  );
}

// Same lockstep-looping marquee as attachRouteAutoScroll, scoped to the
// road/suburb line of each leg row in a route summary card (pre- or
// post-drive) instead of History's route cells.
function armPlannerLegRouteMarquee() {
  const entries = [];
  document.querySelectorAll(".planner-leg-route-line .route-clip").forEach(clip => {
    const track = clip.querySelector(".route-track");
    if (!track) return;
    const singleWidth = track.scrollWidth;
    if (singleWidth <= clip.clientWidth + 2) return; // fits already — no marquee needed
    entries.push({ track, singleWidth, text: track.textContent });
  });
  if (!entries.length) return;
  const minGapPx = 40;
  const targetDistance = Math.max(...entries.map(e => e.singleWidth)) + minGapPx;
  const speedPxPerSec = 26;
  const duration = Math.max(4, targetDistance / speedPxPerSec);
  entries.forEach(({ track, singleWidth, text }) => {
    const gapPx = targetDistance - singleWidth;
    track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
    track.animate(
      [{ transform: "translateX(0px)" }, { transform: `translateX(-${targetDistance}px)` }],
      { duration: duration * 1000, iterations: Infinity, easing: "linear", delay: 3000 }
    );
  });
}

// Long-press (touch or mouse hold) on an element, without hijacking a normal
// tap/click or the page's vertical scroll gesture. Cancels if the pointer
// moves more than a few px (a scroll/drag in progress, not a hold-in-place).
function attachLongPress(el, onLongPress, ms) {
  if (!el) return;
  let timer = null, startX = 0, startY = 0;
  const clear = () => {
    if (timer) clearTimeout(timer);
    timer = null;
    el.classList.remove("long-pressing");
  };
  el.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "mouse" && e.button !== 0) return;
    startX = e.clientX; startY = e.clientY;
    clear();
    el.classList.add("long-pressing");
    timer = setTimeout(() => { clear(); onLongPress(e); }, ms || 550);
  });
  el.addEventListener("pointerup", clear);
  el.addEventListener("pointercancel", clear);
  el.addEventListener("pointerleave", clear);
  el.addEventListener("pointermove", (e) => {
    if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) clear();
  });
}

// Opens the edit modal for a single trip — shared by the History table's
// Edit-mode pencil button and long-pressing a row directly.
function openTripEditor(tripId) {
  const trip = state.trips.find(t => t.id === tripId);
  if (!trip) return;

}

function attachRouteAutoScroll() {
  const entries = [];
  document.querySelectorAll(".route-cell").forEach(cell => {
    const clip = cell.querySelector(".route-clip");
    const track = clip && clip.querySelector(".route-track");
    if (!clip || !track) return;
    const singleWidth = track.scrollWidth;
    if (singleWidth <= clip.clientWidth + 2) return; // fits already — no marquee needed
    entries.push({ track, singleWidth, text: track.textContent });
  });
  if (!entries.length) return;

  const minGapPx = 56;
  const targetDistance = Math.max(...entries.map(e => e.singleWidth)) + minGapPx;
  const speedPxPerSec = 26;
  const duration = Math.max(4, targetDistance / speedPxPerSec);

  entries.forEach(({ track, singleWidth, text }) => {
    const gapPx = targetDistance - singleWidth; // shorter text gets a bigger trailing gap, so every row shares the same loop distance
    track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
    track.animate(
      [{ transform: "translateX(0px)" }, { transform: `translateX(-${targetDistance}px)` }],
      { duration: duration * 1000, iterations: Infinity, easing: "linear", delay: 3000 }
    );
  });
}

// Log page: Start/End Location fields show a scrolling preview of the full
// address once a *real* selection has been made (autocomplete pick, saved
// address chip, or "use my location") — not for arbitrary typed text — and
// only after a 3-second pause, so it never interrupts someone mid-typing.
// Manually editing the field, or focusing it again, cancels the preview.
const LOC_MARQUEE_DELAY_MS = 3000;
const LOC_MARQUEE_SPEED = 26;
const locMarquees = {};

function setupLocationMarquee(inputId) {
  const input = document.getElementById(inputId);
  const wrap = input && input.closest(".loc-field-wrap");
  const overlay = wrap && wrap.querySelector(".loc-overlay");
  const clip = overlay && overlay.querySelector(".route-clip");
  const track = clip && clip.querySelector(".route-track");
  if (!input || !overlay || !clip || !track) { locMarquees[inputId] = null; return; }

  let timer = null;
  let animation = null;

  function cancel() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (animation) { animation.cancel(); animation = null; }
    overlay.style.display = "none";
  }

  function arm() {
    cancel();
    const text = input.value;
    if (!text || !text.trim()) return;
    timer = setTimeout(() => {
      timer = null;
      if (document.activeElement === input) return; // mid-edit — don't cover the field
      track.textContent = text;
      overlay.style.display = "flex";
      requestAnimationFrame(() => {
        const singleWidth = track.scrollWidth;
        if (singleWidth <= clip.clientWidth + 2) { overlay.style.display = "none"; return; }
        const gapPx = 48;
        track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
        const distance = singleWidth + gapPx;
        const duration = Math.max(4, distance / LOC_MARQUEE_SPEED);
        animation = track.animate(
          [{ transform: "translateX(0px)" }, { transform: `translateX(-${distance}px)` }],
          { duration: duration * 1000, iterations: Infinity, easing: "linear" }
        );
      });
    }, LOC_MARQUEE_DELAY_MS);
  }

  input.addEventListener("focus", cancel);
  input.addEventListener("input", cancel);
  // Selecting all here too, not just relying on the input's own onfocus
  // handler to pick it up once .focus() below fires it -- a tap that lands
  // on this overlay (covering the input whenever its marquee is showing,
  // i.e. whenever the address is long enough to scroll) is one hop further
  // removed from the original user gesture than tapping the input
  // directly, which is apparently enough for some mobile browsers to no
  // longer treat the resulting .select() as trusted. Calling it directly,
  // in the same handler as the tap that's covered by this overlay in the
  // first place, keeps it inside that original gesture.
  overlay.onclick = () => { cancel(); input.focus(); input.select(); };

  locMarquees[inputId] = { arm, cancel };
}

function armLocationMarquee(inputId) {
  const m = locMarquees[inputId];
  if (m) m.arm();
}

// The active-trip "From X at HH:MM" line — the start point there is already
// a confirmed, in-use address, so its preview just needs the same 3s pause.
function attachActiveStartMarquee() {
  const track = document.getElementById("activeStartPointTrack");
  const clip = track && track.closest(".route-clip");
  if (!track || !clip) return;
  const text = track.textContent;
  if (!text) return;
  setTimeout(() => {
    requestAnimationFrame(() => {
      const singleWidth = track.scrollWidth;
      if (singleWidth <= clip.clientWidth + 2) return;
      const gapPx = 48;
      track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
      const distance = singleWidth + gapPx;
      const duration = Math.max(4, distance / LOC_MARQUEE_SPEED);
      track.animate(
        [{ transform: "translateX(0px)" }, { transform: `translateX(-${distance}px)` }],
        { duration: duration * 1000, iterations: Infinity, easing: "linear" }
      );
    });
  }, LOC_MARQUEE_DELAY_MS);
}

        let existing = [];
        // TEMPORARY debug visibility: a relaxed query (name contains,
        // any owner) still turned up nothing despite matching sheets
        // visibly sitting in the same account, which means either the
        // search is quietly erroring or it's genuinely running and
        // returning zero — this makes that distinction visible in
        // Settings without needing dev tools, whichever branch runs below.
        try {
          existing = await findExistingDriveLogSheets(token);
          state.googleError = `Debug: Drive search found ${existing.length} match(es)${existing.length ? ": " + existing.map(f => f.name).join(", ") : ""}.`;
        } catch (e) {
          console.warn("Drive Log sheet search failed — creating a new sheet instead of offering to reuse one.", e);
          state.googleError = `Debug: Drive search failed — ${(e && e.message) || e}.`;
        }
        if (existing.length) {
          state.sheetChoiceCandidates = existing;
          state.googleBusy = false; render();
          return;
        }
        const { spreadsheetId, url } = await createDriveLogSheet(token);
        state.sheetLink = { spreadsheetId, url };
        await storageSet(SHEET_LINK_KEY, state.sheetLink);
        syncUnsyncedTrips();
      } catch (e) {
        // getGoogleToken's own timeout/library-missing errors already say
        // exactly what went wrong (e.g. a popup that never completed) —
        // worth showing verbatim rather than flattening to one generic
        // message that would hide that detail.
        state.googleError = (e && e.message) || "Couldn't connect. Make sure you allow the sign-in popup and try again.";

  // renderConditionsFields(f) gets inlined or shown standalone (see its own
  // comment) -- one binding pass reused everywhere those fields appear,
  // rather than copying this out again at each call site.
  function bindConditionsFields(f) {
    const bind = (id, key) => {
      const el = document.getElementById(id);
      if (el) el.onchange = (e) => { f[key] = e.target.value; };
    };
    bind("condTimeOfDay", "timeOfDay");
    bind("condRoadType", "roadType");
    bind("condWeather", "weather");
    bind("condTraffic", "traffic");

    const supSelect = document.getElementById("condSupervisor");
    if (supSelect) supSelect.onchange = (e) => {
      if (e.target.value === "__new__") {
        state.addingSupervisor = true;
        f.supervisorId = "";
      } else {
        state.addingSupervisor = false;
        f.supervisorId = e.target.value;

      render();

    if (newName) newName.oninput = (e) => { state.newSupervisorName = e.target.value; };

    if (newLic) newLic.oninput = (e) => { state.newSupervisorLicence = e.target.value; };

    const saveSupBtn = document.getElementById("saveSupervisorBtn");
    if (saveSupBtn) saveSupBtn.onclick = async () => {
      const name = state.newSupervisorName.trim();
      const licence = state.newSupervisorLicence.trim();
      if (!name || !licence) return;
      const sup = { id: uid(), name, licence };
      state.supervisors = [...state.supervisors, sup];
      await storageSet(SUPERVISORS_KEY, state.supervisors);
      f.supervisorId = sup.id;
      state.addingSupervisor = false;
      state.newSupervisorName = ""; state.newSupervisorLicence = "";
      render();
    };
  }

  if (state.pendingTrip || state.pendingPlannerTrips) {
    const f = state.conditionsForm;
    bindConditionsFields(f);

    const backBtn = document.getElementById("backConditionsBtn");
    if (backBtn) backBtn.onclick = () => {
      state.pendingTrip = null;
      state.pendingPlannerTrips = null;
      state.addingSupervisor = false;
      render();
    };

    const saveTripBtn = document.getElementById("saveConditionsTripBtn");
    if (saveTripBtn) saveTripBtn.onclick = async () => {
      const sup = state.supervisors.find(s => s.id === f.supervisorId);
      if (sup) {
        state.settings.lastSupervisorId = sup.id;
        await storageSet(SETTINGS_KEY, state.settings);
      }
      const conditions = {
        timeOfDay: f.timeOfDay, roadType: f.roadType, weather: f.weather, traffic: f.traffic,
        supervisorName: sup ? sup.name : "", supervisorLicence: sup ? sup.licence : "",
      };
      if (state.pendingPlannerTrips) {
        // Only the Supervised-tagged trips in this batch actually get the
        // conditions -- a Personal or Business leg saved in the same drive
        // has nothing to do with them.
        const trips = state.pendingPlannerTrips.map(t => t.tag === "supervised" ? { ...t, ...conditions } : t);
        state.pendingPlannerTrips = null;
        for (const trip of trips) await finalizeTrip(trip);
        const p = state.planner;
        if (p) p.saved = true;
      } else {
        const trip = { ...state.pendingTrip, ...conditions };
        state.pendingTrip = null;
        await finalizeTrip(trip);
      }
      render();
    };

      const startMin = (() => { const [h, m] = s.startTime.split(":").map(Number); return h * 60 + m; })();
      let endMin = (() => { const [h, m] = s.endTime.split(":").map(Number); return h * 60 + m; })();

      const totalMin = endMin - startMin;
      const ratio = (splitMin - startMin) / totalMin;

        newTrips.push({
          id: uid(),
          date: `${startDate.getFullYear()}-${pad(startDate.getMonth() + 1)}-${pad(startDate.getDate())}`,
          startTime: `${pad(startDate.getHours())}:${pad(startDate.getMinutes())}`,
          endTime: `${pad(endDate.getHours())}:${pad(endDate.getMinutes())}`,
          distance: c.distanceKm,
          startPoint: startAddr,
          endPoint: endAddr,
          startLat: c.startLat, startLng: c.startLng, endLat: c.endLat, endLng: c.endLng,
          tag: "normal",
          synced: false,
          importedFromTimeline: true,
        });
      }
      state.trips = [...newTrips, ...state.trips].sort((x, y) => (x.date + x.startTime < y.date + y.startTime ? 1 : -1));
      await storageSet(TRIPS_KEY, state.trips);
      state.addDrives = null;
      render();
    };
  }

  armSelectAllOnTap();
}

// Per-field onfocus->select() (the pattern used everywhere in this app)
// only reselects when the field actually receives a fresh `focus` event --
// which doesn't fire on a field that was already focused (e.g. right after
// picking an autocomplete suggestion or a saved-address chip, which leaves
// the field focused without blurring it first). A second tap on it then did
// nothing. `mouseup` fires on every tap regardless of prior focus state, so
// handling it here too closes that gap for every text field app-wide, on
// top of (not instead of) each field's own onfocus wiring -- preventDefault
// stops the browser's own mouseup from collapsing the selection into a
// plain caret right after. Runs after every render() (via attachAppHandlers)
// so newly-rendered fields are always covered.
function armSelectAllOnTap() {
  const skip = ["checkbox", "radio", "button", "submit", "range", "color", "file"];
  document.querySelectorAll("input").forEach(el => {
    if (skip.includes(el.type)) return;
    el.onmouseup = (e) => { e.preventDefault(); setTimeout(() => el.select()); };
  });
}

(async function init() {
  loadGoogleMapsScript();
  state._existingProfile = await storageGet(PROFILE_KEY);
  const savedSettings = await storageGet(SETTINGS_KEY);
  const requirePin = !!savedSettings && savedSettings.requirePin === true;
  state.loadingProfile = false;
  if (state._existingProfile && !requirePin) {
    state.profile = state._existingProfile;
    await loadData();
  }
  render();
})();

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("sw.js").then((reg) => {
      // Browsers otherwise only check sw.js for changes on navigation, which
      // a single-page app rarely does — a tab left open (or a home-screen
      // PWA reopened without a real reload) can silently keep running JS
      // from days ago. Poll for a new version on load and whenever the tab
      // regains focus, so a pushed fix is actually picked up.
      reg.update().catch(() => {});
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") reg.update().catch(() => {});
      });
    }).catch(() => {});
  });
  // Once a new service worker activates (self.skipWaiting() + clients.claim()
  // in sw.js make that happen immediately, not on next reload), the page is
  // still running the old JS in memory — force one reload so the fresh code
  // actually takes effect instead of silently sitting there uninstalled.
  let dlReloadingForUpdate = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (dlReloadingForUpdate) return;
    dlReloadingForUpdate = true;
    window.location.reload();
  });
}
</script>
