<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Drive Log</title>
<link rel="manifest" href="manifest.json?v=2" />
<link rel="icon" href="icons/favicon-32.png?v=2" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
<meta id="themeColorMeta" name="theme-color" content="#14171C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Drive Log" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#14171C; --surface:#1E2229; --border:#2A2F38;
    --text:#EDEEF0; --muted:#8B92A0; --faint:#565D6B;
    --amber:#F2A93B; --amber-rgb:242,169,59; --work:#E0642C; --normal:#4C9F70; --blue:#4C9FF2; --cost:#C2661C;
  }
  html[data-theme="light"]{
    --bg:#EEF0F3; --surface:#FFFFFF; --border:#DDE1E7;
    --text:#161A20; --muted:#666E7C; --faint:#9AA1AD;
    --amber:#B9740F; --amber-rgb:185,116,15; --work:#B54A1E; --normal:#20794A; --blue:#2568C4; --cost:#9C5015;
  }
  /* Accent theme colors — override --amber (primary) / --cost (secondary
     series) only; amber's own values above are the "amber" accent default.
     --amber-rgb mirrors --amber as bare R,G,B channels so tint backgrounds
     (rgba(var(--amber-rgb), .14) etc.) can react to the accent too. */
  html[data-theme="dark"][data-accent="green"]{--amber:#3ECF8E; --amber-rgb:62,207,142; --cost:#197E4F;}
  html[data-theme="light"][data-accent="green"]{--amber:#1C8F5B; --amber-rgb:28,143,91; --cost:#0F5C34;}
  html[data-theme="dark"][data-accent="blue"]{--amber:#4C9FF2; --amber-rgb:76,159,242; --cost:#2B6FC2;}
  html[data-theme="light"][data-accent="blue"]{--amber:#2568C4; --amber-rgb:37,104,196; --cost:#1A4C8C;}
  html[data-theme="dark"][data-accent="purple"]{--amber:#7E3FF2; --amber-rgb:126,63,242; --cost:#5A2BB0;}
  html[data-theme="light"][data-accent="purple"]{--amber:#6425C7; --amber-rgb:100,37,199; --cost:#431A87;}
  html[data-theme="dark"][data-accent="red"]{--amber:#F2453B; --amber-rgb:242,69,59; --cost:#A82920;}
  html[data-theme="light"][data-accent="red"]{--amber:#C2261C; --amber-rgb:194,38,28; --cost:#7A1810;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .wrap{max-width:640px;margin:0 auto;padding:12px 16px 12px;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px;flex-wrap:wrap;gap:10px;}
  .stats-row{display:flex;align-items:flex-start;gap:8px;}
  .stat-block{display:flex;flex-direction:column;align-items:center;}
  .icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;
            display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{color:var(--text);}
  .icon-btn.active{color:var(--amber);}
  .icon-btn .icon{width:20px;height:20px;}
  .connected-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(76,159,112,.15);
                  color:var(--normal);border:1px solid rgba(76,159,112,.3);padding:3px 10px;
                  border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1;}
  .brand p{color:var(--faint);font-size:12px;margin:2px 0 0;}
  .odo-label{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;text-align:center;}
  .odo{display:inline-flex;background:#0B0D10;border:1px solid var(--border);border-radius:8px;
       padding:5px 6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);}
  .odo span{font-size:16px;font-weight:600;color:var(--amber);width:0.85ch;text-align:center;
            text-shadow:0 0 8px rgba(var(--amber-rgb),.45);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;
                  justify-content:center;padding:20px;z-index:50;}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
             max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-card h2{font-size:16px;margin:0 0 14px;}
  /* Blend scrollbars into the dark theme instead of the bright default OS scrollbar. */
  .modal-card, .table-scroll{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .modal-card::-webkit-scrollbar, .table-scroll::-webkit-scrollbar{width:6px;height:6px;}
  .modal-card::-webkit-scrollbar-track, .table-scroll::-webkit-scrollbar-track{background:transparent;}
  .modal-card::-webkit-scrollbar-thumb, .table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  .modal-card::-webkit-scrollbar-thumb:hover, .table-scroll::-webkit-scrollbar-thumb:hover{background:var(--faint);}
  .field-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .date-compact{width:150px;flex-shrink:0;}
  .time-compact{width:84px;flex-shrink:0;text-align:center;font-variant-numeric:tabular-nums;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0;margin-bottom:14px;}
  .tab-btn{flex:1;padding:6px 0;border:none;background:transparent;border-radius:10px;font-size:14px;
           font-weight:600;color:var(--muted);cursor:pointer;text-transform:capitalize;}
  .tab-btn.active{background:var(--amber);color:var(--bg);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 10px;margin-bottom:11px;}
  .field-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px;}
  .input, select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
         padding:9px 10px;color:var(--text);font-size:14px;outline:none;}
  .input:focus{border-color:var(--amber);}
  .input-icon{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 10px;position:relative;}
  .places-suggestions{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);
                       border-radius:8px;overflow:hidden;z-index:40;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .places-suggestion{padding:9px 12px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid rgba(42,47,56,.6);}
  .places-suggestion:last-child{border-bottom:none;}
  .places-suggestion:hover, .places-suggestion.hovered{background:var(--bg);}
  .input-icon input{border:none;background:transparent;padding:9px 0;flex:1;color:var(--text);outline:none;font-size:14px;}
  .locate-btn{background:none;border:none;color:var(--amber);display:flex;align-items:center;padding:6px;cursor:pointer;flex-shrink:0;}
  .locate-btn:disabled{color:var(--muted);}
  .locate-btn svg{width:18px;height:18px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toggle-row{display:flex;gap:8px;}
  .toggle{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:600;background:transparent;
          border:1px solid var(--border);color:var(--muted);cursor:pointer;}
  .toggle.normal.on{background:rgba(76,159,112,.18);border-color:var(--normal);color:var(--normal);}
  .toggle.work.on{background:rgba(224,100,44,.18);border-color:var(--work);color:var(--work);}
  .toggle.supervised.on{background:rgba(76,159,242,.18);border-color:var(--blue);color:var(--blue);}
  .btn{width:100%;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;appearance:none;-webkit-appearance:none;
       display:flex;align-items:center;justify-content:center;gap:8px;}
  .btn-amber{background:var(--amber);color:var(--bg);}
  .btn-stop{background:var(--work);color:#fff;}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;padding:10px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;
       font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .tag.work{background:rgba(224,100,44,.15);color:var(--work);border:1px solid rgba(224,100,44,.3);}
  .tag.normal{background:rgba(76,159,112,.15);color:var(--normal);border:1px solid rgba(76,159,112,.3);}
  .tag.supervised{background:rgba(76,159,242,.15);color:var(--blue);border:1px solid rgba(76,159,242,.3);}
  .beta-tag{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
            background:rgba(var(--amber-rgb),.18);color:var(--amber);border:1px solid rgba(var(--amber-rgb),.35);
            border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
  .chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);
        color:var(--muted);background:transparent;cursor:pointer;text-transform:capitalize;}
  .chip.active{background:var(--amber);color:var(--bg);border-color:var(--amber);}
  table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}
  thead th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);
           text-align:left;padding:8px 4px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:9px;}
  tbody td{padding:6px 4px;border-bottom:1px solid rgba(42,47,56,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .table-scroll{max-height:420px;overflow-y:auto;}
  .col-date{width:58px;padding-left:8px;padding-right:0;}
  .col-time{width:68px;padding-right:0;}
  .col-num{width:37px;padding-left:0;padding-right:0;}
  .date-cell{padding-left:8px;padding-right:0;}
  .time-cell{padding-right:0;padding-left:4px;}
  .num-cell{padding-left:0;padding-right:0;}
  .route-cell{max-width:none;padding-left:8px;padding-right:0;position:relative;z-index:0;}
  .route-clip{overflow:hidden;white-space:nowrap;width:calc(100% - 8px);}
  .route-track{display:inline-block;white-space:nowrap;will-change:transform;}
  .loc-field-wrap{position:relative;flex:1;min-width:0;}
  .loc-field-wrap input{width:100%;}
  .loc-overlay{position:absolute;inset:0;display:none;align-items:center;background:var(--bg);cursor:text;font-size:14px;}
  .loc-overlay .route-clip{width:100%;}
  .empty{text-align:center;color:var(--faint);padding:24px;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .err{color:var(--work);font-size:12px;margin:4px 0 0;}
  .note{color:var(--faint);font-size:11px;line-height:1.5;margin-top:16px;}
  .drive-btn{background:rgba(66,133,244,.12);border:1px solid rgba(66,133,244,.35);color:#8fb3ff;}
  .timer{display:flex;align-items:center;gap:6px;color:var(--amber);font-size:18px;font-weight:600;}
  .hidden{display:none !important;}
  .icon{width:15px;height:15px;flex-shrink:0;}
  .icon-fuel{width:.9em;height:.9em;}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{position:relative;width:44px;height:24px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);
          border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s;}
  .switch.on{background:var(--amber);border-color:var(--amber);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);
                transition:transform .15s,background .15s;}
  .switch.on .knob{transform:translateX(20px);background:var(--bg);}
  .settings-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 0 4px;}
  .settings-desc{color:var(--muted);font-size:12px;line-height:1.5;margin:2px 0 0;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-actions .btn{width:auto;padding:8px 10px;font-size:12px;flex:1 1 0;min-width:0;white-space:nowrap;}
  .settings-inline-controls{display:flex;gap:8px;align-items:center;}
  .settings-inline-controls .input{flex:1 1 0;min-width:0;}
  .settings-inline-controls .btn{flex:1 1 0;width:auto;min-width:0;padding:9px 12px;font-size:13px;white-space:nowrap;}
  /* Estimate Drive / Log this Drive: same chip size, wrap naturally on narrow screens. */
  .pretrip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pretrip-values{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted);}
  /* History action chips: icon-only on narrow (phone) screens so they always stay in line with the Filters label. */
  .history-actions .chip{padding:5px 8px;}

  /* Log-tab dashboard (bar-chart cards) */
  .divider{height:1px;background:var(--border);margin:7px 0;}
  .seg{display:flex;gap:5px;margin-bottom:8px;}
  .seg button{flex:1;padding:7px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;}
  .seg button.on{background:rgba(var(--amber-rgb),.14);border-color:var(--amber);color:var(--amber);}
  .rangenav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:8px;}
  .rangenav button{width:28px;height:28px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .rangenav .range{font-size:12px;color:var(--muted);min-width:112px;text-align:center;}
  svg.chart{width:100%;display:block;overflow:visible;}
  .daylabels{position:relative;height:13px;margin-top:2px;}
  .daylabels span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--faint);white-space:nowrap;}
  .legend2{display:flex;gap:20px;margin-top:6px;flex-wrap:wrap;}
  .legend2 .item{display:flex;align-items:baseline;gap:6px;}
  .legend2 .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-bottom:1px;}
  .legend2 .lbl{font-size:11px;color:var(--muted);}
  .legend2 .avgval{font-size:11px;color:var(--text);font-weight:600;}
  .pill-row{margin-bottom:7px;}
  .pill-row:last-child{margin-bottom:0;}
  .pill-row .hdr{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 3px;}
  .pill-track{position:relative;height:22px;border-radius:999px;background:var(--bg);border:1px solid var(--border);overflow:hidden;padding:3px 10px;display:flex;align-items:center;isolation:isolate;}
  .pill-fill{position:absolute;inset:0;border-radius:999px;}
  .pill-left{position:relative;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;mix-blend-mode:difference;}
  .pill-count{position:relative;margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;mix-blend-mode:difference;}
  .kv-line{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px;}
  .kv-line .k{color:var(--muted);}
  .kv-line .v{color:var(--text);font-weight:600;}
  .kv-sub{font-size:10.5px;color:var(--faint);margin:0 0 6px;}
  .pacerow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pace-card{flex:1;min-width:0;border-radius:10px;padding:8px 11px;border:1px solid;display:flex;align-items:center;justify-content:center;text-align:center;}
  .pace-card .txt b{display:block;font-size:12.5px;}
  .pace-card .txt span{font-size:10.5px;opacity:.85;display:block;margin-top:1px;}
  .toggle2{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:10.5px;flex-shrink:0;align-self:stretch;cursor:pointer;}
  .toggle2 span{padding:4px 10px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;flex:1;}
  .toggle2 span.on{background:rgba(var(--amber-rgb),.14);color:var(--amber);font-weight:600;}
  .tip-bg{fill:var(--bg);stroke:var(--border);stroke-width:1;}
  .tip-text{fill:var(--text);font-size:10px;font-family:ui-monospace,monospace;}
  .col{cursor:pointer;}
  .swatch-row{display:flex;gap:5px;}
  .swatch-btn{flex:1;min-width:0;border:1px solid var(--c);border-radius:8px;padding:8px 2px;font-size:10.5px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;background:rgba(var(--c-rgb),.14);color:var(--c);}
  .swatch-btn.active{background:var(--c);color:#14171C;border-color:var(--c);}

  @media (max-width:479px){
    .history-actions .chip-label{display:none;}
  }
</style>
</head>
<body>

<div id="app"></div>

<script>
const TRIPS_KEY = "driving-log:trips";
const PROFILE_KEY = "driving-log:profile";
const ACTIVE_KEY = "driving-log:active";
const SETTINGS_KEY = "driving-log:settings";
const SHEET_LINK_KEY = "driving-log:sheet";
const SUPERVISORS_KEY = "driving-log:supervisors";
const RECENT_LOCATIONS_KEY = "driving-log:recent-locations";
const SAVED_ADDRESSES_KEY = "driving-log:saved-addresses";
const FUEL_FILLUPS_KEY = "driving-log:fuel-fillups";
const GOOGLE_TOKEN_KEY = "driving-log:google-token";

// --- Google Sheets connection (per-person, one-time setup by the app owner) ---
// Replace this with your own OAuth Client ID from Google Cloud Console before sharing this file.
const GOOGLE_CLIENT_ID = "247082567215-2sethv759pn3rp0g7fvrkf0lgnfok0e0.apps.googleusercontent.com";
const GOOGLE_MAPS_API_KEY = "AIzaSyB2oTEiedrTleQf_ugwHqgodNltiakkoyk";
function mapsConfigured() { return GOOGLE_MAPS_API_KEY && !GOOGLE_MAPS_API_KEY.startsWith("PASTE_"); }

window.gm_authFailure = function () {
  state.mapsAuthError = "Google Maps rejected the API key (auth error) — check the key's restrictions and that \"Maps JavaScript API\" is enabled, not just Places/Geocoding/Routes.";
  render();
};

function loadGoogleMapsScript() {
  if (!mapsConfigured()) return;
  if (document.getElementById("googleMapsScript")) return;
  const script = document.createElement("script");
  script.id = "googleMapsScript";
  script.src = `https://maps.googleapis.com/maps/api/js?key=${GOOGLE_MAPS_API_KEY}&libraries=places`;
  script.async = true;
  script.defer = true;
  script.onerror = () => {
    state.mapsAuthError = "Google Maps script failed to load — check your connection or the API key setup.";
    render();
  };
  document.head.appendChild(script);
}

let jsPDFLoadingPromise = null;
function loadJsPDF() {
  if (window.jspdf && window.jspdf.jsPDF) return Promise.resolve(window.jspdf.jsPDF);
  if (!jsPDFLoadingPromise) {
    jsPDFLoadingPromise = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      script.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js";
      script.onload = () => resolve(window.jspdf.jsPDF);
      script.onerror = () => reject(new Error("Couldn't load the PDF library — check your connection and try again."));
      document.head.appendChild(script);
    });
  }
  return jsPDFLoadingPromise;
}

let placesLibraryPromise = null;
function getPlacesLibrary() {
  if (!window.google || !window.google.maps || typeof google.maps.importLibrary !== "function") return null;
  if (!placesLibraryPromise) placesLibraryPromise = google.maps.importLibrary("places");
  return placesLibraryPromise;
}

function debounce(fn, delay) {
  let timer;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), delay); };
}

function getDeviceRegionCode() {
  try {
    const timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
    if (timezone.startsWith("Australia/")) return "au";
    const locale = navigator.language || (navigator.languages && navigator.languages[0]) || "";
    if (typeof Intl.Locale === "function") {
      const region = new Intl.Locale(locale).region;
      if (region) return region.toLowerCase();
    }
    const parts = locale.split("-");
    if (parts.length > 1 && parts[parts.length - 1].length === 2) return parts[parts.length - 1].toLowerCase();
  } catch (e) {}
  return null;
}

// --- Supervised (learner) licence hour defaults, by Australian state -------
// Maps the IANA timezone city to its state/territory for the states we have
// specific government-mandated hour figures for. ACT shares NSW's timezone
// (Australia/Sydney) so it isn't separately distinguishable from timezone
// alone — it inherits the NSW figure as a side effect. NT has no figure
// (marked N/A) and falls back to the generic placeholder below, same as any
// non-Australian region.
const AU_TIMEZONE_STATE = {
  "Australia/Sydney": "NSW", "Australia/Broken_Hill": "NSW",
  "Australia/Melbourne": "VIC",
  "Australia/Brisbane": "QLD", "Australia/Lindeman": "QLD",
  "Australia/Adelaide": "SA",
  "Australia/Perth": "WA",
  "Australia/Hobart": "TAS", "Australia/Currie": "TAS",
};
const AU_STATE_LICENCE_HOURS = {
  NSW: { total: 120, night: 20 },
  VIC: { total: 120, night: 20 },

// --- Geometry / astronomy helpers ---------------------------------------
function haversineKm(lat1, lng1, lat2, lng2) {
  const R = 6371;

  const dLat = toRad(lat2 - lat1);

  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

// Approximate sunrise/sunset (NOAA algorithm, good to a few minutes) used to
// auto-compute Day/Night for supervised drives without any external API.
function sunriseSunsetUTC(date, lat, lng) {
  const rad = Math.PI / 180;
  const dayOfYear = Math.floor((date - new Date(Date.UTC(date.getUTCFullYear(), 0, 0))) / 86400000);
  const zenith = 90.833;
  function calc(isSunrise) {
    const lngHour = lng / 15;
    const t = dayOfYear + ((isSunrise ? 6 : 18) - lngHour) / 24;
    const M = 0.9856 * t - 3.289;
    let L = M + 1.916 * Math.sin(M * rad) + 0.020 * Math.sin(2 * M * rad) + 282.634;
    L = ((L % 360) + 360) % 360;
    let RA = (1 / rad) * Math.atan(0.91764 * Math.tan(L * rad));
    RA = ((RA % 360) + 360) % 360;
    const Lquadrant = Math.floor(L / 90) * 90;
    const RAquadrant = Math.floor(RA / 90) * 90;
    RA = RA + (Lquadrant - RAquadrant);
    RA = RA / 15;
    const sinDec = 0.39782 * Math.sin(L * rad);
    const cosDec = Math.cos(Math.asin(sinDec));
    const cosH = (Math.cos(zenith * rad) - sinDec * Math.sin(lat * rad)) / (cosDec * Math.cos(lat * rad));
    if (cosH > 1 || cosH < -1) return null; // sun never rises/sets that day at this latitude
    let H = isSunrise ? 360 - (1 / rad) * Math.acos(cosH) : (1 / rad) * Math.acos(cosH);
    H = H / 15;
    const T = H + RA - 0.06571 * t - 6.622;
    let UT = T - lngHour; // hours, NOT yet wrapped — may be negative or >24
    // Which UTC calendar day (relative to `date`'s UTC day) this clock time
    // actually falls on — essential for longitudes far from Greenwich, where
    // a "day N" sunrise/sunset can land on UTC day N-1 or N+1.
    const dayOffset = Math.floor(UT / 24);
    UT = UT - dayOffset * 24;
    return { UT, dayOffset };
  }
  const sunriseRes = calc(true);
  const sunsetRes = calc(false);
  if (sunriseRes == null || sunsetRes == null) return null;
  const toDate = (res) => new Date(Date.UTC(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate() + res.dayOffset) + res.UT * 3600000);
  return {
    sunrise: toDate(sunriseRes),
    sunset: toDate(sunsetRes),
  };
}
// Returns "day" or "night" for a given local Date + coordinates, falling back
// to a simple 6am-6pm heuristic if we don't have coordinates to work with.
function tripDateTime(dateStr, timeStr) {
  const d = new Date(`${dateStr}T${formatTime24(timeStr) || "12:00"}:00`);
  return isNaN(d) ? new Date() : d;
}

  return computeDayNight(tripDateTime(dateStr, timeStr), lat, lng);
}

  const heuristic = () => { const h = dateObj.getHours(); return (h >= 6 && h < 18) ? "day" : "night"; };
  if (lat == null || lng == null || isNaN(lat) || isNaN(lng)) return heuristic();
  // For longitudes far from Greenwich, a single day's sunrise/sunset pair can
  // land on an adjacent UTC calendar day (the formula's own day-offset
  // correction). Rather than trust one day's pairing, probe the day before,
  // the day itself, and the day after, then classify by chronological
  // interval membership against the resulting timeline of real events —
  // that's robust regardless of which calendar day each pair claims.
  const events = [];
  for (let dOffset = -1; dOffset <= 1; dOffset++) {
    const probeDate = new Date(dateObj.getTime() + dOffset * 86400000);
    const times = sunriseSunsetUTC(probeDate, lat, lng);
    if (times) {
      events.push({ t: times.sunrise.getTime(), type: "sunrise" });
      events.push({ t: times.sunset.getTime(), type: "sunset" });
    }
  }
  if (!events.length) return heuristic(); // e.g. polar day/night
  events.sort((a, b) => a.t - b.t);

  let last = null;
  for (const e of events) { if (e.t <= target) last = e; else break; }
  if (!last) return events[0].type === "sunrise" ? "night" : "day";
  return last.type === "sunrise" ? "day" : "night";
}

// --- Google Timeline historical import -----------------------------------
// Google's on-device Timeline export format isn't publicly documented and
// has shifted over the years, so this parser walks the JSON generically
// looking for anything that looks like a timestamped coordinate, rather
// than assuming one exact schema. Recognises (a) modern semanticSegments /
// rawSignals exports, (b) the older Records.json-style
// {latitudeE7,longitudeE7,timestampMs} shape, and (c) plain lat/lng+time pairs.
function parseLatLngString(str) {
  if (typeof str !== "string") return null;
  const m = str.replace(/°/g, "").match(/(-?\d+(?:\.\d+)?)\s*,\s*(-?\d+(?:\.\d+)?)/);
  if (!m) return null;

    return { lat: node.latitudeE7 / 1e7, lng: node.longitudeE7 / 1e7 };
  }
  if (typeof node.lat === "number" && typeof node.lng === "number") return { lat: node.lat, lng: node.lng };
  if (typeof node.latitude === "number" && typeof node.longitude === "number") return { lat: node.latitude, lng: node.longitude };
  for (const key of ["point", "position", "latLng", "LatLng", "placeLocation"]) {
    if (typeof node[key] === "string") { const c = parseLatLngString(node[key]); if (c) return c; }
    if (node[key] && typeof node[key] === "object") {
      const c = extractCoord(node[key]);
      if (c) return c;

function parseTimelinePoints(json) {

    const coord = extractCoord(node);
    const t = extractTimeMs(node) || lastKnownTime;
    if (coord && t) points.push({ t, lat: coord.lat, lng: coord.lng });
    if (extractTimeMs(node)) lastKnownTime = extractTimeMs(node);

    // the segment's own startTime as a fallback for path points without one.

  const deduped = [];
  for (const p of points) {
    const prev = deduped[deduped.length - 1];
    if (prev && prev.t === p.t && prev.lat === p.lat && prev.lng === p.lng) continue;
    deduped.push(p);

// Groups raw points into candidate driving segments.
// - GAP_BREAK_MS: gap beyond which we don't compute a speed across two points
//   (treated as a break — e.g. phone was stationary/off/no signal).
// - STITCH_GAP_MS: if a driving segment ends and another starts again within
//   this short a gap, merge them into one drive (e.g. a stoplight/parking stop).
// - MIN_SPEED / MAX_SPEED (km/h): the "driving" band.
// - MIN_SEGMENT_MS: minimum sustained duration to count as a real drive.
const TIMELINE_GAP_BREAK_MS = 2.5 * 60 * 1000;
const TIMELINE_STITCH_GAP_MS = 5 * 60 * 1000;
const TIMELINE_MIN_SPEED_KMH = 12;
const TIMELINE_MAX_SPEED_KMH = 160;
const TIMELINE_MIN_SEGMENT_MS = 3 * 60 * 1000;

function detectDrivingSegments(points) {
  if (points.length < 2) return [];
  // 1. Walk consecutive points, compute speed; break the point stream wherever
  //    the time gap is too large to trust a speed calculation across it.
  const runs = [[points[0]]];
  for (let i = 1; i < points.length; i++) {
    const gap = points[i].t - points[i - 1].t;
    if (gap > TIMELINE_GAP_BREAK_MS || gap <= 0) {
      runs.push([points[i]]);
    } else {
      runs[runs.length - 1].push(points[i]);
    }
  }
  // 2. Within each unbroken run, find sub-stretches where speed stays in the
  //    driving band, and merge those into segments.
  let segments = [];
  runs.forEach(run => {
    if (run.length < 2) return;
    let segStart = 0;
    let inDrive = false;
    for (let i = 1; i <= run.length; i++) {
      let speedOk = false;
      if (i < run.length) {
        const a = run[i - 1], b = run[i];
        const dtH = (b.t - a.t) / 3600000;
        const distKm = haversineKm(a.lat, a.lng, b.lat, b.lng);
        const speed = dtH > 0 ? distKm / dtH : 0;
        speedOk = speed >= TIMELINE_MIN_SPEED_KMH && speed <= TIMELINE_MAX_SPEED_KMH;
      }
      if (speedOk && !inDrive) { segStart = i - 1; inDrive = true; }
      if ((!speedOk || i === run.length) && inDrive) {
        const segEnd = speedOk ? i : i - 1;
        if (segEnd > segStart) segments.push(run.slice(segStart, segEnd + 1));
        inDrive = speedOk;
        if (speedOk) segStart = i - 1;
      }
    }
  });
  // 3. Stitch segments that resume shortly after one another (a short pause,
  //    not a real break in the trip) into a single drive.
  segments.sort((a, b) => a[0].t - b[0].t);
  const stitched = [];
  segments.forEach(seg => {
    const prev = stitched[stitched.length - 1];
    if (prev && (seg[0].t - prev[prev.length - 1].t) <= TIMELINE_STITCH_GAP_MS) {
      prev.push(...seg);
    } else {
      stitched.push(seg.slice());
    }
  });
  // 4. Build candidate objects, dropping anything too short to be a real drive.
  return stitched
    .filter(seg => seg[seg.length - 1].t - seg[0].t >= TIMELINE_MIN_SEGMENT_MS)
    .map(seg => {
      let distanceKm = 0;
      for (let i = 1; i < seg.length; i++) distanceKm += haversineKm(seg[i - 1].lat, seg[i - 1].lng, seg[i].lat, seg[i].lng);
      const start = seg[0], end = seg[seg.length - 1];
      return {
        id: uid(),
        startMs: start.t, endMs: end.t,
        startLat: start.lat, startLng: start.lng,
        endLat: end.lat, endLng: end.lng,
        distanceKm,
        selected: true,
      };
    });
}

function attachPlacesAutocomplete(inputEl, onSelect) {
  if (!inputEl) return;
  const wrapper = inputEl.closest(".input-icon");
  if (!wrapper) return;
  let dropdown = wrapper.querySelector(".places-suggestions");
  if (!dropdown) {
    dropdown = document.createElement("div");
    dropdown.className = "places-suggestions";
    wrapper.appendChild(dropdown);
  }
  const hide = () => { dropdown.innerHTML = ""; dropdown.style.display = "none"; };
  const search = debounce(async () => {
    if (!mapsConfigured()) return;
    const libraryPromise = getPlacesLibrary();
    const query = inputEl.value.trim();
    if (query.length < 3) { hide(); return; }
    const savedMatches = savedAddressList().filter(address => {
      const needle = query.toLowerCase();
      return address.name.toLowerCase().includes(needle) || address.address.toLowerCase().includes(needle);
    });
    if (savedMatches.length) {
      dropdown.innerHTML = savedMatches.map(address =>
        `<div class="places-suggestion" data-desc="${escAttr(address.address)}"><b>${escAttr(address.name)}</b><span style="color:var(--muted);"> — ${escAttr(address.address)}</span></div>`
      ).join("");
      dropdown.style.display = "block";
      dropdown.querySelectorAll(".places-suggestion").forEach(el => {
        el.onmousedown = (e) => { e.preventDefault(); onSelect(el.dataset.desc); hide(); };
      });
      return;
    }
    if (!libraryPromise) { hide(); return; }
    try {
      const { AutocompleteSuggestion, AutocompleteSessionToken } = await libraryPromise;
      const request = { input: query, sessionToken: new AutocompleteSessionToken() };
      const region = getDeviceRegionCode();
      if (region) request.includedRegionCodes = [region];
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions(request);
      if (!suggestions || !suggestions.length) { hide(); return; }
      dropdown.innerHTML = suggestions.slice(0, 5).map(s => {
        const text = s.placePrediction && s.placePrediction.text ? s.placePrediction.text.text : "";
        return `<div class="places-suggestion" data-desc="${escAttr(text)}">${text}</div>`;
      }).join("");
      dropdown.style.display = "block";
      dropdown.querySelectorAll(".places-suggestion").forEach(el => {
        el.onmousedown = (e) => {
          e.preventDefault();
          onSelect(el.dataset.desc);
          hide();
        };
      });
    } catch (e) {
      const detail = (e && (e.message || e.status || e.code)) || (e ? JSON.stringify(e) : "unknown error");
      dropdown.innerHTML = `<div class="places-suggestion" style="color:var(--work);cursor:default;">Lookup failed (${detail})</div>`;
      dropdown.style.display = "block";
    }
  }, 300);
  inputEl.addEventListener("input", search);
  inputEl.addEventListener("blur", () => setTimeout(hide, 150));
}

const GOOGLE_SCOPES = "https://www.googleapis.com/auth/spreadsheets";
let googleTokenClient = null;
let googleAccessToken = null;
let googleTokenExpiresAt = 0;

function googleConfigured() {
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf("PASTE_YOUR_CLIENT_ID_HERE") === -1;
}

function ensureTokenClient(callback) {
  if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if (!googleTokenClient) {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: callback,
    });
  } else {
    googleTokenClient.callback = callback;
  }
  return googleTokenClient;
}

function getGoogleToken(promptMode) {
  return new Promise((resolve, reject) => {
    const client = ensureTokenClient((resp) => {
      if (resp && resp.access_token) {
        googleAccessToken = resp.access_token;
        googleTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3300) * 1000);
        storageSet(GOOGLE_TOKEN_KEY, { token: googleAccessToken, expiresAt: googleTokenExpiresAt });
        resolve(resp.access_token);
      } else {
        reject(resp);
      }
    });
    if (!client) { reject(new Error("Google sign-in library not loaded")); return; }
    client.requestAccessToken({ prompt: promptMode || "" });
  });
}

async function loadPersistedGoogleToken() {
  try {
    const saved = await storageGet(GOOGLE_TOKEN_KEY);
    if (saved && saved.token && saved.expiresAt > Date.now() + 60000) {
      googleAccessToken = saved.token;
      googleTokenExpiresAt = saved.expiresAt;
    }
  } catch (e) {}
}

async function getFreshGoogleToken() {
  if (googleAccessToken && Date.now() < googleTokenExpiresAt - 60000) return googleAccessToken;
  return getGoogleToken("");
}

async function createDriveLogSheet() {
  const token = await getGoogleToken("consent");
  const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({
      properties: { title: "Drive Log" },
      sheets: [{ data: [{ startRow: 0, startColumn: 0, rowData: [{ values: [
        "Date","Start Time","End Time","Distance (km)","Start Point","End Point","Type",
        "Time of Day","Road Type","Weather","Traffic Density","Supervisor Name","Supervisor Licence No."
      ].map(v => ({ userEnteredValue: { stringValue: v } })) }] }] }],
    }),
  });
  if (!res.ok) throw new Error("Failed to create sheet: " + res.status);
  const data = await res.json();
  return { spreadsheetId: data.spreadsheetId, url: data.spreadsheetUrl };
}

function labelFor(list, value) {
  const m = list.find(x => x.v === value);
  return m ? m.l : "";
}

async function appendTripToSheet(spreadsheetId, trip) {
  const token = await getFreshGoogleToken();
  const row = [[
    trip.date, trip.startTime, trip.endTime, Number(trip.distance).toFixed(1),
    trip.startPoint, trip.endPoint, trip.tag === "work" ? "Work" : trip.tag === "supervised" ? "Supervised" : "Normal",
    trip.timeOfDay ? (trip.timeOfDay === "day" ? "Daytime" : "Nighttime") : "",
    trip.roadType ? labelFor(ROAD_TYPES, trip.roadType) : "",
    trip.weather ? labelFor(WEATHER_TYPES, trip.weather) : "",
    trip.traffic ? labelFor(TRAFFIC_LEVELS, trip.traffic) : "",
    trip.supervisorName || "", trip.supervisorLicence || "",
  ]];
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A:M:append?valueInputOption=USER_ENTERED`,
    { method: "POST", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ values: row }) }
  );
  if (!res.ok) throw new Error("Append failed: " + res.status);
}

// --- Compact, always-24-hour time fields ---------------------------------
// Native <input type="time"> renders per the browser/OS locale (12hr with
// AM/PM on many devices) and silently blanks out if its value isn't exactly
// "HH:MM", which is what caused Start Time to appear empty in the edit modal
// for some drives. These plain text inputs are locale-proof, always show
// 24hr HH:MM, echo back whatever's actually stored, and can be sized freely.
function formatTimeInputValue(raw) {
  const digits = raw.replace(/\D/g, "").slice(0, 4);
  if (digits.length <= 2) return digits;
  return digits.slice(0, 2) + ":" + digits.slice(2);
}
function clampTimeValue(raw) {
  const digits = raw.replace(/\D/g, "").padEnd(4, "0").slice(0, 4);
  let h = parseInt(digits.slice(0, 2), 10);
  let m = parseInt(digits.slice(2, 4), 10);
  if (isNaN(h)) h = 0;
  if (isNaN(m)) m = 0;
  h = Math.min(23, Math.max(0, h));
  m = Math.min(59, Math.max(0, m));
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
// Wires up input(reformat-as-you-type) + blur(clamp-to-valid-24hr) on a
// compact time text field. `set(v)` is called with the current string on
// every keystroke and with the clamped final value on blur.
function attachTimeInput(el, set) {
  if (!el) return;
  el.oninput = (e) => {
    const formatted = formatTimeInputValue(e.target.value);
    e.target.value = formatted;
    set(formatted);
  };
  el.onblur = (e) => {
    if (!e.target.value) return;
    const clamped = clampTimeValue(e.target.value);
    e.target.value = clamped;
    set(clamped);
  };
}

let geocodingLibraryPromise = null;
function getGeocodingLibrary() {
  if (!window.google || !window.google.maps || typeof google.maps.importLibrary !== "function") return null;
  if (!geocodingLibraryPromise) geocodingLibraryPromise = google.maps.importLibrary("geocoding");
  return geocodingLibraryPromise;
}

async function reverseGeocode(lat, lng, fullAddress) {
  const libraryPromise = getGeocodingLibrary();
  if (!libraryPromise) throw new Error("Location lookup isn't ready yet — try again in a moment.");
  const { Geocoder } = await libraryPromise;
  const geocoder = new Geocoder();
  let response;
  try {
    response = await geocoder.geocode({ location: { lat, lng } });
  } catch (e) {
    const detail = (e && (e.message || e.status || e.code)) || (e ? JSON.stringify(e) : "unknown error");
    throw new Error(`Couldn't find an address for your location (${detail}).`);
  }
  const results = response && response.results;
  if (!results || !results.length) throw new Error("Couldn't find an address for your location.");
  if (fullAddress) return results[0].formatted_address;
  const comps = results[0].address_components;
  const get = (type) => (comps.find(c => c.types.includes(type)) || {}).long_name;
  const streetNumber = get("street_number");
  const route = get("route");
  const suburb = get("locality") || get("sublocality") || get("postal_town") || get("administrative_area_level_2");
  const street = [streetNumber, route].filter(Boolean).join(" ");
  return [street, suburb].filter(Boolean).join(", ") || results[0].formatted_address;
}

async function geocodeCandidateAddresses(a) {

    try { c.startAddr = await reverseGeocode(c.startLat, c.startLng, true); }
    catch (e) { c.startAddr = `${c.startLat.toFixed(4)}, ${c.startLng.toFixed(4)}`; }
    try { c.endAddr = await reverseGeocode(c.endLat, c.endLng, true); }
    catch (e) { c.endAddr = `${c.endLat.toFixed(4)}, ${c.endLng.toFixed(4)}`; }
    if (state.addDrives === a) render();
  }
  if (state.addDrives === a) { a.geocoding = false; render(); }
}

function escAttr(str) {

let routesLibraryPromise = null;

async function estimateRoute(origin, destination) {
  const libraryPromise = getRoutesLibrary();
  if (!libraryPromise) throw new Error("Distance lookup isn't ready yet — try again in a moment.");
  const { DistanceMatrixService } = await libraryPromise;
  const service = new DistanceMatrixService();
  return new Promise((resolve, reject) => {
    service.getDistanceMatrix({
      origins: [resolveSavedAddress(origin)],
      destinations: [resolveSavedAddress(destination)],
      travelMode: google.maps.TravelMode.DRIVING,
      unitSystem: google.maps.UnitSystem.METRIC,
    }, (response, status) => {
      if (status !== "OK") { reject(new Error(`Couldn't calculate that route (${status}).`)); return; }
      const element = response.rows && response.rows[0] && response.rows[0].elements && response.rows[0].elements[0];
      if (!element || element.status !== "OK") { reject(new Error(`Couldn't find a driving route (${element ? element.status : "no route data"}).`)); return; }
      resolve({
        distanceKm: element.distance.value / 1000,
        durationMin: Math.max(1, Math.round(element.duration.value / 60)),
      });
    });
  });
}

async function runRouteEstimate(origin, destination) {

const hasClaudeStorage = typeof window.storage !== "undefined" && !!window.storage;

async function storageGet(key) {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
async function storageSet(key, value) {
  try {
    if (hasClaudeStorage) { await window.storage.set(key, JSON.stringify(value), false); return; }
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { console.error("storage set failed", e); }
}
async function storageDelete(key) {
  try {
    if (hasClaudeStorage) { await window.storage.delete(key, false); return; }
    localStorage.removeItem(key);
  } catch {}
}

// --- Odometer reconciliation reminders -----------------------------------
const ODOMETER_FREQUENCY_DAYS = { monthly: 30, quarterly: 91, biannual: 182, yearly: 365 };
// Most recent odometer reading from either an explicit "Enter Now" entry or
// a refuel log's odometer field — whichever is more recent counts as the
// last reconciliation, so a logged refuel resets the reminder clock too.
function lastKnownOdometerDate() {
  let latest = (state.settings.lastOdometerReading && state.settings.lastOdometerReading.date) || null;
  state.fuelFillups.forEach(f => {
    if (f.odometer != null && !isNaN(f.odometer) && (!latest || f.date > latest)) latest = f.date;
  });
  return latest;
}
function odometerDueDate() {
  const lastDate = lastKnownOdometerDate();
  if (!lastDate) return null; // never entered — due immediately
  const days = ODOMETER_FREQUENCY_DAYS[state.settings.odometerFrequency] || 91;
  const due = new Date(`${lastDate}T00:00:00`);
  due.setDate(due.getDate() + days);
  return due;
}
function checkOdometerDue() {
  if (state.settings.odometerReminders === false) return;
  const lastDate = lastKnownOdometerDate();
  if (!lastDate) {
    // Never entered a reading — don't nag a brand-new install with zero drives yet.
    if (state.trips.length === 0) return;
    state.odometerPrompt = { value: "" };
    return;
  }
  const due = odometerDueDate();
  if (due && Date.now() >= due.getTime()) {
    state.odometerPrompt = { value: "" };
  }
}

// --- Google Sheets sync reminders -----------------------------------------
const SYNC_REMINDER_FREQUENCY_DAYS = { weekly: 7, monthly: 30, quarterly: 91 };
function syncReminderDueDate() {
  const days = SYNC_REMINDER_FREQUENCY_DAYS[state.settings.syncReminderFrequency];
  if (!days) return null;
  const last = state.settings.lastSyncAt;
  if (!last) return new Date(); // never synced yet — due immediately
  const due = new Date(`${last}T00:00:00`);
  due.setDate(due.getDate() + days);
  return due;
}
function checkSyncReminderDue() {
  if (!state.sheetLink) return; // nothing to remind about if Google Sync isn't connected
  if (!state.settings.syncRemindersEnabled) return;

// --- Supervised (learner) licence hour tracking -----------------------------
// Cumulative across all logged supervised drives (not just this week), since
// licence hour requirements accrue over the life of the learner permit.
function supervisedTotals() {
  let minutes = 0, nightMinutes = 0, distance = 0;
  state.trips.forEach(t => {
    if (t.tag !== "supervised") return;
    const m = tripMinutes(t);
    minutes += m;
    if (t.timeOfDay === "night") nightMinutes += m;
    distance += t.distance;
  });
  return { minutes, nightMinutes, distance, hours: minutes / 60, nightHours: nightMinutes / 60 };
}
// Fires the completion modal once, the first time both targets are met.
// If a later edit/delete drops totals back below target, the flag resets
// so the person gets notified again if they re-cross the line.
function checkSupervisedLicenceComplete() {
  const totalTarget = state.settings.supervisedTotalHoursTarget || 75;
  const nightTarget = state.settings.supervisedNightHoursTarget || 15;
  const { hours, nightHours } = supervisedTotals();
  const met = hours >= totalTarget && nightHours >= nightTarget;
  if (met && !state.settings.supervisedCompletionNotified) {
    state.settings.supervisedCompletionNotified = true;
    state.supervisedCompletionPrompt = { hours, nightHours, totalTarget, nightTarget };
    storageSet(SETTINGS_KEY, state.settings);
  } else if (!met && state.settings.supervisedCompletionNotified) {
    state.settings.supervisedCompletionNotified = false;
    storageSet(SETTINGS_KEY, state.settings);
  }
}

// --- Fuel cost -------------------------------------------------------------
function monthsAgoStr(monthsBack) {
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - monthsBack);
  return cutoff.toISOString().slice(0, 10);
}
// Consecutive full-tank-to-full-tank intervals, built from refuels that have
// an odometer reading (sorted by odometer, not date — protects against
// refuels logged out of order). The fuel added at the *later* refuel of each
// pair is what was actually consumed traveling between the two readings, so
// this is real usage, independent of whether every trip in between got
// logged in the app.
function fuelIntervals() {
  const withOdo = state.fuelFillups
    .filter(f => f.odometer != null && !isNaN(f.odometer))
    .slice()
    .sort((a, b) => a.odometer - b.odometer);
  const intervals = [];
  for (let i = 1; i < withOdo.length; i++) {
    const prev = withOdo[i - 1], cur = withOdo[i];
    const distance = cur.odometer - prev.odometer;
    if (distance <= 0) continue; // bad/duplicate reading — skip rather than corrupt the average
    intervals.push({ date: cur.date, distance, amount: Number(cur.amount) || 0, price: Number(cur.price) || 0 });
  }
  return intervals;
}
// "Accurate" mode's $/km rate. Prefers real odometer-interval data — exact
// distance per dollar spent, unaffected by gaps in trip logging. Falls back
// to the old trip-distance method (spend since earliest refuel vs. logged
// trip distance since then) when there isn't yet a full odometer interval.
function accurateFuelCostPerKm() {
  if (!state.fuelFillups.length) return null;
  const intervals = fuelIntervals();
  if (intervals.length) {
    const totalDistance = intervals.reduce((s, iv) => s + iv.distance, 0);
    const totalPrice = intervals.reduce((s, iv) => s + iv.price, 0);
    if (!totalDistance) return null;
    const totalDistanceKm = state.settings.unit === "mi" ? totalDistance / 0.621371 : totalDistance;
    return totalPrice / totalDistanceKm;
  }
  const dates = state.fuelFillups.map(f => f.date).sort();
  const from = dates[0];
  const totalSpend = state.fuelFillups.reduce((s, f) => s + (Number(f.price) || 0), 0);
  const distanceKm = state.trips.filter(t => t.date >= from).reduce((s, t) => s + t.distance, 0);
  if (!distanceKm) return null;
  return totalSpend / distanceKm;
}
// Real fuel usage (L/100km or MPG, matching the current unit) from odometer
// intervals — not an estimate, the actual litres burned per km covered.
// Returns null until there's at least one complete odometer-to-odometer
// interval (i.e. at least two refuels logged with an odometer reading).
function accurateFuelUsage(monthsBack) {
  let intervals = fuelIntervals();
  if (monthsBack != null) {
    const cutoffStr = monthsAgoStr(monthsBack);
    intervals = intervals.filter(iv => iv.date >= cutoffStr);
  }
  const totalDistance = intervals.reduce((s, iv) => s + iv.distance, 0);
  const totalAmount = intervals.reduce((s, iv) => s + iv.amount, 0);
  if (!totalDistance || !totalAmount) return null;
  return state.settings.unit === "mi" ? totalDistance / totalAmount : (totalAmount / totalDistance) * 100;
}
// Average price paid per litre/gallon over a trailing window, from logged
// refuels. Weighted by volume (total spend / total volume) rather than a
// simple mean of each refuel's unit price, so bigger fill-ups count more.
function avgFuelPriceForPeriod(monthsBack) {
  let refuels = state.fuelFillups;
  if (monthsBack != null) {
    const cutoffStr = monthsAgoStr(monthsBack);
    refuels = refuels.filter(f => f.date >= cutoffStr);
  }
  const totalAmount = refuels.reduce((s, f) => s + (Number(f.amount) || 0), 0);
  if (!totalAmount) return null;
  const totalPrice = refuels.reduce((s, f) => s + (Number(f.price) || 0), 0);
  return totalPrice / totalAmount;
}
function estimatedFuelCostPerKm() {
  const rate = parseFloat(state.settings.fuelRate);
  const price = parseFloat(state.settings.fuelPrice);
  if (!rate || !price || isNaN(rate) || isNaN(price)) return null;
  if (state.settings.unit === "mi") {
    // MPG (miles per gallon) -> cost per mile, then converted to cost per km for internal storage.
    const costPerMile = price / rate;
    return costPerMile * 0.621371;
  }
  // L/100km -> cost per km
  return (rate / 100) * price;
}
function fuelCostPerKm() {
  if (state.settings.fuelTrackingEnabled === false) return null;
  return state.settings.fuelMode === "accurate" ? accurateFuelCostPerKm() : estimatedFuelCostPerKm();
}
function formatFuelCostPerUnit() {
  const perKm = fuelCostPerKm();
  if (perKm == null) return "—";
  const perDisplayUnit = state.settings.unit === "mi" ? perKm / 0.621371 : perKm;
  return perDisplayUnit.toFixed(2);
}
function tripFuelCost(t) {
  const perKm = fuelCostPerKm();
  if (perKm == null) return null;
  return t.distance * perKm;
}
function suggestRouteTag() {
  if (!state.settings || !state.settings.learnRoutes) return null;
  if (state.active) return null;
  const start = (state.startPointInput || "").trim().toLowerCase();
  const end = (state.preTripEndLocation || "").trim().toLowerCase();
  if (!start || !end) return null;
  const now = new Date();
  const nowMinutes = now.getHours() * 60 + now.getMinutes();
  const matches = state.trips.filter(t => {
    if ((t.startPoint || "").trim().toLowerCase() !== start) return false;
    if ((t.endPoint || "").trim().toLowerCase() !== end) return false;
    const parts = formatTime24(t.startTime).split(":").map(Number);
    if (parts.length < 2 || isNaN(parts[0]) || isNaN(parts[1])) return false;
    const tMinutes = parts[0] * 60 + parts[1];
    const diff = Math.min(Math.abs(tMinutes - nowMinutes), 1440 - Math.abs(tMinutes - nowMinutes));
    return diff <= 90;
  });
  if (matches.length < 2) return null;
  const counts = {};
  matches.forEach(t => { counts[t.tag] = (counts[t.tag] || 0) + 1; });
  const [topTag, topCount] = Object.entries(counts).sort((a, b) => b[1] - a[1])[0];
  if (topTag === state.settings.driveType) return null;
  return { tag: topTag, count: topCount, total: matches.length };
}

function filteredTrips() {
  return state.trips.filter(t => {
    if (state.filterTag !== "all" && t.tag !== state.filterTag) return false;
    if (state.filterFrom && t.date < state.filterFrom) return false;
    if (state.filterTo && t.date > state.filterTo) return false;
    if (state.filterMinDistance && kmToDisplay(t.distance) < state.filterMinDistance) return false;
    if (state.filterSearch) {
      const q = state.filterSearch.toLowerCase();
      if (!t.startPoint.toLowerCase().includes(q) && !t.endPoint.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function sortHistoryRows(rows) {
  const dir = state.historySortDir === "asc" ? 1 : -1;
  const sorted = rows.slice();
  if (state.historySortBy === "distance") {
    sorted.sort((a, b) => (a.distance - b.distance) * dir);
  } else {
    sorted.sort((a, b) => {
      const ak = a.date + (a.startTime || ""), bk = b.date + (b.startTime || "");
      return ak < bk ? -1 * dir : ak > bk ? 1 * dir : 0;
    });
  }
  return sorted;
}

          </tbody>

function renderCarLookupModal() {
  const f = state.carLookupForm;
  const currentYear = new Date().getFullYear();

  const nonUsMakes = f.region !== "us"
    ? [...new Set(CAR_FUEL_DATA.filter(c => c.region === f.region && inLast20Years(c)).map(c => c.make))].sort()
    : [];
  const nonUsModels = f.region !== "us" && f.nonUsMake
    ? CAR_FUEL_DATA.filter(c => c.region === f.region && c.make === f.nonUsMake && inLast20Years(c))
    : [];

  return `
  <div class="modal-backdrop">
    <div class="modal-card">

      </div>
      ${f.region === "us" ? `

        <select id="carLookupYear" class="input" style="margin-bottom:14px;" ${!f.years.length && f.error ? "disabled" : ""}>

        </select>
        ${f.year ? `
        <label class="field-label">Make</label>
        <select id="carLookupMake" class="input" style="margin-bottom:14px;" ${!f.makes.length && f.error ? "disabled" : ""}>
          <option value="">${f.makes.length ? "Select Make" : f.error ? "Unavailable" : "Loading..."}</option>
          ${f.makes.map(m => `<option value="${escAttr(m.value)}" ${f.make === m.value ? "selected" : ""}>${m.text}</option>`).join("")}
        </select>` : ""}
        ${f.make ? `
        <label class="field-label">Model</label>
        <select id="carLookupModel" class="input" style="margin-bottom:14px;" ${!f.models.length && f.error ? "disabled" : ""}>
          <option value="">${f.models.length ? "Select Model" : f.error ? "Unavailable" : "Loading..."}</option>

        </select>` : ""}

        <label class="field-label">Trim / configuration</label>
        <select id="carLookupTrim" class="input" style="margin-bottom:14px;" ${!f.trims.length && f.error ? "disabled" : ""}>
          <option value="">${f.trims.length ? "Select trim" : f.error ? "Unavailable" : "Loading..."}</option>
          ${f.trims.map(t => `<option value="${escAttr(t.value)}" ${f.trimId === t.value ? "selected" : ""}>${t.text}</option>`).join("")}
        </select>` : ""}
      ` : `
        <p class="settings-desc" style="margin:0 0 12px;">Approximate figures — adjust if you know the exact number.</p>
        <label class="field-label">Make</label>
        <select id="carLookupNonUsMake" class="input" style="margin-bottom:14px;">
          <option value="">Select Make</option>
          ${nonUsMakes.map(m => `<option value="${escAttr(m)}" ${f.nonUsMake === m ? "selected" : ""}>${m}</option>`).join("")}
        </select>
        ${f.nonUsMake ? `
        <label class="field-label">Model</label>
        <select id="carLookupNonUsModel" class="input" style="margin-bottom:14px;">
          <option value="">Select Model</option>
          ${nonUsModels.map(c => `<option value="${escAttr(c.model)}" ${f.nonUsModel === c.model ? "selected" : ""}>${c.model}${c.yearFrom ? ` (${c.yearFrom}–${c.yearTo || currentYear})` : ""}</option>`).join("")}
        </select>` : ""}
      `}
      ${f.error ? `<p class="err" style="margin:8px 0 0;">${f.error}</p>` : ""}
      ${f.result != null ? `
        <p class="settings-desc" style="margin:14px 0 0;">Estimated consumption: <b class="mono" style="color:var(--text);">${f.result.toFixed(1)}</b> ${unitLabelStr}</p>
      ` : ""}

        <button id="cancelCarLookupBtn" class="btn btn-ghost">Cancel</button>
        <button id="applyCarLookupBtn" class="btn btn-amber" ${f.result == null ? "disabled" : ""}>Use This Figure</button>
      </div>
    </div>
  </div>`;

              <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 4px;border-bottom:1px solid rgba(42,47,56,.6);">
                <input type="checkbox" class="candidateCheckbox" data-id="${c.id}" ${c.selected ? "checked" : ""} style="margin-top:3px;width:16px;height:16px;accent-color:var(--amber);flex-shrink:0;" />
                <div style="min-width:0;flex:1;">
                  <p style="margin:0;font-size:13px;font-weight:600;">${formatDateForDisplay(new Date(c.startMs).toISOString().slice(0,10))} · ${new Date(c.startMs).toTimeString().slice(0,5)}–${new Date(c.endMs).toTimeString().slice(0,5)}</p>
                  <p class="settings-desc" style="margin:2px 0 0;">${kmToDisplay(c.distanceKm).toFixed(1)} ${unitLabel()} · ${formatDuration(Math.round((c.endMs - c.startMs)/60000))}</p>
                  <p class="settings-desc" style="margin:2px 0 0;">${c.startAddr || (mapsConfigured() ? "Loading location…" : `${c.startLat.toFixed(4)}, ${c.startLng.toFixed(4)}`)} → ${c.endAddr || (mapsConfigured() ? "Loading location…" : `${c.endLat.toFixed(4)}, ${c.endLng.toFixed(4)}`)}</p>
                </div>
              </div>`).join("")}
          </div>
          ${a.error ? `<p class="err" style="margin:0 0 12px;">${a.error}</p>` : ""}
          <div class="row-2">
            <button id="backAddDrivesBtn" class="btn btn-ghost">Back</button>
            <button id="confirmImportBtn" class="btn btn-amber">Add ${selectedCount} drive${selectedCount === 1 ? "" : "s"}</button>
          </div>
        `; })()}
      ` : ""}
    </div>
  </div>`;
}

function reportFieldValue(t, field) {
  switch (field) {
    case "date": return formatDateForDisplay(t.date);
    case "startTime": return formatTime24(t.startTime) || "";
    case "endTime": return formatTime24(t.endTime) || "";
    case "startPoint": return t.startPoint || "";
    case "endPoint": return t.endPoint || "";
    case "distance": return `${kmToDisplay(t.distance).toFixed(1)} ${unitLabel()}`;
    case "duration": return formatDuration(tripMinutes(t));
    case "purpose": return t.purpose || "";
    case "fuelCost": { const c = tripFuelCost(t); return c != null ? c.toFixed(2) : ""; }
    case "timeOfDay": return t.timeOfDay ? (t.timeOfDay === "day" ? "Daytime" : "Nighttime") : "";
    case "roadType": return t.roadType ? labelFor(ROAD_TYPES, t.roadType) : "";
    case "weather": return t.weather ? labelFor(WEATHER_TYPES, t.weather) : "";
    case "traffic": return t.traffic ? labelFor(TRAFFIC_LEVELS, t.traffic) : "";
    case "supervisorName": return t.supervisorName || "";
    default: return "";
  }
}

async function generateReportPDF() {
  const r = state.reportForm;
  if (!r.from || !r.to) { r.error = "Choose a date range."; render(); return; }
  const categories = r.type === "custom" ? r.categories : [r.type];
  if (!categories.length) { r.error = "Choose at least one category."; render(); return; }
  const fields = r.fields.length ? r.fields : (REPORT_DEFAULTS[r.type] || REPORT_DEFAULTS.normal);

  // Everything downstream works only off this pre-filtered subset — trips
  // outside the chosen categories/date range never enter the PDF-building
  // code, so "Work only" etc. fully excludes other data, not just hides it.
  const subset = state.trips.filter(t => categories.includes(t.tag) && t.date >= r.from && t.date <= r.to);
  const tableRows = subset.map(t => fields.map(f => reportFieldValue(t, f)));
  const fieldLabels = fields.map(f => (REPORT_FIELD_DEFS.find(d => d.v === f) || {}).l || f);

  state.reportGenerating = true; r.error = ""; render();
  try {
    const jsPDFCtor = await loadJsPDF();
    const doc = new jsPDFCtor();
    const marginX = 14;
    let y = 18;
    doc.setFontSize(16); doc.setFont(undefined, "bold");
    doc.text("Drive Log", marginX, y);
    doc.setFontSize(10); doc.setFont(undefined, "normal");
    y += 7;
    doc.text(`${state.profile ? state.profile.name : ""}`, marginX, y);
    y += 5;
    doc.text(`${r.type === "custom" ? categories.join(" + ") : r.type} report · ${formatDateForDisplay(r.from)} – ${formatDateForDisplay(r.to)}`, marginX, y);
    y += 9;

    const totalDistance = subset.reduce((s, t) => s + t.distance, 0);
    const byCat = { normal: 0, work: 0, supervised: 0 };
    subset.forEach(t => { byCat[t.tag] = (byCat[t.tag] || 0) + 1; });
    doc.setFont(undefined, "bold"); doc.text("Summary", marginX, y); doc.setFont(undefined, "normal");
    y += 6;
    doc.text(`Total distance: ${kmToDisplay(totalDistance).toFixed(1)} ${unitLabel()}`, marginX, y); y += 5;
    doc.text(`Total drives: ${subset.length}  (Normal ${byCat.normal || 0} · Work ${byCat.work || 0} · Supervised ${byCat.supervised || 0})`, marginX, y);
    y += 10;

    doc.setFont(undefined, "bold"); doc.text("Trips", marginX, y); doc.setFont(undefined, "normal");
    y += 7;

    const pageWidth = doc.internal.pageSize.getWidth();
    const colWidth = (pageWidth - marginX * 2) / fields.length;
    doc.setFontSize(8); doc.setFont(undefined, "bold");
    fieldLabels.forEach((lbl, i) => doc.text(String(lbl), marginX + i * colWidth, y));
    doc.setFont(undefined, "normal");
    y += 4;
    doc.line(marginX, y, pageWidth - marginX, y);
    y += 4;

    tableRows.forEach(row => {
      if (y > doc.internal.pageSize.getHeight() - 16) { doc.addPage(); y = 18; }
      row.forEach((cell, i) => {
        const text = String(cell).slice(0, 22);
        doc.text(text, marginX + i * colWidth, y);
      });
      y += 5;
    });

    if (tableRows.length === 0) { doc.text("No trips in this range.", marginX, y); }

    doc.save(`drive-log-${r.type}-${r.from}-to-${r.to}.pdf`);
    state.reportForm = null;
  } catch (e) {
    r.error = e.message || "Couldn't generate the PDF.";
  }
  state.reportGenerating = false;
  render();
}

async function syncUnsyncedTrips() {
  if (!state.sheetLink) return;
  const unsynced = state.trips.filter(t => !t.synced);
  let anyFailed = false;
  for (const t of unsynced) {
    try {
      await appendTripToSheet(state.sheetLink.spreadsheetId, t);
      t.synced = true;
    } catch (e) {
      anyFailed = true;
    }
  }
  if (unsynced.length) await storageSet(TRIPS_KEY, state.trips);
  state.googleError = anyFailed ? "Some drives didn't sync to Sheets — open Settings to try again." : "";
  // A sync pass (even one that finds nothing to send) counts as a check-in for the reminder timer.
  state.settings.lastSyncAt = todayStr();
  await storageSet(SETTINGS_KEY, state.settings);
  render();
}

async function finalizeTrip(trip) {
  trip.synced = false;
  state.trips = [trip, ...state.trips];
  await storageSet(TRIPS_KEY, state.trips);
  await addRecentLocations([trip.startPoint, trip.endPoint]);
  if (trip.tag === "supervised") checkSupervisedLicenceComplete();
  // Drives stay local — sync happens only when the user taps "Sync Now" (or the periodic reminder).
}

// Auto-reveal the full start→end address on each History row: any route
// cell whose text is truncated starts a continuous marquee scroll after a
// short idle delay so the whole address eventually passes into view. All
// rows share one loop distance/duration (shorter addresses just get more
// trailing gap padding) so every row starts and loops in lockstep, and the
// loop advances by the exact pixel distance between the two text copies so
// it never visibly jumps.
function attachRouteAutoScroll() {
  const entries = [];
  document.querySelectorAll(".route-cell").forEach(cell => {
    const clip = cell.querySelector(".route-clip");
    const track = clip && clip.querySelector(".route-track");
    if (!clip || !track) return;
    const singleWidth = track.scrollWidth;
    if (singleWidth <= clip.clientWidth + 2) return; // fits already — no marquee needed
    entries.push({ track, singleWidth, text: track.textContent });
  });
  if (!entries.length) return;

  const minGapPx = 56;
  const targetDistance = Math.max(...entries.map(e => e.singleWidth)) + minGapPx;
  const speedPxPerSec = 26;
  const duration = Math.max(4, targetDistance / speedPxPerSec);

  entries.forEach(({ track, singleWidth, text }) => {
    const gapPx = targetDistance - singleWidth; // shorter text gets a bigger trailing gap, so every row shares the same loop distance
    track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
    track.animate(
      [{ transform: "translateX(0px)" }, { transform: `translateX(-${targetDistance}px)` }],
      { duration: duration * 1000, iterations: Infinity, easing: "linear", delay: 3000 }
    );
  });
}

// Log page: Start/End Location fields show a scrolling preview of the full
// address once a *real* selection has been made (autocomplete pick, saved
// address chip, or "use my location") — not for arbitrary typed text — and
// only after a 3-second pause, so it never interrupts someone mid-typing.
// Manually editing the field, or focusing it again, cancels the preview.
const LOC_MARQUEE_DELAY_MS = 3000;
const LOC_MARQUEE_SPEED = 26;
const locMarquees = {};

function setupLocationMarquee(inputId) {
  const input = document.getElementById(inputId);
  const wrap = input && input.closest(".loc-field-wrap");
  const overlay = wrap && wrap.querySelector(".loc-overlay");
  const clip = overlay && overlay.querySelector(".route-clip");
  const track = clip && clip.querySelector(".route-track");
  if (!input || !overlay || !clip || !track) { locMarquees[inputId] = null; return; }

  let timer = null;
  let animation = null;

  function cancel() {
    if (timer) { clearTimeout(timer); timer = null; }
    if (animation) { animation.cancel(); animation = null; }
    overlay.style.display = "none";
  }

  function arm() {
    cancel();
    const text = input.value;
    if (!text || !text.trim()) return;
    timer = setTimeout(() => {
      timer = null;
      if (document.activeElement === input) return; // mid-edit — don't cover the field
      track.textContent = text;
      overlay.style.display = "flex";
      requestAnimationFrame(() => {
        const singleWidth = track.scrollWidth;
        if (singleWidth <= clip.clientWidth + 2) { overlay.style.display = "none"; return; }
        const gapPx = 48;
        track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
        const distance = singleWidth + gapPx;
        const duration = Math.max(4, distance / LOC_MARQUEE_SPEED);
        animation = track.animate(
          [{ transform: "translateX(0px)" }, { transform: `translateX(-${distance}px)` }],
          { duration: duration * 1000, iterations: Infinity, easing: "linear" }
        );
      });
    }, LOC_MARQUEE_DELAY_MS);
  }

  input.addEventListener("focus", cancel);
  input.addEventListener("input", cancel);
  overlay.onclick = () => { cancel(); input.focus(); };

  locMarquees[inputId] = { arm, cancel };
}

function armLocationMarquee(inputId) {
  const m = locMarquees[inputId];
  if (m) m.arm();
}

// The active-trip "From X at HH:MM" line — the start point there is already
// a confirmed, in-use address, so its preview just needs the same 3s pause.
function attachActiveStartMarquee() {
  const track = document.getElementById("activeStartPointTrack");
  const clip = track && track.closest(".route-clip");
  if (!track || !clip) return;
  const text = track.textContent;
  if (!text) return;
  setTimeout(() => {
    requestAnimationFrame(() => {
      const singleWidth = track.scrollWidth;
      if (singleWidth <= clip.clientWidth + 2) return;
      const gapPx = 48;
      track.innerHTML = `<span>${text}</span><span style="display:inline-block;padding-left:${gapPx}px;">${text}</span>`;
      const distance = singleWidth + gapPx;
      const duration = Math.max(4, distance / LOC_MARQUEE_SPEED);
      track.animate(
        [{ transform: "translateX(0px)" }, { transform: `translateX(-${distance}px)` }],
        { duration: duration * 1000, iterations: Infinity, easing: "linear" }
      );
    });
  }, LOC_MARQUEE_DELAY_MS);
}

function attachAppHandlers() {
  document.querySelectorAll(".tab-btn").forEach(btn => {

  });

    const el = document.getElementById(targetId);

      state.startPointInput = address;
      state.startLocArmed = true;

      state.preTripEndLocation = address;

        if (chart === "sup") { state.dashSupOffset += dir; state.dashSupTipIndex = null; }
        else { state.dashNormOffset += dir; state.dashNormTipIndex = null; }
        render();
      };
    });
    document.querySelectorAll(".col").forEach(col => {
      col.onclick = () => {
        const chart = col.dataset.chart, i = parseInt(col.dataset.i, 10);
        if (chart === "sup") state.dashSupTipIndex = state.dashSupTipIndex === i ? null : i;
        else state.dashNormTipIndex = state.dashNormTipIndex === i ? null : i;
        render();
      };
    });

    const logFillupBtnLog = document.getElementById("logFillupBtnLog");
    if (logFillupBtnLog) logFillupBtnLog.onclick = () => {
      state.fuelFillupForm = { date: todayStr(), odometer: "", amount: "", price: "", error: "" };
      render();
    };

    if (!state.active) {
      document.querySelectorAll("[data-drivetype]").forEach(btn => {
        btn.onclick = async () => {
          state.settings.driveType = btn.dataset.drivetype;
          await storageSet(SETTINGS_KEY, state.settings);

        };

        attachPlacesAutocomplete(spi, (desc) => {
          spi.value = desc;
          state.startPointInput = desc;
          state.startLocArmed = true;
          armLocationMarquee("startPointInput");
        });
      }
      const locStartBtn = document.getElementById("locateStartBtn");
      if (locStartBtn) locStartBtn.onclick = () => useMyLocation("start");

      const peti = document.getElementById("preTripEndInput");
      if (peti) {
        peti.oninput = (e) => {

          if (section) section.style.display = hasText ? "" : "none";

        attachPlacesAutocomplete(peti, (desc) => {
          peti.value = desc;
          state.preTripEndLocation = desc;
          state.endLocArmed = true;
          const section = document.getElementById("preTripEstimateSection");
          const hint = document.getElementById("preTripEndHint");
          if (section) section.style.display = "";

      const preTripEstBtn = document.getElementById("preTripEstimateBtn");
      if (preTripEstBtn) preTripEstBtn.onclick = () => {
        const origin = state.startPointInput.trim();
        const dest = state.preTripEndLocation.trim();

      };

      const logEstBtn = document.getElementById("logEstimateBtn");
      if (logEstBtn) logEstBtn.onclick = () => {
        state.logEstimateForm = { date: todayStr(), startTime: nowTimeStr() };
        render();
      };

      const applySuggestBtn = document.getElementById("applyRouteSuggestionBtn");
      if (applySuggestBtn) applySuggestBtn.onclick = async () => {
        state.settings.driveType = applySuggestBtn.dataset.suggesttag;
        await storageSet(SETTINGS_KEY, state.settings);
        render();
      };

      const startBtn = document.getElementById("startTripBtn");
      if (startBtn) startBtn.onclick = async () => {
        const trip = {
          tag: state.settings.driveType === "work" ? "work" : state.settings.driveType === "supervised" ? "supervised" : "normal",
          startPoint: state.startPointInput.trim() || "Unspecified",
          startTime: nowTimeStr(),
          date: todayStr(),
          startedAt: Date.now(),
        };
        if (state.startCoords) { trip.startLat = state.startCoords.lat; trip.startLng = state.startCoords.lng; }
        state.active = trip;
        state.startPointInput = "";
        state.startCoords = null;
        state.preTripEndLocation = "";
        state.preTripDistance = null;
        state.preTripDuration = null;
        state.preTripEstimateError = "";
        state.preTripEstimating = false;
        state.estimatedDuration = null;
        state.estimateError = "";
        state.distanceError = "";
        await storageSet(ACTIVE_KEY, trip);
        startTicker();
        render();
      };

      setupLocationMarquee("startPointInput");
      setupLocationMarquee("preTripEndInput");
      if (state.startLocArmed) armLocationMarquee("startPointInput");
      if (state.endLocArmed) armLocationMarquee("preTripEndInput");
    } else {
      renderTimerOnly();
      attachActiveStartMarquee();
      const epi = document.getElementById("endPointInput");
      if (epi) {
        epi.oninput = (e) => {
          state.endPoint = e.target.value;
          state.endLocArmed = false;
          const estBtn = document.getElementById("estimateRouteBtn");
          if (estBtn) estBtn.disabled = !state.endPoint.trim();
        };
        attachPlacesAutocomplete(epi, (desc) => {
          epi.value = desc;
          state.endPoint = desc;
          state.endLocArmed = true;
          const estBtn = document.getElementById("estimateRouteBtn");
          if (estBtn) estBtn.disabled = !state.endPoint.trim();
          armLocationMarquee("endPointInput");
        });
      }
      const locEndBtn = document.getElementById("locateEndBtn");
      if (locEndBtn) locEndBtn.onclick = () => useMyLocation("end");
      const estimateBtn = document.getElementById("estimateRouteBtn");
      if (estimateBtn) estimateBtn.onclick = () => {
        const dest = state.endPoint.trim();
        if (dest) runRouteEstimate(state.active.startPoint, dest);
      };
      const di = document.getElementById("distanceInput");
      if (di) di.oninput = (e) => {
        state.distance = e.target.value.replace(/[^0-9.]/g, "");
        e.target.value = state.distance;
        if (state.distanceError) {
          state.distanceError = "";
          const errEl = document.getElementById("distanceErrorMsg");
          if (errEl) { errEl.textContent = ""; errEl.style.display = "none"; }
        }
      };
      const stopBtn = document.getElementById("stopTripBtn");
      if (stopBtn) stopBtn.onclick = async () => {
        const distVal = parseFloat(state.distance);
        if (!state.distance || isNaN(distVal) || distVal <= 0) {
          state.distanceError = "Enter a distance to save this drive.";
          render();
          const diAgain = document.getElementById("distanceInput");
          if (diAgain) diAgain.focus();
          return;
        }
        state.distanceError = "";
        const a = state.active;
        const endTimeNow = nowTimeStr();
        const trip = {
          id: uid(), date: a.date, startTime: a.startTime, endTime: endTimeNow,
          distance: displayToKm(distVal), startPoint: a.startPoint,
          endPoint: state.endPoint.trim() || "Unspecified", tag: a.tag,
        };
        if (a.startLat != null) { trip.startLat = a.startLat; trip.startLng = a.startLng; }
        if (state.endCoords) { trip.endLat = state.endCoords.lat; trip.endLng = state.endCoords.lng; }
        state.active = null;
        state.endPoint = ""; state.distance = "";
        state.endCoords = null;
        state.estimatedDuration = null; state.estimateError = "";
        state.startPointInput = "";
        await storageDelete(ACTIVE_KEY);
        stopTicker();
        autoFillCurrentLocation();

        if (state.settings.driveType === "supervised") {
          state.pendingTrip = trip;
          const dn = defaultDayNightFor(trip.date, trip.startTime, trip.startLat, trip.startLng);
          state.conditionsForm = { timeOfDay: dn, roadType: "sealed", weather: "dry", traffic: "medium", supervisorId: state.settings.lastSupervisorId || "" };
          state.addingSupervisor = false;
          state.newSupervisorName = ""; state.newSupervisorLicence = "";
          render();
        } else {
          await finalizeTrip(trip);
          render();
        }
      };

      setupLocationMarquee("endPointInput");
      if (state.endLocArmed) armLocationMarquee("endPointInput");
    }
  }

  if (state.tab === "settings") {
    document.querySelectorAll("[data-drivetype]").forEach(btn => {
      btn.onclick = async () => {
        state.settings.driveType = btn.dataset.drivetype;
        await storageSet(SETTINGS_KEY, state.settings);
        render();

    const showDriveTypeSwitch = document.getElementById("showDriveTypeOnLogSwitch");

        state.settings.supervisedCompletionNotified = false;
        await storageSet(SETTINGS_KEY, state.settings);

        render();
      };

    const supNightInput = document.getElementById("supNightTargetInput");
    if (supNightInput) {
      supNightInput.onfocus = (e) => e.target.select();
      supNightInput.onchange = async (e) => {
        const val = Math.max(0, Math.round(parseFloat(e.target.value)) || state.settings.supervisedNightHoursTarget);
        state.settings.supervisedNightHoursTarget = val;
        state.settings.supervisedCompletionNotified = false;
        await storageSet(SETTINGS_KEY, state.settings);
        checkSupervisedLicenceComplete();
        render();
      };
    }

    const learnRoutesSwitch = document.getElementById("learnRoutesSwitch");
    if (learnRoutesSwitch) learnRoutesSwitch.onclick = async () => {
      state.settings.learnRoutes = !state.settings.learnRoutes;
      await storageSet(SETTINGS_KEY, state.settings);
      render();
    };

    const showSavedAddressesSwitch = document.getElementById("showSavedAddressesSwitch");
    if (showSavedAddressesSwitch) showSavedAddressesSwitch.onclick = async () => {
      state.settings.showSavedAddresses = state.settings.showSavedAddresses === false;
      await storageSet(SETTINGS_KEY, state.settings);
