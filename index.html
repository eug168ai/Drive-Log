<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Drive Log</title>
<link rel="manifest" href="manifest.json?v=3" />
<link rel="icon" href="icons/favicon-32.png?v=2" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=2" />
<meta id="themeColorMeta" name="theme-color" content="#14171C" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Drive Log" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#14171C; --bg-rgb:20,23,28; --surface:#1E2229; --surface-rgb:30,34,41; --border:#2A2F38;
    --text:#EDEEF0; --muted:#8B92A0; --faint:#565D6B;
    --amber:#F2A93B; --amber-rgb:242,169,59; --work:#E0642C; --normal:#4C9F70; --blue:#4C9FF2; --red:#E5484D; --cost:#C2661C; --time:#F7CB89;
    --grey-card:#27272A; --grey-border:#3F3F46; --grey-tag-bg:#3F3F46; --grey-tag-text:#D4D4D8; --grey-btn:#52525B; --grey-btn-text:#F4F4F5;
  }
  html[data-theme="light"]{
    --bg:#EEF0F3; --bg-rgb:238,240,243; --surface:#FFFFFF; --surface-rgb:255,255,255; --border:#DDE1E7;
    --text:#161A20; --muted:#666E7C; --faint:#9AA1AD;
    --amber:#B9740F; --amber-rgb:185,116,15; --work:#B54A1E; --normal:#20794A; --blue:#2568C4; --red:#C22F35; --cost:#9C5015; --time:#85540B;
    --grey-card:#F4F4F5; --grey-border:#D4D4D8; --grey-tag-bg:#E4E4E7; --grey-tag-text:#52525B; --grey-btn:#71717A; --grey-btn-text:#FFFFFF;
  }
  /* Accent theme colors — override --amber (primary) / --cost (secondary
     series) / --time (third series) only; amber's own values above are the
     "amber" accent default. --time is a lighter tint of --amber on dark
     backgrounds and a darker shade of it on light backgrounds, so all three
     dashboard series colors always read as one hue family, whichever accent
     is picked. --amber-rgb mirrors --amber as bare R,G,B channels so tint
     backgrounds (rgba(var(--amber-rgb), .14) etc.) can react to the accent too. */
  html[data-theme="dark"][data-accent="green"]{--amber:#3ECF8E; --amber-rgb:62,207,142; --cost:#197E4F; --time:#8BE2BB;}
  html[data-theme="light"][data-accent="green"]{--amber:#1C8F5B; --amber-rgb:28,143,91; --cost:#0F5C34; --time:#146742;}
  html[data-theme="dark"][data-accent="blue"]{--amber:#4C9FF2; --amber-rgb:76,159,242; --cost:#2B6FC2; --time:#94C5F7;}
  html[data-theme="light"][data-accent="blue"]{--amber:#2568C4; --amber-rgb:37,104,196; --cost:#1A4C8C; --time:#1B4B8D;}
  html[data-theme="dark"][data-accent="purple"]{--amber:#7E3FF2; --amber-rgb:126,63,242; --cost:#5A2BB0; --time:#B28CF7;}
  html[data-theme="light"][data-accent="purple"]{--amber:#6425C7; --amber-rgb:100,37,199; --cost:#431A87; --time:#481B8F;}
  html[data-theme="dark"][data-accent="red"]{--amber:#F2453B; --amber-rgb:242,69,59; --cost:#A82920; --time:#F78F89;}
  html[data-theme="light"][data-accent="red"]{--amber:#C2261C; --amber-rgb:194,38,28; --cost:#7A1810; --time:#8C1B14;}
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  }
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;}
  .wrap{max-width:640px;margin:0 auto;padding:12px 16px 12px;}
  .header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:8px;flex-wrap:wrap;gap:10px;}
  .header:active{opacity:.7;}
  .stats-row{display:flex;align-items:flex-start;gap:8px;}
  .stat-block{display:flex;flex-direction:column;align-items:center;}
  .icon-btn{background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;
            display:flex;align-items:center;justify-content:center;}
  .icon-btn:hover{color:var(--text);}
  .icon-btn.active{color:var(--amber);}
  .icon-btn .icon{width:20px;height:20px;}
  .connected-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(76,159,112,.15);
                  color:var(--normal);border:1px solid rgba(76,159,112,.3);padding:3px 10px;
                  border-radius:999px;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .brand{display:flex;align-items:center;gap:8px;}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0;line-height:1;}
  .brand p{color:var(--faint);font-size:12px;margin:2px 0 0;}
  .odo-label{color:var(--faint);font-size:10px;text-transform:uppercase;letter-spacing:.08em;margin:0 0 4px;text-align:center;}
  .odo{display:inline-flex;background:#0B0D10;border:1px solid var(--border);border-radius:8px;
       padding:5px 6px;box-shadow:inset 0 2px 4px rgba(0,0,0,.6);}
  .odo span{font-size:16px;font-weight:600;color:var(--amber);width:0.85ch;text-align:center;
            text-shadow:0 0 8px rgba(var(--amber-rgb),.45);}
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;
                  justify-content:center;padding:20px;z-index:50;}
  .modal-card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:20px;
             max-width:420px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-card h2{font-size:16px;margin:0 0 14px;}
  /* Route preview at the top of Log this Drive / Drive Summary -- static,
     not the live Maps JS API, since these are plain review/edit screens,
     not something the driver needs to pan or zoom. Fixed 16:9 rather than
     the raw 320x180 the Static Maps request itself comes back as, so the
     layout doesn't jump between a version with two markers/a path and one
     with only a single pin (a typed-but-not-yet-geocoded destination). */
  .log-drive-map{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;
    border-radius:10px;margin:0 0 16px;background:var(--bg);}
  /* Blend scrollbars into the dark theme instead of the bright default OS scrollbar. */
  .modal-card, .table-scroll{scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .modal-card::-webkit-scrollbar, .table-scroll::-webkit-scrollbar{width:6px;height:6px;}
  .modal-card::-webkit-scrollbar-track, .table-scroll::-webkit-scrollbar-track{background:transparent;}
  .modal-card::-webkit-scrollbar-thumb, .table-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;}
  .modal-card::-webkit-scrollbar-thumb:hover, .table-scroll::-webkit-scrollbar-thumb:hover{background:var(--faint);}
  .field-row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;}
  .date-compact{width:150px;flex-shrink:0;}
  .time-compact{width:84px;flex-shrink:0;text-align:center;font-variant-numeric:tabular-nums;}
  .tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:0;margin-bottom:8px;}
  .tab-btn{flex:1;padding:6px 0;border:none;background:transparent;border-radius:10px;font-size:14px;
           font-weight:600;color:var(--muted);cursor:pointer;text-transform:capitalize;}
  .tab-btn.active{background:var(--amber);color:var(--bg);}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:6px 10px;margin-bottom:11px;}
  .field-label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:8px;}
  .input, select{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;
         padding:9px 10px;color:var(--text);font-size:14px;outline:none;}
  .input:focus{border-color:var(--amber);}
  .input-icon{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:0 10px;position:relative;}
  .places-suggestions{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--surface);border:1px solid var(--border);
                       border-radius:8px;overflow:hidden;z-index:40;display:none;box-shadow:0 8px 24px rgba(0,0,0,.4);}
  .places-suggestion{padding:9px 12px;font-size:13px;color:var(--text);cursor:pointer;border-bottom:1px solid rgba(42,47,56,.6);}
  .places-suggestion:last-child{border-bottom:none;}
  .places-suggestion:hover, .places-suggestion.hovered{background:var(--bg);}
  .input-icon input{border:none;background:transparent;padding:9px 0;flex:1;color:var(--text);outline:none;font-size:14px;}
  .locate-btn{background:none;border:none;color:var(--amber);display:flex;align-items:center;padding:6px;cursor:pointer;flex-shrink:0;}
  .locate-btn:disabled{color:var(--muted);}
  .locate-btn svg{width:18px;height:18px;}
  .row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .toggle-row{display:flex;gap:8px;}
  .toggle{flex:1;padding:9px;border-radius:8px;font-size:14px;font-weight:600;background:transparent;
          border:1px solid var(--border);color:var(--muted);cursor:pointer;}
  .toggle.normal.on{background:rgba(76,159,112,.18);border-color:var(--normal);color:var(--normal);}
  .toggle.work.on{background:rgba(224,100,44,.18);border-color:var(--work);color:var(--work);}
  .toggle.supervised.on{background:rgba(76,159,242,.18);border-color:var(--blue);color:var(--blue);}
  .btn{width:100%;border:none;border-radius:8px;padding:12px;font-weight:700;font-size:15px;cursor:pointer;font-family:inherit;appearance:none;-webkit-appearance:none;
       display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;}
  .btn-amber{background:var(--amber);color:var(--bg);}
  .btn-stop{background:var(--work);color:#fff;}
  .btn-ghost{background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;padding:10px;}
  .btn-grey{background:var(--grey-btn);color:var(--grey-btn-text);}
  /* Log Drive/Start Drive share a row with two icon buttons on the saved
     routes card -- the default padding/font/gap (sized for a full-width
     button) left "Start Drive" no room to fit its icon and label on one
     line at that width, wrapping to a second line and doubling the
     button's height. */
  .plannerLogSavedBtn, .plannerStartSavedBtn{padding:10px 6px;font-size:13.5px;gap:5px;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .tag{display:inline-flex;align-items:center;padding:2px 8px;border-radius:5px;font-size:10px;
       font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .tag.work{background:rgba(224,100,44,.15);color:var(--work);border:1px solid rgba(224,100,44,.3);}
  .tag.normal{background:rgba(76,159,112,.15);color:var(--normal);border:1px solid rgba(76,159,112,.3);}
  .tag.supervised{background:rgba(76,159,242,.15);color:var(--blue);border:1px solid rgba(76,159,242,.3);}
  .beta-tag{display:inline-block;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;
            background:rgba(var(--amber-rgb),.18);color:var(--amber);border:1px solid rgba(var(--amber-rgb),.35);
            border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:middle;}
  /* .btn has no margin of its own, unlike .card's built-in margin-bottom —
     without this, the button sat flush against whatever followed it. */
  #logFillupBtnLog, #newPlannerRouteBtn{margin-bottom:11px;}
  .chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:5px 12px;border-radius:999px;font-size:12px;font-weight:600;border:1px solid var(--border);
        color:var(--muted);background:transparent;cursor:pointer;text-transform:capitalize;}
  .chip.active{background:var(--amber);color:var(--bg);border-color:var(--amber);}
  table{width:100%;border-collapse:collapse;font-size:11px;table-layout:fixed;}
  thead th{position:sticky;top:0;z-index:2;background:var(--surface);border-bottom:1px solid var(--border);
           text-align:left;padding:8px 4px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;font-size:9px;}
  tbody td{padding:6px 4px;border-bottom:1px solid rgba(42,47,56,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .table-scroll{max-height:420px;overflow-y:auto;}
  .col-date{width:58px;padding-left:8px;padding-right:0;}
  .col-time{width:68px;padding-right:0;}
  .col-num{width:37px;padding-left:0;padding-right:0;}
  .date-cell{padding-left:8px;padding-right:0;}
  .time-cell{padding-right:0;padding-left:4px;}
  .num-cell{padding-left:0;padding-right:0;}
  .route-cell{max-width:none;padding-left:8px;padding-right:0;position:relative;z-index:0;}
  .history-row{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:pan-y;}
  .history-row.long-pressing{background:rgba(var(--amber-rgb),.1);}
  .route-clip{overflow:hidden;white-space:nowrap;width:calc(100% - 8px);}
  .route-track{display:inline-block;white-space:nowrap;will-change:transform;}
  .loc-field-wrap{position:relative;flex:1;min-width:0;}
  .loc-field-wrap input{width:100%;overflow:hidden;text-overflow:ellipsis;}
  .loc-overlay{position:absolute;inset:0;display:none;align-items:center;background:var(--surface);cursor:text;font-size:14px;}
  .loc-overlay .route-clip{width:100%;}
  /* Edit Drive: label and its control share one row instead of stacking,
     for everywhere that's practical -- Purpose/Notes is the one exception,
     since free text needs the full width below its label, not squeezed
     into a same-line control. */
  .edit-field-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;}
  .edit-field-row .field-label{margin:0;flex-shrink:0;}
  .edit-field-row .input, .edit-field-row select{width:auto;flex:0 0 auto;}
  .edit-field-row .loc-field-wrap{flex:1;min-width:0;}
  .edit-field-row .loc-field-wrap .input{width:100%;}
  .empty{text-align:center;color:var(--faint);padding:24px;}
  .login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .login-box{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:24px;}
  .err{color:var(--work);font-size:12px;margin:4px 0 0;}
  .note{color:var(--faint);font-size:11px;line-height:1.5;margin-top:16px;}
  .drive-btn{background:rgba(66,133,244,.12);border:1px solid rgba(66,133,244,.35);color:#8fb3ff;}
  .timer{display:flex;align-items:center;gap:6px;color:var(--amber);font-size:18px;font-weight:600;}
  .hidden{display:none !important;}
  .icon{width:15px;height:15px;flex-shrink:0;}
  .icon-fuel{width:.9em;height:.9em;}
  .switch-row{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .switch{position:relative;width:44px;height:24px;flex-shrink:0;background:var(--bg);border:1px solid var(--border);
          border-radius:999px;cursor:pointer;transition:background .15s,border-color .15s;}
  .switch.on{background:var(--amber);border-color:var(--amber);}
  .switch .knob{position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:var(--muted);
                transition:transform .15s,background .15s;}
  .switch.on .knob{transform:translateX(20px);background:var(--bg);}
  .settings-title{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14px;margin:0 0 4px;}
  .settings-desc{color:var(--muted);font-size:12px;line-height:1.5;margin:2px 0 0;}
  .settings-actions{display:flex;gap:8px;flex-wrap:wrap;}
  .settings-actions .btn{width:auto;padding:8px 10px;font-size:12px;flex:1 1 0;min-width:0;white-space:nowrap;}
  .settings-inline-controls{display:flex;gap:8px;align-items:center;}
  .settings-inline-controls .input{flex:1 1 0;min-width:0;}
  .settings-inline-controls .btn{flex:1 1 0;width:auto;min-width:0;padding:9px 12px;font-size:13px;white-space:nowrap;}
  /* Estimate Drive / Log this Drive: same chip size, wrap naturally on narrow screens. */
  .pretrip-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .pretrip-values{margin-left:auto;white-space:nowrap;font-size:12px;color:var(--muted);}
  /* History action chips: icon-only on narrow (phone) screens so they always stay in line with the Filters label. */
  .history-actions .chip{padding:5px 8px;}

  /* Log-tab dashboard (bar-chart cards) */
  .divider{height:1px;background:var(--border);margin:7px 0;}
  .seg{display:flex;gap:5px;margin-bottom:6px;}
  .seg button{flex:1;padding:6px 0;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:12px;font-weight:600;font-family:inherit;cursor:pointer;}
  .seg button.on{background:rgba(var(--amber-rgb),.14);border-color:var(--amber);color:var(--amber);}
  .rangenav{display:flex;align-items:center;justify-content:center;gap:14px;margin-bottom:6px;}
  .rangenav button{width:26px;height:26px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-family:inherit;}
  .rangenav .range{font-size:12px;color:var(--muted);min-width:112px;text-align:center;}
  svg.chart{width:100%;display:block;overflow:visible;}
  .daylabels{position:relative;height:13px;margin-top:1px;}
  .daylabels span{position:absolute;top:0;transform:translateX(-50%);font-size:10px;color:var(--faint);white-space:nowrap;}
  .legend2{display:flex;row-gap:4px;column-gap:20px;margin-top:4px;flex-wrap:wrap;}
  .legend2 .item{display:flex;align-items:baseline;gap:6px;}
  .legend2 .sw{display:inline-block;width:9px;height:9px;border-radius:2px;margin-bottom:1px;}
  .legend2 .lbl{font-size:11px;color:var(--muted);}
  .legend2 .avgval{font-size:11px;color:var(--text);font-weight:600;}
  .pill-row{margin-bottom:7px;}
  .pill-row:last-child{margin-bottom:0;}
  .pill-row .hdr{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 3px;}
  .pill-track{position:relative;height:22px;border-radius:999px;background:var(--bg);border:1px solid var(--border);overflow:hidden;padding:3px 10px;display:flex;align-items:center;isolation:isolate;}
  .pill-fill{position:absolute;inset:0;border-radius:999px;}
  .pill-left{position:relative;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;mix-blend-mode:difference;}
  .pill-count{position:relative;margin-left:auto;font-size:11px;font-weight:700;letter-spacing:.04em;color:#fff;mix-blend-mode:difference;}
  .kv-line{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;margin-bottom:2px;}
  .kv-line .k{color:var(--muted);}
  .kv-line .v{color:var(--text);font-weight:600;}
  .kv-sub{font-size:10.5px;color:var(--faint);margin:0 0 6px;}
  .pacerow{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .pace-card{flex:1;min-width:0;border-radius:10px;padding:8px 11px;border:1px solid;display:flex;align-items:center;justify-content:center;text-align:center;}
  .pace-card .txt b{display:block;font-size:12.5px;}
  .pace-card .txt span{font-size:10.5px;opacity:.85;display:block;margin-top:1px;}
  .toggle2{display:flex;flex-direction:column;border:1px solid var(--border);border-radius:8px;overflow:hidden;font-size:10.5px;flex-shrink:0;align-self:stretch;cursor:pointer;}
  .toggle2 span{padding:4px 10px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;flex:1;}
  .toggle2 span.on{background:rgba(var(--amber-rgb),.14);color:var(--amber);font-weight:600;}
  .tip-bg{fill:var(--bg);stroke:var(--border);stroke-width:1;}
  .tip-text{fill:var(--text);font-size:10px;font-family:ui-monospace,monospace;}
  .col{cursor:pointer;}
  .swatch-row{display:flex;gap:5px;}
  .swatch-btn{flex:1;min-width:0;border:1px solid var(--c);border-radius:8px;padding:8px 2px;font-size:10.5px;font-weight:700;text-align:center;cursor:pointer;font-family:inherit;white-space:nowrap;overflow:hidden;background:rgba(var(--c-rgb),.14);color:var(--c);}
  .swatch-btn.active{background:var(--c);color:#14171C;border-color:var(--c);}

  .planner-leg-row{padding:8px 0;}
  .planner-leg-route-line{font-size:13px;font-weight:600;color:var(--text);}
  .planner-leg-route-line .route-clip{width:100%;}
  .planner-leg-meta-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;column-gap:8px;margin-top:6px;}
  .planner-leg-meta-side{display:flex;align-items:center;min-width:0;}
  .planner-leg-meta-side.right{justify-content:flex-end;}
  .planner-leg-meta{font-size:12px;color:var(--muted);text-align:center;white-space:nowrap;}
  .planner-leg-tags .toggle{padding:7px;font-size:13px;}
  .planner-route-card{cursor:pointer;}

  /* Trip Planner: fullscreen map builder + live GPS driving mode */
  .planner-fullscreen{position:fixed;inset:0;z-index:60;background:var(--bg);overflow:hidden;perspective:1200px;perspective-origin:50% 83%;}
  .planner-map-rotate-wrap{position:absolute;inset:0;transform-origin:50% 50%;}
  .planner-map-rotate-wrap.driving{top:-35%;left:-35%;right:-35%;bottom:-35%;width:170%;height:170%;
    /* No CSS transition here on purpose — heading and tilt are already
       smoothly interpolated frame-by-frame in JS (stepLiveMoveAnimation /
       rotateLiveMap's own tilt easing), and a CSS transition retargeting on
       top of that every animation frame fought it, lagging behind the
       already-smooth JS value enough that the marker's own (instant, un-
       eased) counter-rotation stopped lining up with the map's rotation —
       the actual cause of the position arrow not reliably pointing straight
       up on screen.
       Best-effort smoothing for the rotated/tilted route line and tiles —
       promotes the wrapper to its own composited layer up front rather
       than only once a transform starts, which noticeably reduces (if
       never fully eliminates) the jagged edges that come from rasterizing
       a 2D map at an angle. There's no way to fully match a true vector
       tilt without switching to Maps' vector renderer. */
    will-change:transform;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
  /* rotateX(tilt) foreshortens the wrapper's vertical reach by roughly
     cos(tilt) before perspective even gets involved — at the steepest tilt
     (74deg) that alone is ~3.6x, and perspective's own extra compression on
     the receding/far side pushes the real requirement well past that, which
     420% wasn't (black wedges showed at the corners at some heading/tilt
     combinations). Sized with real headroom above the worst case instead of
     the smallest number that happened to look fine in one test. */
  .planner-map-rotate-wrap.driving.angled{top:-330%;left:-330%;right:-330%;bottom:-330%;width:760%;height:760%;}
  #plannerMapCanvas{position:absolute;inset:0;background:var(--bg);}
  /* At steep tilt, the far/receding edge of the tilted map plane can cross
     behind the camera's perspective point — a known CSS 3D artifact (warped
     or flipped-looking tiles) rather than anything meaningful about the
     route. Rather than trying to clip the exact 3D geometry precisely, a
     plain top vignette hides whatever that edge does, the same way real
     driving-nav apps fade their view into a "sky" near the top rather than
     showing the raw tile edge. */
  /* Height scales with the actual tilt (see rotateLiveMap) rather than a
     flat 24vh regardless of angle -- that flat height was tuned for the
     steepest tilt tier and, applied identically at every shallower one
     too, masked off a needlessly large slice of perfectly good map at
     low/medium tilt where the artifact it's hiding barely exists yet. */
  .planner-sky-mask{display:none;position:absolute;top:0;left:0;right:0;height:var(--mask-vh, 24vh);z-index:15;pointer-events:none;
    background:linear-gradient(to bottom, var(--bg) 0%, var(--bg) 45%, transparent 100%);}
  .planner-sky-mask.show{display:block;}
  /* Large, unmistakable "you're paused" indicator dead center -- pause was
     otherwise only visible as a small icon-swap on the button itself. */
  .planner-paused-overlay{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:25;
    width:96px;height:96px;border-radius:50%;background:rgba(var(--amber-rgb),.16);
    border:3px solid var(--amber);color:var(--amber);display:flex;align-items:center;justify-content:center;
    pointer-events:none;}
  .planner-paused-overlay .icon{width:44px;height:44px;}
  .planner-topbar{position:absolute;top:0;left:0;right:0;z-index:20;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;
    /* Fixed-size fade at the very bottom, not a percentage of the topbar's
       own height -- with more than a couple of stops, or the saved-address
       pill row expanding a focused field, this box gets tall, and a
       percentage-based fade (its old 80%/100% stops) shrinks its solid
       backing proportionally, leaving whatever sits in the last fifth --
       often the always-visible Add Stop row -- rendered over a mostly
       transparent gradient with the map bleeding through behind it. */
    background:linear-gradient(to bottom, rgba(var(--bg-rgb),.99), rgba(var(--bg-rgb),.99) calc(100% - 28px - 2mm), transparent 100%);
    transition:opacity .25s ease;}
  /* Tapping the map with every stop already filled has nothing left to
     pick, so it toggles this instead — hiding the address form and bottom
     sheet to show the whole route edge-to-edge. */
  .planner-fullscreen.map-focus .planner-topbar,
  .planner-fullscreen.map-focus .planner-bottom-sheet{opacity:0;pointer-events:none;}
  .planner-header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px;}
  .planner-header .brand{cursor:pointer;}
  .planner-header .brand:active{opacity:.7;}
  .planner-header-icon{width:34px;height:34px;border-radius:9px;background:transparent;
    color:var(--text);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .planner-header-icon .icon{width:27px;height:27px;}
  .planner-header-actions{display:flex;align-items:center;gap:2px;flex-shrink:0;}
  .icon-btn:disabled{opacity:.3;cursor:not-allowed;}
  .planner-header-star{color:var(--amber);}
  .planner-header-star .icon{width:23px;height:23px;}
  .planner-header-star.active{background:rgba(var(--amber-rgb),.15);border-radius:999px;}

  .planner-field-block{margin-bottom:6px;}
  .planner-field-row{display:flex;align-items:center;gap:6px;}
  .planner-field-row .input-icon{flex:1;background:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.2);padding:0 8px;}
  .planner-field-row .input-icon input{padding:6px 0;}
  .planner-field-row .input-icon .icon{color:var(--muted);}
  .planner-field-row .input-icon.start .icon{color:var(--normal);}
  .planner-field-row .input-icon.stop .icon{color:var(--work);}
  .planner-field-row .input-icon.end .icon{color:var(--red);}
  .planner-remove-btn{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:none;border:none;
    color:var(--faint);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .planner-remove-btn:hover{color:var(--work);background:rgba(224,100,44,.12);}
  .planner-save-address-btn{flex-shrink:0;background:none;border:none;padding:4px;margin:0 -4px 0 2px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .planner-save-address-btn .icon{width:16px;height:16px;}
  .planner-save-address-btn:disabled{opacity:.3;cursor:not-allowed;}
  .planner-field-row .input-icon .planner-save-address-btn .icon{color:var(--amber);}

  .planner-leg-business-btn{flex-shrink:0;width:26px;height:26px;border-radius:50%;padding:0;
    border:1px solid rgba(var(--amber-rgb),.4);color:var(--amber);background:rgba(var(--amber-rgb),.1);
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .planner-leg-business-btn .icon{width:14px;height:14px;}
  .planner-leg-business-btn.on{background:var(--work);border-color:var(--work);color:#fff;}

  /* nowrap + scrollable-but-hidden-scrollbar rather than overflow-x:hidden
     alone — fitPlannerPillRow already collapses anything that doesn't fit
     into the "more" dropdown, but this is the fallback in case that JS pass
     hasn't run yet (e.g. the very first paint), so pills can never wrap to
     a second line even for a moment. */
  .planner-pill-row{display:none;align-items:center;gap:6px;flex-wrap:nowrap;overflow-x:auto;
    scrollbar-width:none;-ms-overflow-style:none;margin:6px 0 0;padding:1px 0 3px;}
  .planner-pill-row::-webkit-scrollbar{display:none;}
  .planner-pill-row.show{display:flex;}
  .planner-chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:5px 11px;border-radius:999px;
    font-size:11.5px;font-weight:600;border:1px solid rgba(var(--amber-rgb),.4);color:var(--amber);
    background:rgba(var(--amber-rgb),.1);cursor:pointer;flex-shrink:0;}
  .planner-chip:hover{border-color:var(--amber);}
  .planner-chip-icon{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;padding:0;
    border-radius:50%;border:1px solid rgba(var(--amber-rgb),.4);color:var(--amber);background:rgba(var(--amber-rgb),.1);
    cursor:pointer;flex-shrink:0;position:relative;}
  .planner-chip-icon:hover{border-color:var(--amber);}
  .planner-chip-icon .icon{width:14px;height:14px;}
  .planner-chip-icon select{position:absolute;inset:0;opacity:0;border:none;cursor:pointer;font-size:16px;}
  .planner-addstop-chip{display:inline-flex;align-items:center;gap:4px;white-space:nowrap;padding:5px 11px;
    border-radius:999px;font-size:11.5px;font-weight:600;border:1px solid rgba(var(--amber-rgb),.4);
    color:var(--amber);background:rgba(var(--amber-rgb),.1);cursor:pointer;flex-shrink:0;}
  /* Embedded in the pill row (see renderPlannerFieldBlock's trailingAddStop)
     -- margin-left:auto claims whatever space the saved-address pills
     don't use, pinning Add Stop to the row's far right edge rather than
     drifting wherever the last pill happens to end when there are only a
     couple of them. Once the row actually overflows and needs to scroll,
     there's no free space left to claim and this has no effect either way. */
  .planner-addstop-chip.trailing{margin-left:auto;}
  /* Flex with the two end items pinned to the row's true edges (rather than
     a 1fr/auto/1fr grid) so the toggle and Add Stop always get their full
     natural width, never squeezed into wrapping on a narrow screen — and
     the distance/time text is taken out of flow entirely (absolute,
     centered on the row itself) so it sits under the address bar's actual
     midpoint instead of the midpoint of whatever space the two unequal
     end items happen to leave behind. */
  .planner-leg-gap-row{position:relative;display:flex;align-items:center;justify-content:space-between;margin:6px 0;min-height:26px;}
  .planner-leg-gap-left{display:flex;align-items:center;flex-shrink:0;}
  .planner-leg-gap-row > .planner-addstop-chip{flex-shrink:0;}
  .planner-quick-estimate{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);max-width:44%;
    min-width:0;font-size:12.5px;font-weight:600;color:var(--muted);white-space:nowrap;
    overflow:hidden;text-overflow:ellipsis;text-align:center;pointer-events:none;}

  .planner-saved-list{max-height:min(52vh, 380px);overflow-y:auto;padding-right:2px;}
  .planner-saved-list .card{background:rgba(var(--surface-rgb),.9);}

  .planner-recenter-fab{position:absolute;right:14px;bottom:200px;width:40px;height:40px;border-radius:50%;
    background:rgba(var(--surface-rgb),.94);border:1px solid var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:25;box-shadow:0 4px 14px rgba(0,0,0,.3);}
  .planner-recenter-fab .icon{width:18px;height:18px;}

  .planner-angle-fab{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 104px);width:40px;height:40px;border-radius:50%;
    background:rgba(var(--surface-rgb),.94);border:1.5px solid var(--amber);color:var(--amber);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:31;box-shadow:0 4px 14px rgba(0,0,0,.3);
    transform:translateZ(0);}
  .planner-angle-fab.active{background:rgba(var(--amber-rgb),.18);}
  .planner-angle-fab .icon{width:18px;height:18px;}

  .planner-compass-fab{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 154px);width:40px;height:40px;border-radius:50%;
    background:rgba(var(--surface-rgb),.94);border:1.5px solid var(--border);color:var(--text);
    display:flex;align-items:center;justify-content:center;cursor:pointer;z-index:31;box-shadow:0 4px 14px rgba(0,0,0,.3);
    transform:translateZ(0);}
  .planner-compass-fab.active{border-color:var(--amber);}
  /* Counter-rotates against the map's own CSS rotation (see rotateLiveMap's
     --compass-rot) so the needle always points at true north on screen,
     whichever way the map itself is currently turned to face. */
  .planner-compass-needle{display:flex;width:20px;height:20px;transform:rotate(var(--compass-rot, 0deg));}
  .planner-compass-needle .icon{width:20px;height:20px;}

  .planner-angle-flash{position:absolute;right:14px;top:calc(env(safe-area-inset-top) + 200px);z-index:31;
    padding:6px 12px;border-radius:8px;background:rgba(var(--surface-rgb),.94);border:1px solid var(--amber);
    color:var(--amber);font-size:12px;font-weight:700;white-space:nowrap;pointer-events:none;opacity:0;}
  .planner-angle-flash.show{animation:plannerAngleFlash 1.4s ease-out;}
  @keyframes plannerAngleFlash{
    0%{opacity:0;transform:translateY(-4px);}
    12%{opacity:1;transform:translateY(0);}
    75%{opacity:1;}
    100%{opacity:0;}
  }

  .planner-bottom-sheet{position:absolute;left:0;right:0;bottom:0;z-index:20;
    padding:14px 10px calc(14px + env(safe-area-inset-bottom));
    background:none;
    transition:opacity .25s ease;}
  .planner-route-summary{background:rgba(var(--surface-rgb),.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border:1px solid var(--border);border-radius:12px;
    padding:5px 7px;margin-bottom:8px;max-height:46vh;overflow-y:auto;}
  .planner-route-badge{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px;}
  .planner-route-badge-label{display:flex;align-items:center;gap:6px;color:var(--amber);font-size:11px;font-weight:700;
    text-transform:uppercase;letter-spacing:.04em;}
  .planner-route-badge .icon{width:13px;height:13px;}
  .planner-save-star{padding:2px;color:var(--amber);}
  .planner-save-star .icon{width:18px;height:18px;}
  .planner-discard-drive-btn{padding:2px;}
  .planner-discard-drive-btn .icon{width:18px;height:16px;}
  .planner-route-metrics{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;}
  .planner-route-metrics .metric{text-align:center;flex:1;}
  .planner-route-metrics .metric .v{font-size:16px;font-weight:700;}
  .planner-route-metrics .metric .v .unit{font-size:.65em;font-weight:700;margin-left:2px;}
  .planner-route-metrics .metric .l{font-size:9px;color:var(--faint);text-transform:uppercase;letter-spacing:.06em;margin-top:1px;}
  .planner-route-metrics .div{width:1px;height:24px;background:var(--border);}
  /* Just Distance/Est. time (no leading type badge, unlike the Drive
     Completed card's 3-up row) -- shrink-to-content and centered as one
     compact group in the middle of the card, rather than each stretching
     to fill its own half of the full width via the shared flex:1 above. */
  .planner-route-metrics.centered{justify-content:center;gap:28px;}
  .planner-route-metrics.centered .metric{flex:0 0 auto;}
  .planner-hazard-row{display:flex;align-items:center;gap:7px;margin-top:6px;padding-top:6px;
    border-top:1px solid var(--border);color:var(--work);}
  .planner-hazard-row .icon{width:15px;height:15px;flex-shrink:0;color:var(--work);}
  .planner-hazard-row .route-clip{color:var(--work);font-size:12px;font-weight:600;}
  .planner-legtags{margin-top:6px;padding-top:6px;border-top:1px solid var(--border);}
  .planner-legtags .planner-leg-row{padding:3px 0;}
  .planner-legtags .divider{margin:3px 0;}

  /* Solid for a fixed distance off the very top edge, THEN the same fade
     curve as the eta bar's own background below -- mirrored exactly (same
     stops, opposite direction) rather than each panel having its own
     independently-tuned profile. Fixed-mm base rather than a pure
     percentage: this box's own height doesn't vary as wildly as the
     address form's did (see .planner-topbar's own fix for that failure
     mode), but there's no reason for the two panels to drift apart either.
     translateZ(0) forces this onto its own GPU compositing layer, isolated
     from .planner-map-rotate-wrap's own constantly-updating 3D transform
     right behind it -- an experimental mitigation for page elements
     intermittently vanishing, not a confirmed fix (no code path was found
     that actually removes them; this targets the layer-eviction bugs
     mobile Chrome can show near a large, busy 3D-transformed neighbor). */
  .planner-drive-banner{position:absolute;top:0;left:0;right:0;z-index:30;
    padding:calc(env(safe-area-inset-top) + 8px) 10px 10px;
    background:linear-gradient(to bottom, rgba(var(--bg-rgb),.99) 0, rgba(var(--bg-rgb),.99) 8mm, rgba(var(--bg-rgb),.93) 55%, transparent 100%);
    display:flex;align-items:center;gap:12px;transform:translateZ(0);}
  /* Google Maps' own maneuver icon is a blue rounded square with a white
     arrow, top-left of the screen — this is the left-most element in the
     row, and the row itself sits at the very top (see .planner-drive-banner
     above), so it lands in the same corner. */
  .planner-turn-icon{width:52px;height:52px;border-radius:14px;background:var(--blue);color:#fff;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;}
  .planner-turn-icon.arrive{background:var(--normal);}
  .planner-turn-icon .icon{width:26px;height:26px;}
  /* Road name + shield stacked in one column now (shield underneath),
     rather than the shield sitting in its own column pinned to the very
     top of the screen -- that pin routinely clipped the shield behind the
     browser's own UI above the page. No separate "what road is the shield
     for" caption underneath it either now -- the heading right above it
     already says that. */
  .planner-turn-text{min-width:0;flex:1;display:flex;flex-direction:column;align-items:flex-start;gap:4px;}
  .planner-turn-text b{display:block;max-width:100%;font-size:19px;font-weight:900;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .planner-turn-shield{display:none;align-items:center;justify-content:center;flex-shrink:0;
    min-width:36px;height:24px;padding:0 6px;border-radius:5px;background:#2E7D32;color:#FFD400;
    font-size:13px;font-weight:800;letter-spacing:.02em;border:1.5px solid #fff;}
  .planner-turn-shield.show{display:inline-flex;}
  .planner-turn-dist{margin-left:auto;text-align:right;flex-shrink:0;max-width:38%;}
  .planner-turn-dist .v{font-size:24px;font-weight:800;color:var(--amber);}
  .planner-turn-dist .v .unit{font-size:.55em;font-weight:700;margin-left:1px;}
  /* Tightens the gap either side of a decimal point in these monospace
     figures (see tightenDecimal/formatLiveTurnDistance) -- a bare "."
     otherwise takes up a whole fixed-width character cell, reading as a
     much bigger gap than in a normal proportional font. */
  .mono .dp{margin:0 -0.16em;}
  .planner-turn-dist .l{font-size:11px;color:var(--faint);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  /* Two rows: Pause/Stop above (pushed to the far right, above the bottom
     edge), the ETA/Remaining/Distance row at the very bottom edge itself.
     Background mirrors .planner-drive-banner's exactly (same stops,
     opposite direction) -- see its own comment. Also on its own
     compositing layer for the same experimental reason. */
  .planner-eta-bar{position:absolute;left:0;right:0;bottom:0;z-index:30;
    padding:8px 10px calc(6px + env(safe-area-inset-bottom));
    background:linear-gradient(to top, rgba(var(--bg-rgb),.93) 0, rgba(var(--bg-rgb),.93) 55%, transparent 100%);
    display:flex;flex-direction:column;align-items:stretch;gap:10px;transform:translateZ(0);}
  /* The "you are here" indicator -- a plain CSS-fixed overlay, not the
     google.maps.Marker tied to a real lat/lng (see plannerLiveMarker,
     kept invisible now). Anchored here via bottom:100% of the eta bar's
     own box (its containing block, being position:absolute) plus a fixed
     physical gap, rather than a measured pixel offset, so it always sits a
     fixed physical distance above the current-road pill -- the eta bar's
     top row -- regardless of which controls that bar is currently
     showing. Points straight up in every course-up angle mode (the map
     itself rotates to keep direction-of-travel screen-up); only north-up
     "overhead" rotates the arrow itself, toward the actual heading (see
     rotateLiveMap). liveMarkerScreenFraction reads THIS element's actual
     rendered position (not an independent guess) to decide where the
     camera re-centers the driver's real position to project onto, so the
     two can no longer drift apart the way two separately-chosen fixed
     points could. Blue again (matching the app's own route-line color),
     but with a white halo stacked from two identical zero-offset drop-
     shadows -- a plain blue-on-blue arrow disappeared against the route
     line it's meant to sit on; the halo keeps it legible there without
     giving up the color match. */
  .planner-position-arrow{position:absolute;left:50%;bottom:100%;z-index:26;
    transform:translateX(-50%) rotate(var(--arrow-rot, 0deg));
    width:38px;height:38px;margin-bottom:0;color:#4C9FF2;
    filter:drop-shadow(0 0 2.5px #fff) drop-shadow(0 0 2.5px #fff) drop-shadow(0 2px 4px rgba(0,0,0,.55));
    display:flex;align-items:center;justify-content:center;pointer-events:none;}
  .planner-position-arrow .icon{width:100%;height:100%;}
  /* Equal 1fr side columns (same trick as .planner-eta-metrics-row below)
     so the road pill genuinely centers regardless of how wide the controls
     column actually is, with both sitting at the same height -- the
     controls used to be their own row entirely above the pill. */
  .planner-eta-top-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;column-gap:10px;}
  .planner-current-road-row{display:flex;justify-content:center;}
  /* Column, not row -- Next (multi-leg drives only) above Pause above Stop. */
  .planner-eta-controls{display:flex;flex-direction:column;align-items:center;gap:10px;justify-self:end;}
  .planner-next-leg-btn{width:40px;height:40px;border-radius:50%;flex-shrink:0;background:transparent;
    border:2px solid var(--blue);color:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .planner-next-leg-btn .icon{width:17px;height:17px;}
  .planner-current-road-pill{display:none;font-size:12px;font-weight:700;color:var(--amber);
    background:rgba(var(--amber-rgb),.12);border:1px solid rgba(var(--amber-rgb),.4);border-radius:999px;padding:4px 12px;}
  .planner-current-road-pill.show{display:inline-block;}
  .planner-pause-drive-btn, .planner-end-drive-btn{width:46px;height:46px;border-radius:50%;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .planner-pause-drive-btn{background:transparent;border:2px solid var(--amber);color:var(--amber);}
  .planner-pause-drive-btn.paused{background:var(--amber);color:var(--bg);}
  .planner-pause-drive-btn .icon{width:18px;height:18px;}
  .planner-end-drive-btn{background:var(--amber);border:none;color:var(--bg);box-shadow:0 6px 16px rgba(0,0,0,.4);}
  .planner-end-drive-btn .icon{width:24px;height:24px;}
  /* Spread edge to edge, with Remaining as the sandwiched (so centered)
     middle column regardless of how wide ETA/Distance's own text runs. */
  .planner-eta-metrics-row{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;column-gap:10px;width:100%;}
  /* Shrink-wrapped and centered on itself (rather than stretched full-width
     and left-flush) so the "ETA" label always sits centered directly under
     the time value above it, whatever width that value renders at --
     justify-self:start keeps the whole block anchored toward the column's
     left edge, same overall position as before. */
  .planner-eta-metrics-row .m.eta{display:inline-flex;flex-direction:column;align-items:center;text-align:center;justify-self:start;}
  .planner-eta-metrics-row .m.remain{text-align:center;}
  .planner-eta-metrics-row .m.dist{text-align:right;}
  .planner-eta-metrics-row .m.remain .v{font-size:22px;font-weight:800;color:var(--amber);}
  .planner-eta-bar.paused .planner-eta-metrics-row .m.remain .v{color:var(--muted);}
  .planner-eta-metrics-row .m.eta .v, .planner-eta-metrics-row .m.dist .v{font-size:15px;font-weight:700;color:var(--text);}

// Approximate sunrise/sunset (NOAA algorithm, good to a few minutes) used to

function sunriseSunsetUTC(date, lat, lng) {

    // a "day N" sunrise/sunset can land on UTC day N-1 or N+1.

// --- Google Timeline historical import -----------------------------------

function parseLatLngString(str) {

// - GAP_BREAK_MS: gap beyond which we don't compute a speed across two points
//   (treated as a break — e.g. phone was stationary/off/no signal).
// - STITCH_GAP_MS: if a driving segment ends and another starts again within
//   this short a gap, merge them into one drive (e.g. a stoplight/parking stop).
// - MIN_SPEED / MAX_SPEED (km/h): the "driving" band.
// - MIN_SEGMENT_MS: minimum sustained duration to count as a real drive.
const TIMELINE_GAP_BREAK_MS = 2.5 * 60 * 1000;

function detectDrivingSegments(points) {
  if (points.length < 2) return [];

  //    the time gap is too large to trust a speed calculation across it.
  const runs = [[points[0]]];
  for (let i = 1; i < points.length; i++) {
    const gap = points[i].t - points[i - 1].t;
    if (gap > TIMELINE_GAP_BREAK_MS || gap <= 0) {
      runs.push([points[i]]);
    } else {
      runs[runs.length - 1].push(points[i]);
    }
  }
  // 2. Within each unbroken run, find sub-stretches where speed stays in the
  //    driving band, and merge those into segments.
  let segments = [];
  runs.forEach(run => {
    if (run.length < 2) return;
    let segStart = 0;
    let inDrive = false;
    for (let i = 1; i <= run.length; i++) {
      let speedOk = false;
      if (i < run.length) {
        const a = run[i - 1], b = run[i];
        const dtH = (b.t - a.t) / 3600000;
        const distKm = haversineKm(a.lat, a.lng, b.lat, b.lng);

    const prev = stitched[stitched.length - 1];

      const request = { input: query, sessionToken: new AutocompleteSessionToken() };
      const region = getDeviceRegionCode();
      if (region) request.includedRegionCodes = [region];
      const bias = await getPositionForAutocomplete();
      if (bias) {
        request.locationBias = { center: bias, radius: 50000 };
        request.origin = bias;
      }
      const { suggestions } = await AutocompleteSuggestion.fetchAutocompleteSuggestions(request);
      if (!suggestions || !suggestions.length) { hide(); return; }
      // With `origin` set, each prediction carries distanceMeters — sort by
      // it so the closest address is always first, not just whichever
      // Google ranked most textually relevant.
      const ranked = suggestions.slice().sort((a, b) => {
        const da = a.placePrediction && a.placePrediction.distanceMeters;
        const db = b.placePrediction && b.placePrediction.distanceMeters;
        if (da == null && db == null) return 0;
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      });
      dropdown.innerHTML = ranked.slice(0, 5).map(s => {
        const text = s.placePrediction && s.placePrediction.text ? s.placePrediction.text.text : "";
        return `<div class="places-suggestion" data-desc="${escAttr(text)}">${text}</div>`;
      }).join("");
      dropdown.style.display = "block";
      dropdown.querySelectorAll(".places-suggestion").forEach(el => {
        el.onmousedown = (e) => {
          e.preventDefault();
          onSelect(el.dataset.desc);
          hide();
        };
      });
    } catch (e) {
      const detail = (e && (e.message || e.status || e.code)) || (e ? JSON.stringify(e) : "unknown error");
      dropdown.innerHTML = `<div class="places-suggestion" style="color:var(--work);cursor:default;">Lookup failed (${detail})</div>`;
      dropdown.style.display = "block";
    }
  }, 300);
  inputEl.addEventListener("input", search);
  inputEl.addEventListener("blur", () => setTimeout(hide, 150));
}

// drive.metadata.readonly is read-only, metadata-only (file names/ids, never
// content) — just enough to search for a Drive Log sheet already sitting in
// the user's Drive before offering to create a duplicate. drive.file is
// separate and additive: create/access files this app itself creates (the
// detailed route-image uploads, see uploadTripImageToDrive) — it can't see
// or touch anything else in the user's Drive. Anyone who connected before
// this scope was added needs to reconnect (Disconnect -> Connect) before
// uploads will work; their cached token just won't have it until then.
const GOOGLE_SCOPES = "https://www.googleapis.com/auth/spreadsheets https://www.googleapis.com/auth/drive.metadata.readonly https://www.googleapis.com/auth/drive.file";
let googleTokenClient = null;
let googleAccessToken = null;
let googleTokenExpiresAt = 0;

function googleConfigured() {
  return GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID.indexOf("PASTE_YOUR_CLIENT_ID_HERE") === -1;
}

function ensureTokenClient(callback) {
  if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
  if (!googleTokenClient) {
    googleTokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: GOOGLE_SCOPES,
      callback: callback,
    });
  } else {
    googleTokenClient.callback = callback;
  }
  return googleTokenClient;
}

function getGoogleToken(promptMode) {
  return new Promise((resolve, reject) => {
    let settled = false;
    // A blocked or silently-failed OAuth popup (third-party-cookie
    // restrictions, aggressive popup blockers — both far more common in
    // incognito/private browsing) can mean the token client's callback
    // simply never fires, leaving the caller stuck on "Connecting…"
    // forever with no way to know why. This turns that into a real error
    // after a minute rather than an infinite spinner.
    const timer = setTimeout(() => {
      if (settled) return;
      settled = true;
      reject(new Error("Google sign-in timed out — the popup may have been blocked. Check your browser's popup blocker (and try outside incognito/private mode, where third-party cookies are often restricted) and try again."));
    }, 60000);
    const client = ensureTokenClient((resp) => {
      if (settled) return; // timed out already — ignore a late response
      settled = true;
      clearTimeout(timer);
      if (resp && resp.access_token) {
        googleAccessToken = resp.access_token;
        googleTokenExpiresAt = Date.now() + (Number(resp.expires_in || 3300) * 1000);
        storageSet(GOOGLE_TOKEN_KEY, { token: googleAccessToken, expiresAt: googleTokenExpiresAt });
        resolve(resp.access_token);
      } else {
        reject(resp);
      }
    });
    if (!client) { clearTimeout(timer); settled = true; reject(new Error("Google sign-in library not loaded")); return; }
    client.requestAccessToken({ prompt: promptMode || "" });
  });
}

async function loadPersistedGoogleToken() {
  try {
    const saved = await storageGet(GOOGLE_TOKEN_KEY);
    if (saved && saved.token && saved.expiresAt > Date.now() + 60000) {
      googleAccessToken = saved.token;
      googleTokenExpiresAt = saved.expiresAt;
    }
  } catch (e) {}
}

async function getFreshGoogleToken() {
  if (googleAccessToken && Date.now() < googleTokenExpiresAt - 60000) return googleAccessToken;
  return getGoogleToken("");
}

// Looks for a spreadsheet named "Drive Log" — the name createDriveLogSheet
// always uses — visible to this account, most-recently-modified first, so
// a second device or a reconnect can offer to reuse it instead of quietly
// creating a duplicate. Deliberately loose: `contains` (a case-insensitive
// substring match) rather than an exact `=`, and no ownership restriction
// — a strict exact-name-and-owned-by-me query turned out to silently miss
// real matches sitting right there in Drive (a small naming difference, or
// the account that first created the sheet not being a hard requirement
// for reusing it), which is worse than occasionally over-offering a sheet
// the user can just decline in the picker.
async function findExistingDriveLogSheets(token) {
  const q = encodeURIComponent("name contains 'Drive Log' and mimeType = 'application/vnd.google-apps.spreadsheet' and trashed = false");
  const res = await fetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,webViewLink,modifiedTime)&orderBy=modifiedTime desc`, {
    headers: { "Authorization": "Bearer " + token },
  });
  if (!res.ok) {
    // The status code alone doesn't say why: a 403 here could mean the
    // Drive API isn't enabled for this app's Google Cloud project, or that
    // the drive.metadata.readonly scope was never actually granted — very
    // different fixes, so surface Google's own reason/message when present.
    let detail = "";
    try {
      const body = await res.json();
      const err = body && body.error;
      detail = err && (err.status || err.message) ? ` (${[err.status, err.message].filter(Boolean).join(": ")})` : "";
    } catch (e) { /* body wasn't JSON — status code is all we have */ }
    throw new Error("Drive search failed: " + res.status + detail);
  }
  const data = await res.json();
  return (data.files || []).map(f => ({ spreadsheetId: f.id, url: f.webViewLink, name: f.name, modifiedTime: f.modifiedTime }));
}

async function createDriveLogSheet(token) {
  token = token || await getGoogleToken("consent");
  const res = await fetch("https://sheets.googleapis.com/v4/spreadsheets", {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({
      properties: { title: "Drive Log" },
      sheets: [{ data: [{ startRow: 0, startColumn: 0, rowData: [{ values: [
        "Date","Start Time","End Time","Distance (km)","Start Point","End Point","Type",
        "Time of Day","Road Type","Weather","Traffic Density","Supervisor Name","Supervisor Licence No.","Route Image"
      ].map(v => ({ userEnteredValue: { stringValue: v } })) }] }] }],
    }),
  });
  if (!res.ok) throw new Error("Failed to create sheet: " + res.status);
  const data = await res.json();
  return { spreadsheetId: data.spreadsheetId, url: data.spreadsheetUrl };
}

function labelFor(list, value) {
  const m = list.find(x => x.v === value);
  return m ? m.l : "";
}

async function appendTripToSheet(spreadsheetId, trip) {
  const token = await getFreshGoogleToken();
  const row = [[
    trip.date, trip.startTime, trip.endTime, Number(trip.distance).toFixed(1),
    trip.startPoint, trip.endPoint, labelFor(DRIVE_TYPES, trip.tag),
    trip.timeOfDay ? (trip.timeOfDay === "day" ? "Day" : "Night") : "",
    trip.roadType ? labelFor(ROAD_TYPES, trip.roadType) : "",
    trip.weather ? labelFor(WEATHER_TYPES, trip.weather) : "",
    trip.traffic ? labelFor(TRAFFIC_LEVELS, trip.traffic) : "",
    trip.supervisorName || "", trip.supervisorLicence || "", trip.routeImageLink || "",
  ]];
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A:N:append?valueInputOption=USER_ENTERED`,
    { method: "POST", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ values: row }) }
  );
  if (!res.ok) throw new Error("Append failed: " + res.status);
}

// Reads back rows previously written by appendTripToSheet (same A:M column
// layout) so choosing an existing sheet pulls its already-logged drives into
// this device's local Log -- sync had only ever gone one-way, local -> sheet,
// which left a fresh install (or one that had its storage cleared) connected
// but still showing an empty history despite the sheet having real data.
async function importTripsFromSheet(spreadsheetId, token) {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/A2:N?majorDimension=ROWS`,
    { headers: { "Authorization": "Bearer " + token } }
  );
  if (!res.ok) throw new Error("Sheet read failed: " + res.status);
  const data = await res.json();
  const reverseLabel = (list, label) => { const m = list.find(x => x.l === label); return m ? m.v : undefined; };
  return (data.values || []).filter(r => r[0]).map(r => {
    const trip = {
      id: uid(), date: r[0] || "", startTime: r[1] || "", endTime: r[2] || "",
      distance: Number(r[3]) || 0, startPoint: r[4] || "", endPoint: r[5] || "",
      tag: reverseLabel(DRIVE_TYPES, r[6]) || "normal",
      synced: true, // already sitting in the sheet -- don't re-append it on the next sync
    };
    if (r[7] === "Day" || r[7] === "Night") trip.timeOfDay = r[7] === "Day" ? "day" : "night";
    const roadType = reverseLabel(ROAD_TYPES, r[8]); if (roadType) trip.roadType = roadType;
    const weather = reverseLabel(WEATHER_TYPES, r[9]); if (weather) trip.weather = weather;
    const traffic = reverseLabel(TRAFFIC_LEVELS, r[10]); if (traffic) trip.traffic = traffic;
    if (r[11]) trip.supervisorName = r[11];
    if (r[12]) trip.supervisorLicence = r[12];
    // Just the link, not the actual image -- re-downloading and re-uploading
    // every past drive's detailed image on a fresh reconnect would be slow
    // and mostly redundant with what's already sitting in Drive. Opening it
    // from the trip editor goes straight to that Drive link instead of a
    // locally-cached copy for an imported trip.
    if (r[13]) trip.routeImageLink = r[13];
    return trip;
  });
}

// Skips rows that already match a local trip (same date/start/end/points) so
// reconnecting to the same sheet twice doesn't duplicate every drive.
function mergeImportedTrips(imported) {
  const key = (t) => `${t.date}|${t.startTime}|${t.endTime}|${t.startPoint}|${t.endPoint}`;
  const existingKeys = new Set(state.trips.map(key));
  const toAdd = imported.filter(t => !existingKeys.has(key(t)));
  if (toAdd.length) {
    state.trips = [...toAdd, ...state.trips].sort((x, y) => (x.date + x.startTime < y.date + y.startTime ? 1 : -1));
  }
  return toAdd.length;
}

// Everything that isn't a drive -- profile, settings, supervisors, saved
// addresses, fuel fill-ups, planned routes, recent locations -- lives only
// in this device's local storage and, unlike trips, never round-trips
// through the sheet at all. Backed up as one JSON blob in a hidden second
// tab of the same spreadsheet so it survives a cleared/lost device the same
// way drives already do.
const APP_DATA_SHEET_TITLE = "AppData";

async function ensureAppDataSheet(spreadsheetId, token) {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}?fields=sheets.properties.title`,
    { headers: { "Authorization": "Bearer " + token } }
  );
  if (!res.ok) throw new Error("Sheet lookup failed: " + res.status);
  const data = await res.json();
  const exists = (data.sheets || []).some(s => s.properties && s.properties.title === APP_DATA_SHEET_TITLE);
  if (exists) return;
  const addRes = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}:batchUpdate`, {
    method: "POST",
    headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
    body: JSON.stringify({ requests: [{ addSheet: { properties: { title: APP_DATA_SHEET_TITLE, hidden: true } } }] }),
  });
  if (!addRes.ok) throw new Error("Couldn't create AppData tab: " + addRes.status);
}

async function backupSettingsToSheet(spreadsheetId, token) {
  await ensureAppDataSheet(spreadsheetId, token);
  const blob = {
    profile: state.profile, settings: state.settings, supervisors: state.supervisors,
    savedAddresses: state.savedAddresses, fuelFillups: state.fuelFillups,
    plannedRoutes: state.plannedRoutes, recentLocations: state.recentLocations,
  };
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(APP_DATA_SHEET_TITLE)}!A1?valueInputOption=RAW`,
    { method: "PUT", headers: { "Authorization": "Bearer " + token, "Content-Type": "application/json" },
      body: JSON.stringify({ values: [[JSON.stringify(blob)]] }) }
  );
  if (!res.ok) throw new Error("Settings backup failed: " + res.status);
}

// Returns true if a backup was actually found and applied, false for an
// older sheet that predates this feature (no AppData tab yet -- not an
// error, just nothing to restore).
async function restoreSettingsFromSheet(spreadsheetId, token) {
  const res = await fetch(
    `https://sheets.googleapis.com/v4/spreadsheets/${spreadsheetId}/values/${encodeURIComponent(APP_DATA_SHEET_TITLE)}!A1`,
    { headers: { "Authorization": "Bearer " + token } }
  );
  if (res.status === 400) return false; // "Unable to parse range" -- tab doesn't exist
  if (!res.ok) throw new Error("Settings restore failed: " + res.status);
  const data = await res.json();
  const cell = data.values && data.values[0] && data.values[0][0];
  if (!cell) return false;
  let blob;
  try { blob = JSON.parse(cell); } catch { return false; }
  if (blob.profile) { state.profile = blob.profile; await storageSet(PROFILE_KEY, blob.profile); }
  if (blob.settings) { state.settings = blob.settings; await storageSet(SETTINGS_KEY, blob.settings); }
  if (blob.supervisors) { state.supervisors = blob.supervisors; await storageSet(SUPERVISORS_KEY, blob.supervisors); }
  if (blob.savedAddresses) { state.savedAddresses = blob.savedAddresses; await storageSet(SAVED_ADDRESSES_KEY, blob.savedAddresses); }
  if (blob.fuelFillups) { state.fuelFillups = blob.fuelFillups; await storageSet(FUEL_FILLUPS_KEY, blob.fuelFillups); }
  if (blob.plannedRoutes) { state.plannedRoutes = blob.plannedRoutes; await storageSet(PLANNED_ROUTES_KEY, blob.plannedRoutes); }
  if (blob.recentLocations) { state.recentLocations = blob.recentLocations; await storageSet(RECENT_LOCATIONS_KEY, blob.recentLocations); }
  return true;
}

// --- Compact, always-24-hour time fields ---------------------------------
// Native <input type="time"> renders per the browser/OS locale (12hr with
// AM/PM on many devices) and silently blanks out if its value isn't exactly
// "HH:MM", which is what caused Start Time to appear empty in the edit modal
// for some drives. These plain text inputs are locale-proof, always show
// 24hr HH:MM, echo back whatever's actually stored, and can be sized freely.
function formatTimeInputValue(raw) {
  const digits = raw.replace(/\D/g, "").slice(0, 4);
  if (digits.length <= 2) return digits;
  return digits.slice(0, 2) + ":" + digits.slice(2);
}
function clampTimeValue(raw) {
  const digits = raw.replace(/\D/g, "").padEnd(4, "0").slice(0, 4);
  let h = parseInt(digits.slice(0, 2), 10);
  let m = parseInt(digits.slice(2, 4), 10);
  if (isNaN(h)) h = 0;
  if (isNaN(m)) m = 0;
  h = Math.min(23, Math.max(0, h));
  m = Math.min(59, Math.max(0, m));
  return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
}
// Wires up input(reformat-as-you-type) + blur(clamp-to-valid-24hr) on a
// compact time text field. `set(v)` is called with the current string on
// every keystroke and with the clamped final value on blur.

    e.target.value = formatted;

  };

// A single getCurrentPosition() call often returns the device's first
// available fix — frequently a coarse Wi-Fi/cell-tower estimate (accuracy
// in the hundreds of metres) rather than a real GPS lock, which can take a
// few seconds longer to acquire. watchPosition() keeps delivering updates
// as the fix improves, so this watches for up to maxWaitMs and returns the
// most accurate reading seen, resolving early the moment one is "good
// enough" (accuracy <= desiredAccuracyM).
function getCurrentPosition({ desiredAccuracyM = 150, maxWaitMs = 5000 } = {}) {
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error("Location isn't available on this device."));
    let best = null;
    let settled = false;
    const watchId = navigator.geolocation.watchPosition(
      pos => {
        if (!best || pos.coords.accuracy < best.accuracy) best = pos.coords;
        if (pos.coords.accuracy <= desiredAccuracyM) finish();
      },
      () => { if (!best) finish(); },
      { enableHighAccuracy: true, timeout: maxWaitMs, maximumAge: 0 }
    );
    const timer = setTimeout(finish, maxWaitMs);
    function finish() {
      if (settled) return;
      settled = true;
      clearTimeout(timer);
      navigator.geolocation.clearWatch(watchId);
      if (best) resolve(best);
      else reject(new Error("Couldn't get your location — check location permission for this site."));
    }
  });
}

let geocodingLibraryPromise = null;
async function getGeocodingLibrary() {
  try { await loadGoogleMapsScript(); } catch (e) { return null; }
  if (!window.google || !window.google.maps || typeof google.maps.importLibrary !== "function") return null;
  if (!geocodingLibraryPromise) geocodingLibraryPromise = google.maps.importLibrary("geocoding");
  return geocodingLibraryPromise;
}

async function reverseGeocode(lat, lng, fullAddress) {
  const library = await getGeocodingLibrary();
  if (!library) throw new Error("Location lookup isn't ready yet — try again in a moment.");
  const { Geocoder } = library;
  const geocoder = new Geocoder();
  let response;
  try {
    response = await geocoder.geocode({ location: { lat, lng } });
  } catch (e) {
    const detail = (e && (e.message || e.status || e.code)) || (e ? JSON.stringify(e) : "unknown error");
    throw new Error(`Couldn't find an address for your location (${detail}).`);
  }
  const results = response && response.results;
  if (!results || !results.length) throw new Error("Couldn't find an address for your location.");
  if (fullAddress) return results[0].formatted_address;
  const comps = results[0].address_components;
  const get = (type) => (comps.find(c => c.types.includes(type)) || {}).long_name;
  const streetNumber = get("street_number");
  const route = get("route");
  const suburb = get("locality") || get("sublocality") || get("postal_town") || get("administrative_area_level_2");
  const street = [streetNumber, route].filter(Boolean).join(" ");
  return [street, suburb].filter(Boolean).join(", ") || results[0].formatted_address;
}

async function geocodeCandidateAddresses(a) {
  a.geocoding = true;
  for (const c of a.candidates) {
    if (c.startAddr && c.endAddr) continue;
    if (state.addDrives !== a) return; // modal closed or moved on — abandon
    try { c.startAddr = await reverseGeocode(c.startLat, c.startLng, true); }
    catch (e) { c.startAddr = `${c.startLat.toFixed(4)}, ${c.startLng.toFixed(4)}`; }
    try { c.endAddr = await reverseGeocode(c.endLat, c.endLng, true); }
    catch (e) { c.endAddr = `${c.endLat.toFixed(4)}, ${c.endLng.toFixed(4)}`; }
    if (state.addDrives === a) render();
  }
  if (state.addDrives === a) { a.geocoding = false; render(); }
}

let routesLibraryPromise = null;

async function estimateRoute(origin, destination) {
  const library = await getRoutesLibrary();
  if (!library) throw new Error("Distance lookup isn't ready yet — try again in a moment.");
  const { DistanceMatrixService } = library;
  const service = new DistanceMatrixService();
  return new Promise((resolve, reject) => {
    service.getDistanceMatrix({
      origins: [resolveSavedAddress(origin)],
      destinations: [resolveSavedAddress(destination)],
      travelMode: google.maps.TravelMode.DRIVING,
      unitSystem: google.maps.UnitSystem.METRIC,
    }, (response, status) => {
      if (status !== "OK") { reject(new Error(`Couldn't calculate that route (${status}).`)); return; }
      const element = response.rows && response.rows[0] && response.rows[0].elements && response.rows[0].elements[0];
      if (!element || element.status !== "OK") { reject(new Error(`Couldn't find a driving route (${element ? element.status : "no route data"}).`)); return; }

// Ends the active drive: grabs the current GPS fix as the end location and
// calculates the drive distance by road (via the Distance Matrix, using
// exact coordinates when GPS is available, falling back to the typed start
// address otherwise). No manual distance entry — if location can't be
// resolved, the user sees an error and can retry rather than being asked
// to type a number.
async function beginEndDrive() {
  const a = state.active;
  if (!a) return;
  state.endDriveBusy = true;
  state.endDriveError = "";
  render();

  let endLat = null, endLng = null, endAddress = "";
  try {
    const coords = await getCurrentPosition();
    endLat = coords.latitude; endLng = coords.longitude;
    endAddress = await resolveLocationLabel(endLat, endLng);
  } catch (e) {
    // GPS not active/available — handled below once we know if any distance is computable.
  }

  let distanceKm = null;
  if (endLat != null && mapsConfigured()) {
    const origin = a.startLat != null ? { lat: a.startLat, lng: a.startLng } : a.startPoint;
    try {
      const result = await estimateRoute(origin, { lat: endLat, lng: endLng });
      distanceKm = result.distanceKm;
    } catch (e) {
      // Fall through to the straight-line fallback below.
    }
  }
  if (distanceKm == null && endLat != null && a.startLat != null) {
    distanceKm = haversineKm(a.startLat, a.startLng, endLat, endLng);
  }

  state.endDriveBusy = false;

  if (endLat == null) {
    state.endDriveError = "Couldn't get your location — check location permission and try again.";
    render();
    return;
  }
  if (distanceKm == null) {
    state.endDriveError = "Couldn't calculate a driving distance for this route. Try again.";
    render();
    return;
  }

  const trip = {
    id: uid(), date: a.date, startTime: a.startTime, endTime: nowTimeStr(),
    distance: distanceKm, startPoint: a.startPoint,
    endPoint: endAddress || "Unspecified", tag: a.tag,
  };
  if (a.startLat != null) { trip.startLat = a.startLat; trip.startLng = a.startLng; }
  trip.endLat = endLat; trip.endLng = endLng;

  if (trip.tag === "supervised") {
    const dn = defaultDayNightFor(trip.date, trip.startTime, trip.startLat, trip.startLng);
    state.conditionsForm = { timeOfDay: dn, roadType: "sealed", weather: "dry", traffic: "medium", supervisorId: state.settings.lastSupervisorId || "" };
    state.addingSupervisor = false;
    state.newSupervisorName = ""; state.newSupervisorLicence = "";
  }
  state.driveSummary = { trip };
  render();
}

// --- Trip Planner: multi-stop routing, per-leg tagging, proximity auto-tag -
// Cached DirectionsResult from the last successful Preview. Kept outside
// `state` (and therefore outside localStorage) since it's a rich Google
// Maps object graph, not plain data — the map is re-created on every
// render() while the Plan tab is open (innerHTML replaces its canvas node
// each time), so this cache lets it redraw the route instantly without
// re-hitting the Directions API on every unrelated re-render.
let plannerDirectionsResult = null;

async function forwardGeocode(address) {
  const library = await getGeocodingLibrary();
  if (!library) throw new Error("Location lookup isn't ready yet — try again in a moment.");
  const { Geocoder } = library;
  const geocoder = new Geocoder();
  let response;
  try {
    response = await geocoder.geocode({ address });
  } catch (e) {
    const detail = (e && (e.message || e.status || e.code)) || (e ? JSON.stringify(e) : "unknown error");
    throw new Error(`Couldn't locate that address (${detail}).`);
  }
  const results = response && response.results;
  if (!results || !results.length) throw new Error("Couldn't locate that address.");
  const loc = results[0].geometry.location;
  return { lat: loc.lat(), lng: loc.lng(), formattedAddress: results[0].formatted_address };
}

function haversineMeters(lat1, lng1, lat2, lng2) {
  const R = 6371000, toRad = d => (d * Math.PI) / 180;
  const dLat = toRad(lat2 - lat1), dLng = toRad(lng2 - lng1);
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(toRad(lat1)) * Math.cos(toRad(lat2)) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(Math.min(1, a)));
}
// How far along a step's own path (as a 0-1 fraction of its vertices) the
// closest point to (lat, lng) falls -- used to confirm a step's "reached
// its end" proximity check (see handleLiveFix's stepEndMinDist hysteresis)
// reflects real progress driving the road, not just straight-line
// closeness. A winding road can pass geographically close to its own later
// endpoint well before actually being driven that far, which otherwise
// completes the step (and swaps the current-road pill / triggers arrival)
// too early. Returns 1 (never blocks advance) for a step with no recorded
// path, rather than a path so short two points don't meaningfully bracket
// a "closest vertex" at all.
function closestPathVertexFraction(path, lat, lng) {
  if (!path || path.length < 2) return 1;
  let bestIdx = 0, bestD = Infinity;
  for (let i = 0; i < path.length; i++) {
    const d = haversineMeters(lat, lng, path[i].lat, path[i].lng);
    if (d < bestD) { bestD = d; bestIdx = i; }
  }
  return bestIdx / (path.length - 1);
}

// Forward-geocoding a saved address (Home/Work/Other) is the same lookup
// every time, so cache it in memory keyed by the address text — an edited
// saved address just gets a fresh cache entry under its new text.
const savedAddressCoordsCache = {};
async function resolveSavedAddressCoords(address) {
  if (!address) return null;
  if (savedAddressCoordsCache[address]) return savedAddressCoordsCache[address];
  try {
    const { lat, lng } = await forwardGeocode(address);
    const coords = { lat, lng };
    savedAddressCoordsCache[address] = coords;
    return coords;
  } catch (e) {
    return null;
  }
}

// GPS drift plus reverse-geocoding both introduce enough error that "at
// home" can resolve to a neighbour's address or just a nearby street name
// instead of the exact saved address. If a GPS fix is close enough to a
// saved Home/Work/Other address, prefer that address's exact text.
async function matchSavedAddressLabel(lat, lng) {
  const radius = Number(state.settings.routeMatchRadius) || 500; // same knob as route-tag matching (Settings -> Route Match Radius)
  // Geocoded in parallel rather than one at a time — with several saved
  // addresses, waiting on each network round trip in sequence noticeably
  // slows down every location resolve.
  const list = savedAddressList();
  const coordsList = await Promise.all(list.map(entry => resolveSavedAddressCoords(entry.address)));
  for (let i = 0; i < list.length; i++) {
    const coords = coordsList[i];
    if (coords && haversineMeters(lat, lng, coords.lat, coords.lng) <= radius) return list[i].address;
  }
  return null;
}

// Best label for a GPS fix: the exact saved address if we're standing at
// one, otherwise a reverse-geocoded street address.
async function resolveLocationLabel(lat, lng) {
  const saved = await matchSavedAddressLabel(lat, lng).catch(() => null);
  if (saved) return saved;
  try { return await reverseGeocode(lat, lng); } catch (e) { return ""; }
}

// Suggests a Personal/Business tag for a start->end pair from geographic
// proximity alone (within routeMatchRadius metres of both endpoints),
// rather than an exact address match — a search result, a dropped pin, and
// a "use my location" fix for the same real-world spot are all slightly
// different strings/coordinates.
function suggestTagForCoords(startLat, startLng, endLat, endLng) {
  if (!state.settings.learnRoutes) return null;
  if (startLat == null || endLat == null) return null;
  const radius = Number(state.settings.routeMatchRadius) || 300;
  const candidates = [];
  state.trips.forEach(t => {
    if (t.startLat == null || t.endLat == null || !t.tag) return;
    candidates.push({ startLat: t.startLat, startLng: t.startLng, endLat: t.endLat, endLng: t.endLng, tag: t.tag });
  });
  state.plannedRoutes.forEach(r => {
    r.legs.forEach(leg => {
      const from = r.stops[leg.fromIdx], to = r.stops[leg.toIdx];
      if (!from || !to || from.lat == null || to.lat == null || !leg.tag) return;
      candidates.push({ startLat: from.lat, startLng: from.lng, endLat: to.lat, endLng: to.lng, tag: leg.tag });
    });
  });
  const matches = candidates.filter(c =>
    haversineMeters(startLat, startLng, c.startLat, c.startLng) <= radius &&
    haversineMeters(endLat, endLng, c.endLat, c.endLng) <= radius
  );
  if (!matches.length) return null;
  const counts = {};
  matches.forEach(m => { counts[m.tag] = (counts[m.tag] || 0) + 1; });
  return Object.entries(counts).sort((a, b) => b[1] - a[1])[0][0];
}
