function plannerRemoveStop(idx) {
  const p = state.planner;
  if (idx === 0 || idx === p.stops.length - 1 || p.stops.length <= 2) return;
  p.stops.splice(idx, 1);
  p.legs.splice(idx - 1, 1);
  p.legs.forEach(l => { l.distanceKm = null; l.durationMin = null; l.quickDistanceKm = null; l.quickDurationMin = null; l._quickKey = null; });
  p.stage = "build";
  plannerDirectionsResult = null;
  render();
  updatePlannerQuickEstimate();
  if (p.stops.every(s => s.lat != null)) runPlannerPreview();
}

// Called after a stop's address is set (autocomplete pick, map click, or a
// manually typed address on blur). `coords` is passed when already known
// (autocomplete place / map click); otherwise it's resolved by geocoding.
async function plannerResolveStop(stop, address, coords, fromCurrentLocation) {
  stop.address = address;
  stop.resolveError = "";
  stop.fromCurrentLocation = !!fromCurrentLocation;
  if (coords) {
    stop.lat = coords.lat; stop.lng = coords.lng;
  } else {
    stop.lat = null; stop.lng = null;
    if (!address.trim()) { render(); return; }
    stop.resolving = true;
    render();
    try {
      const geo = await forwardGeocode(address);
      if (!state.planner || !state.planner.stops.includes(stop) || stop.address !== address) return;
      stop.lat = geo.lat; stop.lng = geo.lng;
    } catch (e) {
      if (!state.planner || !state.planner.stops.includes(stop)) return;
      stop.resolveError = e.message || "Couldn't locate that address.";
    }
    stop.resolving = false;
  }
  stop.roadSuburb = null;
  if (stop.lat != null) resolvePlannerStopRoadSuburb(stop);
  autoSuggestPlannerTags();
  render();
  updatePlannerQuickEstimate();
  // Every stop (including this one) now has coordinates — draw the actual
  // route on the map immediately, live, without a manual "Preview" tap.
  if (state.planner && state.planner.stops.every(s => s.lat != null)) {
    runPlannerPreview();
  }
}

// Best-effort road/suburb label for a resolved stop (e.g. "Glen Stuart
// Road, Windsor Gardens") shown in the route summary instead of the raw
// field text, which is often a venue name or a full formatted address.
// Fire-and-forget: the summary falls back to the full address until this
// resolves, and just keeps that fallback if it fails.
async function resolvePlannerStopRoadSuburb(stop) {
  try {
    const short = await reverseGeocode(stop.lat, stop.lng, false);
    if (state.planner && state.planner.stops.includes(stop) && stop.lat != null) {
      stop.roadSuburb = short;
      render();
    }
  } catch { /* keep falling back to the full address */ }
}

// A saved address's coordinates rarely change, so cache them for the
// session instead of re-geocoding on every planner open.
const savedAddressGeocodeCache = {};
async function geocodeSavedAddressCached(address) {
  if (savedAddressGeocodeCache[address]) return savedAddressGeocodeCache[address];
  const geo = await forwardGeocode(address);
  const coords = { lat: geo.lat, lng: geo.lng };
  savedAddressGeocodeCache[address] = coords;
  return coords;
}

// Saved-address (Home/Work/Other) proximity match within Settings > Route
// Match Radius of the given coordinates — shared by the planner's start-field
// auto-fill and end-of-drive snapping. Returns the winning entry's own
// address text plus its geocoded coords, or null if nothing's close enough.
async function matchSavedAddressNear(lat, lng) {
  const radius = Number(state.settings.routeMatchRadius) || 500;
  for (const a of savedAddressList()) {
    try {
      const geo = await geocodeSavedAddressCached(a.address);
      if (haversineMeters(lat, lng, geo.lat, geo.lng) <= radius) return { address: a.address, lat: geo.lat, lng: geo.lng };
    } catch { /* that saved address couldn't be located — skip it */ }
  }
  return null;
}

// Auto-fills a fresh route's start field so most drives need zero typing:
// a saved address within the Route Match Radius of the device's current
// position wins — otherwise the current position itself is used and
// flagged so the map can highlight it as a guess rather than a confirmed
// place. Silent on failure; the user can still search or tap a chip manually.
async function autoFillPlannerStart() {
  const p = state.planner;
  if (!p || p.stops[0].address.trim() || !mapsConfigured()) return;
  const stop = p.stops[0];
  const stillRelevant = () => state.planner && state.planner.stops[0] === stop && !stop.address.trim();
  try {
    const coords = await getCurrentPosition();
    if (!stillRelevant()) return;
    const matched = await matchSavedAddressNear(coords.latitude, coords.longitude);
    if (!stillRelevant()) return;
    if (matched) {
      await plannerResolveStop(stop, matched.address, { lat: matched.lat, lng: matched.lng }, false);
    } else {
      const address = await reverseGeocode(coords.latitude, coords.longitude);
      if (!stillRelevant()) return;
      await plannerResolveStop(stop, address, { lat: coords.latitude, lng: coords.longitude }, true);
    }
  } catch (e) {
    // Silent fail — user can still type manually or tap a chip.
  }
}

// Lightweight per-leg estimate shown between each pair of address boxes
// while building a route, so a leg's distance/time appears as soon as both
// its ends are picked instead of waiting for the full multi-stop Preview
// (which needs every stop resolved at once). Each leg estimates
// independently — adding a 3rd stop doesn't wait on the first leg's own
// estimate to arrive.
async function updatePlannerLegQuickEstimate(legIdx) {
  const p = state.planner;
  const leg = p && p.legs[legIdx];
  const from = p && p.stops[legIdx], to = p && p.stops[legIdx + 1];
  if (!leg || !from || !to) return;
  const fromAddr = from.address.trim(), toAddr = to.address.trim();
  if (!fromAddr || !toAddr || from.lat == null || to.lat == null || !mapsConfigured()) {
    if (leg.quickDistanceKm != null || leg.quickDurationMin != null || leg._quickKey != null) {
      leg.quickDistanceKm = null; leg.quickDurationMin = null; leg._quickKey = null; render();
    }
    return;
  }
  const key = `${fromAddr}|${toAddr}`;
  if (leg._quickKey === key) return;
  leg._quickKey = key;
  leg.quickEstimating = true;
  render();
  try {
    const { distanceKm, durationMin } = await estimateRoute(fromAddr, toAddr);
    if (!state.planner || state.planner.legs[legIdx] !== leg || leg._quickKey !== key) return;
    leg.quickDistanceKm = distanceKm;
    leg.quickDurationMin = durationMin;
  } catch (e) {
    if (!state.planner || state.planner.legs[legIdx] !== leg || leg._quickKey !== key) return;
    leg.quickDistanceKm = null;
    leg.quickDurationMin = null;
  }
  leg.quickEstimating = false;
  render();
}
// Fires every leg's quick estimate in parallel (each is independently
// cheap/no-op once cached by key) — kept as the name every call site
// already uses rather than renaming them all to the per-leg version.
function updatePlannerQuickEstimate() {
  const p = state.planner;
  if (!p) return;
  p.legs.forEach((_, i) => updatePlannerLegQuickEstimate(i));
}

// Upgrades any leg still on its plain Personal/Supervised default — never
// one a route match or the user has already set — to a learned tag, per the
// proximity match. Runs as soon as those coordinates are known (stop
// resolved) and again after Preview fills in the rest.
function autoSuggestPlannerTags() {
  const p = state.planner;
  if (!p) return;
  p.legs.forEach((leg, i) => {
    if (leg.tagSource !== "default") return;
    const a = p.stops[i], b = p.stops[i + 1];
    if (!a || !b || a.lat == null || b.lat == null) return;
    const suggestion = suggestTagForCoords(a.lat, a.lng, b.lat, b.lng);
    if (suggestion) { leg.tag = suggestion; leg.tagSource = "auto"; }
  });
}

// Quick Personal/Business toggle shown inline between addresses while
// building the route, and again in the Drive Complete summary — both
// read/write the same leg.tag so they always stay in sync. Supervised legs
// don't get this toggle at all (renderPlannerLegBusinessBtn hides it), so
// this only ever needs to flip between the other two.
function plannerToggleLegBusiness(idx) {
  const leg = state.planner.legs[idx];
  if (!leg || leg.tag === "supervised") return;
  leg.tag = leg.tag === "work" ? "normal" : "work";
  leg.tagSource = "manual";
  render();
}

async function runPlannerPreview() {
  const p = state.planner;
  if (!mapsConfigured()) { p.previewError = "Maps isn't set up for this app yet."; render(); return; }
  if (p.stops.some(s => !s.address.trim())) { p.previewError = "Set every stop's location first."; render(); return; }
  p.previewing = true; p.previewError = ""; render();
  try {
    const library = await getRoutesLibrary();
    if (!library) throw new Error("Directions service isn't ready yet — try again in a moment.");
    const { DirectionsService } = library;
    const service = new DirectionsService();
    const locFor = (s) => s.lat != null ? { lat: s.lat, lng: s.lng } : resolveSavedAddress(s.address);
    const origin = locFor(p.stops[0]);
    const destination = locFor(p.stops[p.stops.length - 1]);
    const waypoints = p.stops.slice(1, -1).map(s => ({ location: locFor(s), stopover: true }));
    const result = await new Promise((resolve, reject) => {
      service.route({
        origin, destination, waypoints,
        travelMode: google.maps.TravelMode.DRIVING,
      }, (res, status) => {
        if (status !== "OK") { reject(new Error(`Couldn't calculate that route (${status}).`)); return; }
        resolve(res);
      });
    });
    plannerDirectionsResult = result;
    const route = result.routes[0];
    route.legs.forEach((leg, i) => {
      p.legs[i].distanceKm = leg.distance.value / 1000;
      p.legs[i].durationMin = Math.max(1, Math.round(leg.duration.value / 60));
    });
    p.stage = "preview";
    autoSuggestPlannerTags();
  } catch (e) {
    p.previewError = e.message || "Couldn't calculate that route.";
  }
  p.previewing = false;
  render();
}

function plannerDefaultRouteName(p) {
  const start = p.stops[0].address.trim() || "Start";
  const end = p.stops[p.stops.length - 1].address.trim() || "Destination";
  return `${start} → ${end}`;
}

// Small star next to the route summary badge: prompts for a name, then
// saves the current route to the saved list — doesn't exit the builder.
// Also reachable from Drive Complete (favouriting a route you've now
// actually driven, not just planned, is just as useful for reuse later).
function openPlannerSaveRoutePrompt() {
  const p = state.planner;
  if (!p || (p.stage !== "preview" && p.stage !== "complete")) return;
  state.plannerSaveRouteForm = { name: plannerDefaultRouteName(p) };
  render();
}
async function savePlannerRoute(name) {
  const p = state.planner;
  if (!p || (p.stage !== "preview" && p.stage !== "complete")) return;
  const route = {
    id: uid(), createdAt: Date.now(), name: (name || "").trim() || null,
    stops: p.stops.map(s => ({ address: s.address, lat: s.lat, lng: s.lng })),
    legs: p.legs.map((l, i) => ({ fromIdx: i, toIdx: i + 1, distanceKm: l.distanceKm, durationMin: l.durationMin, tag: l.tag })),
  };
  state.plannedRoutes = [route, ...state.plannedRoutes];
  p.savedRouteId = route.id;
  state.plannerSaveRouteForm = null;
  await storageSet(PLANNED_ROUTES_KEY, state.plannedRoutes);
  render();
}
// Tapping the already-solid star removes it again — no naming prompt needed.
async function unsavePlannerRoute() {
  const p = state.planner;
  if (!p || !p.savedRouteId) return;
  state.plannedRoutes = state.plannedRoutes.filter(r => r.id !== p.savedRouteId);
  p.savedRouteId = null;
  await storageSet(PLANNED_ROUTES_KEY, state.plannedRoutes);
  render();
}

// The small star at the far right of each planner search box: prompts for
// a name, then adds that stop's resolved address to Settings > Saved
// Addresses ("Other") so it shows up as a chip next time.
function openPlannerSaveAddressPrompt(idx) {
  const p = state.planner;
  const stop = p && p.stops[idx];
  if (!stop || stop.lat == null) return;
  state.plannerSaveAddressForm = { stopIdx: idx, name: "" };
  render();
}
async function savePlannerStopAsAddress(idx, name) {
  const p = state.planner;
  const stop = p && p.stops[idx];
  const address = stop && stop.address.trim();
  if (!address) return;
  state.savedAddresses.other.push({ id: uid(), name: (name || "").trim() || address, address });
  await storageSet(SAVED_ADDRESSES_KEY, state.savedAddresses);
  state.plannerSaveAddressForm = null;
  render();
}

async function deletePlannedRoute(id) {
  state.plannedRoutes = state.plannedRoutes.filter(r => r.id !== id);
  await storageSet(PLANNED_ROUTES_KEY, state.plannedRoutes);
  render();
}

// Reopens a saved route so it can be edited or driven again — always
// re-runs the live preview so the map's route line is fresh rather than
// trusting the saved leg distances, which is why it's already starred.
function openSavedRouteInPlanner(route) {
  state.planner = {
    stops: route.stops.map(s => ({ id: uid(), address: s.address, lat: s.lat, lng: s.lng, resolving: false, resolveError: "", fromCurrentLocation: false, roadSuburb: null })),
    legs: route.legs.map(l => ({
      tag: l.tag, tagSource: l.tag ? "manual" : null, distanceKm: l.distanceKm, durationMin: l.durationMin,
      quickDistanceKm: null, quickDurationMin: null, quickEstimating: false, _quickKey: null,
    })),
    stage: "build",
    previewing: false,
    previewError: "",
    savedRouteId: route.id,
    showSavedList: false,
    mapFocusMode: false,
  };
  plannerDirectionsResult = null;
  state.planner.stops.filter(s => s.lat != null).forEach(resolvePlannerStopRoadSuburb);
  render();
  updatePlannerQuickEstimate();
  if (state.planner.stops.every(s => s.lat != null)) runPlannerPreview();
}

function minutesToTimeStr(totalMinutes) {
  const m = ((Math.round(totalMinutes) % 1440) + 1440) % 1440;
  return `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
}

// Opens the pre-trip "Log Drive" window (renderPlannerLogModal), seeded
// from the current preview's own estimate -- shared by the preview
// screen's own Log Drive button and the Saved Routes list's, which loads
// a route into the planner and previews it first (see its own caller)
// since this reads state.planner.legs, populated only after Preview runs.
function openPlannerLogForm() {
  const p = state.planner;
  if (!p) return;
  const startTime = nowTimeStr();
  const totalMin = p.legs.reduce((s, l) => s + (l.durationMin || 0), 0);
  const startMinutes = parseInt(startTime.slice(0, 2), 10) * 60 + parseInt(startTime.slice(3, 5), 10);
  const endTime = minutesToTimeStr(startMinutes + totalMin);
  state.plannerLogForm = { date: todayStr(), startTime, endTime };
  if (p.legs.some(l => l.tag === "supervised")) {
    const dn = defaultDayNightFor(state.plannerLogForm.date, startTime);
    state.conditionsForm = { timeOfDay: dn, roadType: "sealed", weather: "dry", traffic: "medium", supervisorId: state.settings.lastSupervisorId || "" };
    state.addingSupervisor = false;
    state.newSupervisorName = ""; state.newSupervisorLicence = "";
  }
  render();
}
// Manual "Log Drive" path: commits every leg as a logged trip, back-to-back
// from a chosen date/start time, using each leg's estimated Directions
// duration as its drive time — for logging a drive that already happened
// (or that you don't want live-tracked) rather than live GPS tracking.
// Driven by the single redesigned "Log this Drive" window (renderPlannerLogModal)
// -- same shape as Log Estimate/Drive Summary: conditions (if any leg is
// Supervised) are already sitting on state.conditionsForm by the time this
// runs, filled in inline rather than via a separate step afterward. endTimeStr
// (possibly hand-edited away from the Directions estimate) sets the *total*
// drive duration; each leg's own start/end is a proportional share of that
// total by its estimated duration, so editing the overall time doesn't throw
// off the relative length of a multi-leg trip.
async function logPlannedRouteNow(date, startTimeStr, endTimeStr) {
  const p = state.planner;
  if (!p.legs.every(l => l.tag)) { p.previewError = "Tag every leg before starting."; render(); return; }
  const toMinutes = (t) => parseInt(t.slice(0, 2), 10) * 60 + parseInt(t.slice(3, 5), 10);
  const startMinutes = startTimeStr != null ? toMinutes(startTimeStr) : (() => { const now = new Date(); return now.getHours() * 60 + now.getMinutes(); })();
  const estTotalMin = p.legs.reduce((s, l) => s + (l.durationMin || 1), 0) || 1;
  let totalMin = estTotalMin;
  if (endTimeStr != null) {
    let endMinutes = toMinutes(endTimeStr);
    if (endMinutes < startMinutes) endMinutes += 24 * 60; // ran past midnight
    totalMin = Math.max(1, endMinutes - startMinutes);
  }
  let cursor = startMinutes;
  const trips = [];
  for (let i = 0; i < p.legs.length; i++) {
    const leg = p.legs[i], from = p.stops[i], to = p.stops[i + 1];
    const isLast = i === p.legs.length - 1;
    const tripStartTime = minutesToTimeStr(cursor % 1440);
    // The last leg always lands exactly on the entered end time -- earlier
    // legs get a proportional share, which can drift a minute from rounding.
    cursor = isLast ? (startMinutes + totalMin) : cursor + Math.max(1, Math.round(((leg.durationMin || 1) / estTotalMin) * totalMin));
    const endTime = minutesToTimeStr(cursor % 1440);
    const trip = {
      id: uid(), date: date || todayStr(), startTime: tripStartTime, endTime,
      distance: leg.distanceKm || 0,
      startPoint: from.address.trim() || "Unspecified",
      endPoint: to.address.trim() || "Unspecified",
      tag: leg.tag,
    };
    if (from.lat != null) { trip.startLat = from.lat; trip.startLng = from.lng; }
    if (to.lat != null) { trip.endLat = to.lat; trip.endLng = to.lng; }
    trips.push(trip);
  }
  if (trips.some(t => t.tag === "supervised")) {
    const cf = state.conditionsForm;
    const sup = state.supervisors.find(s => s.id === cf.supervisorId);
    if (sup) {
      state.settings.lastSupervisorId = sup.id;
      await storageSet(SETTINGS_KEY, state.settings);
    }
    const conditions = {
      timeOfDay: cf.timeOfDay, roadType: cf.roadType, weather: cf.weather, traffic: cf.traffic,
      supervisorName: sup ? sup.name : "", supervisorLicence: sup ? sup.licence : "",
    };
    trips.forEach(t => { if (t.tag === "supervised") Object.assign(t, conditions); });
  }
  for (const trip of trips) await finalizeTrip(trip);
  state.planner = null;
  plannerDirectionsResult = null;
  state.tab = "history";
  render();
}

// --- Trip Planner: real GPS live-tracking driving mode -----------------------
// "Start Drive" tracks the device's actual position
// with watchPosition rather than assuming the Directions estimate — distance
// and duration logged at the end are what was really driven, split across
// legs by proximity to each planned stop, with turn-by-turn advanced by
// proximity to each Directions step's end point.
const LIVE_STEP_ADVANCE_M = 35;      // close enough to a step's end to call it done
// A fix must move this much further away from the closest approach to a
// step's end before the step counts as passed (see handleLiveFix). Proximity
// alone fires while still approaching the turn, jumping the banner ahead to
// announce the *following* turn before the driver had actually made this one.
const LIVE_STEP_PASSED_HYSTERESIS_M = 8;
// Extra distance driven on a newly-advanced step (or a reroute) before the
// current-road pill (see liveDrive.pillRoadName) actually switches to its
// name -- a small deliberate lag so a step-advance right at the edge of its
// own hysteresis doesn't read as the pill flickering.
const LIVE_PILL_HOLD_M = 20;
const LIVE_LEG_ARRIVE_M = 45;        // close enough to a stop to call that leg finished
const LIVE_MAX_FIX_ACCURACY_M = 60;  // ignore fixes noisier than this
const LIVE_MAX_JUMP_M = 600;         // ignore a single fix-to-fix jump this large (GPS glitch, not highway driving with sparse fixes)
const LIVE_BREADCRUMB_MIN_GAP_M = 15; // minimum spacing between recorded path points -- keeps the eventual polyline compact without visibly changing its shape
const LIVE_OFFROUTE_M = 50;          // further than this from the route's own path counts as "off route"
const LIVE_OFFROUTE_CONFIRM_FIXES = 3; // consecutive off-route fixes required before rerouting, so one noisy fix doesn't trigger it
const LIVE_REROUTE_COOLDOWN_MS = 15000; // minimum gap between reroute calls
const LIVE_MIN_ROTATE_SPEED_MS = 1.4; // ~5 km/h — below this GPS course is noisy or absent, so the map holds its last heading instead of spinning on the noise
const LIVE_HEADING_SMOOTHING = 0.35; // low-pass factor for the heading used to rotate the map
const LIVE_POSITION_SMOOTHING = 0.35; // low-pass factor for the position used for the marker/camera (raw fixes still drive distance/arrival math)
// Where the camera re-centers so the driver's real (route-snapped)
// position projects to on screen -- read directly off .planner-position-
// arrow's own actual rendered position (a real, fixed CSS element; see its
// own comment) rather than an independently-guessed physical distance from
// the bottom edge. Two separately-chosen fixed points can drift apart from
// each other in a way a single shared source of truth can't -- that
// mismatch is what let the visible arrow and the route line it's supposed
// to sit on disagree, however precisely either one was individually tuned.
// Falls back to a fixed 2cm-from-bottom guess only if the element isn't in
// the DOM yet (the very first frame, before any render has run).
function liveMarkerScreenFraction(heightPx) {
  const h = heightPx || 700;
  const arrow = document.getElementById("plannerPositionArrow");
  if (arrow) {
    const rect = arrow.getBoundingClientRect();
    if (rect.width > 0 || rect.height > 0) {
      return Math.min(0.95, Math.max(0.55, (rect.top + rect.height / 2) / h));
    }
  }
  const bottomPx = (2 * 96) / 2.54; // 2cm, via CSS's 96px/inch reference (2.54cm = 1in)
  return Math.min(0.95, Math.max(0.55, 1 - bottomPx / h));
}
const LIVE_DRIVING_ZOOM = 18;        // street-level zoom while driving, and the fixed zoom used when the angled view is off
const LIVE_SPEED_SMOOTHING = 0.25;   // low-pass factor for the speed that drives the dynamic tilt/zoom
// Angle (tilt) and zoom are independent axes — each has its own FAB, cycle,
// and "auto" that follows speed. "rotates" controls whether the map turns
// to course-up at all: overhead stays north-up, so its labels are
// guaranteed never upside-down regardless of heading. Road labels always
// stay on regardless of tier (only genuinely unreadable — rotated too far
// from upright — ever turns them off, see updateLiveMapLabelVisibility); an
// earlier "main" tier that hid minor/local road names at the steepest tilt
// made road names disappear exactly when a driver most wanted to check
// which street they were on. Tilt/zoom values are a best-effort match to
// Google's own normal driving nav view — a ~45° tilt and closer zoom at
// city speed, easing toward a steeper look-ahead tilt and further-out zoom
// at highway speed — since there's no API access to compare directly
// against the real app.
// low/medium/high are what auto's three speed tiers resolve to (see
// LIVE_ANGLE_TIER_MODE below) — overhead is a manual-only extra step, auto
// never picks it (Google's own nav view never goes flat just from slowing
// down, see LIVE_ANGLE_TIER_MODE's own comment). A prior "high" at 60°
// existed here too but was pulled entirely over an unresolved rendering
// complaint after always-on road labels (see updateLiveMapLabelVisibility)
// didn't fix it -- reintroduced at a shallower 52° as a middle ground worth
// re-testing, between that old 60° and medium's 45°.
const LIVE_ANGLE_PROFILES = {
  overhead: { tilt: 0, rotates: false },
  low: { tilt: 22, rotates: true },
  medium: { tilt: 45, rotates: true },
  high: { tilt: 52, rotates: true },
};
// The sky mask's height at the steepest tilt tier (high) -- see
// .planner-sky-mask's own CSS comment. Scaled down proportionally for
// shallower tilts by skyMaskVh below rather than shown at this same size
// regardless of actual tilt.
const LIVE_SKY_MASK_MAX_VH = 24;
function skyMaskVh(tiltDeg) {
  return (Math.max(0, tiltDeg) / LIVE_ANGLE_PROFILES.high.tilt) * LIVE_SKY_MASK_MAX_VH;
}
// far/normal/close are what auto's three speed tiers resolve to (see
// LIVE_ZOOM_TIER_MODE below) — wide/tight are extra manual-only steps
// beyond that range. "far" itself is kept from going too far out — Google
// is more likely to draw a highway's full name alongside its shield, not
// just the shield on its own, the more room a label has, which shrinks
// fast at wide zoom-outs.
const LIVE_ZOOM_PROFILES = { wide: 15, far: 16.5, normal: 17, close: 18, tight: 19.5 };
// Speed tiers shared by both axes' "auto" — when both are left on auto

    plannerSnapshot: { stops: state.planner.stops, legs: state.planner.legs },

}

function finishCurrentLiveLeg() {
  const durationSec = (Date.now() - liveDrive.legStartedAt) / 1000;
  liveDrive.completedLegs.push({
    distanceKm: liveDrive.legDistanceM / 1000,
    durationMin: Math.max(1, Math.round(durationSec / 60)),
    partial: false,
  });
  liveDrive.legIdx++;
  liveDrive.legStartedAt = Date.now();
  liveDrive.legDistanceM = 0;
  liveDrive.legArriveMinDist = null; // fresh start for the next leg's own destination
  persistLiveDriveSnapshot();
}

// The Next button — a manual override for arrival detection that's proximity-
// and steps-based (handleLiveFix's nearDest/legStepsExhausted) and so can't
// always tell "stopped to drop someone off" from "just passing near this
// stop on the way to the next one". Reuses the exact same finish-a-leg path
// automatic arrival uses, so a manually- or automatically-completed leg ends
// up identical either way.
function advanceToNextLegManually() {
  if (!liveDrive || !state.planner) return;
  finishCurrentLiveLeg();
  // stepIdx otherwise still points into the leg just skipped -- left alone,
  // handleLiveFix's "ran out of this leg's steps" check would immediately
  // see stepIdx.legIdx !== the new (incremented) legIdx and treat the leg
  // that was JUST started as already finished too, cascading forward.
  while (liveDrive.steps[liveDrive.stepIdx] && liveDrive.steps[liveDrive.stepIdx].legIdx < liveDrive.legIdx) {
    liveDrive.stepIdx++;
  }
  liveDrive.stepEndMinDist = null;
  // Unlike the automatic advance in handleLiveFix, a manual Next tap is
  // already an explicit, deliberate "I'm done with this leg" -- the
  // current-road pill should reflect that immediately, not sit through
  // its usual debounce (see LIVE_PILL_HOLD_M) as if this were a borderline
  // GPS-triggered advance.
  const nextStep = liveDrive.steps[liveDrive.stepIdx];
  liveDrive.pillRoadName = nextStep ? stepStreetName(nextStep.instructions) : "";
  liveDrive.pillPendingRoadName = null;
  liveDrive.pillHoldAnchor = null;
  if (liveDrive.legIdx >= state.planner.legs.length) { endLiveDrive(); return; }
  render();
}

function handleLiveFix(pos) {
  if (!liveDrive) return;
  const { latitude: lat, longitude: lng, accuracy, heading, speed } = pos.coords;
  if (accuracy != null && accuracy > LIVE_MAX_FIX_ACCURACY_M) return;
  const prev = liveDrive.lastFix;
  const deltaM = prev ? haversineMeters(prev.lat, prev.lng, lat, lng) : 0;
  const dtS = prev ? Math.max(0.001, (Date.now() - prev.t) / 1000) : 0;
  const estSpeedMs = speed != null ? speed : (prev ? deltaM / dtS : 0);
  liveDrive.lastFix = { lat, lng, heading, t: Date.now() };

  // Smoothed position/heading drive the visual marker and camera only — the
  // raw fix above still drives distance, step-advance, off-route and
  // arrival math below, so smoothing can never skew the logged trip data.
  if (!liveDrive.smoothFix) liveDrive.smoothFix = { lat, lng };
  else {
    liveDrive.smoothFix.lat += (lat - liveDrive.smoothFix.lat) * LIVE_POSITION_SMOOTHING;
    liveDrive.smoothFix.lng += (lng - liveDrive.smoothFix.lng) * LIVE_POSITION_SMOOTHING;
  }
  // GPS course is noisy or simply absent below walking speed — hold the
  // last stable heading rather than snapping/spinning the map on that noise
  // (the usual cause of the map appearing to spin while stopped or crawling).
  if (heading != null && estSpeedMs > LIVE_MIN_ROTATE_SPEED_MS) {
    liveDrive.smoothHeading = liveDrive.smoothHeading == null ? heading : smoothHeadingDeg(liveDrive.smoothHeading, heading, LIVE_HEADING_SMOOTHING);
  }
  liveDrive.smoothSpeedMs = liveDrive.smoothSpeedMs == null ? estSpeedMs : liveDrive.smoothSpeedMs + (estSpeedMs - liveDrive.smoothSpeedMs) * LIVE_SPEED_SMOOTHING;
  const displayPos = snapToRouteForDisplay(liveDrive.smoothFix.lat, liveDrive.smoothFix.lng);
  updateLiveMarker(displayPos.lat, displayPos.lng, liveDrive.smoothHeading, liveDrive.smoothSpeedMs);

  // Paused: keep the marker/position current so resuming isn't stale, but
  // don't count this fix toward distance, steps, or arrival.
  if (liveDrive.paused) { updateLiveDriveDOM(); return; }

  if (!(prev && deltaM > LIVE_MAX_JUMP_M) && prev) liveDrive.legDistanceM += deltaM;

  // Recorded path for this leg — the actual driven route (see
  // endLiveDrive/attachTripDetailedImage), not just its start/end, once a
  // detailed route image is generated. Same jump guard as distance above (a
  // GPS glitch shouldn't warp the drawn line), throttled to a minimum
  // spacing so a long drive doesn't accumulate thousands of near-duplicate
  // points for a shape that barely changed.
  if (!(prev && deltaM > LIVE_MAX_JUMP_M)) {
    const crumbs = liveDrive.breadcrumbs;
    const last = crumbs.length ? crumbs[crumbs.length - 1] : null;
    if (!last || last.legIdx !== liveDrive.legIdx || haversineMeters(last.lat, last.lng, lat, lng) >= LIVE_BREADCRUMB_MIN_GAP_M) {
      crumbs.push({ lat, lng, legIdx: liveDrive.legIdx });
    }
  }

  // Steps are deliberately left empty by a resume (see resumeLiveDriveIfAny),
  // to be repopulated once a reroute has a fresh route to work from --
  // checkLiveRouteDeviation can't be what eventually calls that reroute,
  // since it also bails out early with no steps of its own to compare the
  // fix against (see its own comment). Without this, a resumed drive had no
  // path back to real turn-by-turn at all -- steps stayed empty forever,
  // which (before updateLiveDriveDOM's own stepsLoaded guard) showed as a
  // permanent, un-advancing "You have arrived".
  if (!liveDrive.steps.length && !liveDrive.rerouting) rerouteLiveDrive(lat, lng);

  // A step only counts as done once the fix has both gotten close to its end
  // AND started moving away again — tracking just the minimum distance seen
  // (rather than a one-shot proximity check) means the step doesn't advance
  // while still approaching the turn, only once it's actually been made.
  const stepIdxBeforeAdvance = liveDrive.stepIdx;
  let step = liveDrive.steps[liveDrive.stepIdx];
  while (step && step.legIdx === liveDrive.legIdx) {
    const d = haversineMeters(lat, lng, step.endLat, step.endLng);
    if (liveDrive.stepEndMinDist == null || d < liveDrive.stepEndMinDist) liveDrive.stepEndMinDist = d;
    const nearEnd = liveDrive.stepEndMinDist < LIVE_STEP_ADVANCE_M && d > liveDrive.stepEndMinDist + LIVE_STEP_PASSED_HYSTERESIS_M;
    // A road that curves back close to its own upcoming endpoint can
    // satisfy the straight-line check above well before actually being
    // driven that far -- requiring the fix's nearest point on the step's
    // own path to be past its midpoint confirms real progress along the
    // road, not just geographic proximity (see closestPathVertexFraction).
    // Only trusted when the path actually has enough points to say that
    // meaningfully -- a short final step (a common shape for the last leg
    // into a destination) can decode to just 2-3 points, where one GPS
    // jitter flips which end reads "closest" regardless of real progress
    // and would otherwise block genuine arrival outright, leaving the trip
    // stuck. Sparse paths fall back to the plain endpoint check instead.
    const richPath = step.path && step.path.length >= 6;
    const passed = nearEnd && (!richPath || closestPathVertexFraction(step.path, lat, lng) > 0.5);
    if (!passed) break;
    liveDrive.stepIdx++;
    liveDrive.stepEndMinDist = null;
    step = liveDrive.steps[liveDrive.stepIdx];
  }

  // Current-road pill debounce (see LIVE_PILL_HOLD_M) -- a fresh advance
  // restarts the hold, tracked as an anchor point (where the fix was at the
  // moment of advance) rather than a running countdown of raw per-fix
  // distances. Indoor/noisy GPS jitter bounces a stationary phone's
  // reported position back and forth within a small radius -- summing
  // those raw deltas could rack up "distance traveled" from pure noise
  // alone even while parked, committing the pending (often still-upcoming)
  // road name before any real progress happened. Measuring straight-line
  // distance from a fixed anchor instead self-corrects: jitter bouncing
  // around one spot stays bounded near zero rather than accumulating.
  // pillRoadName holds a committed *name string*, not a step index, so it
  // survives rerouteLiveDrive wholesale-replacing liveDrive.steps mid-hold
  // (see that function's own comment on why that distinction matters).
  if (liveDrive.stepIdx !== stepIdxBeforeAdvance) {
    liveDrive.pillPendingRoadName = step ? stepStreetName(step.instructions) : "";
    liveDrive.pillHoldAnchor = { lat, lng };
  } else if (liveDrive.pillHoldAnchor && !(prev && deltaM > LIVE_MAX_JUMP_M)) {
    const traveled = haversineMeters(liveDrive.pillHoldAnchor.lat, liveDrive.pillHoldAnchor.lng, lat, lng);
    if (traveled >= LIVE_PILL_HOLD_M) liveDrive.pillHoldAnchor = null;
  }
  if (!liveDrive.pillHoldAnchor && liveDrive.pillPendingRoadName != null) {
    liveDrive.pillRoadName = liveDrive.pillPendingRoadName;
    liveDrive.pillPendingRoadName = null;
  }

  const p = state.planner;
  if (p && liveDrive.legIdx < p.legs.length) {
    const destStop = p.stops[liveDrive.legIdx + 1];
    // Same "closest approach, then moving away again" hysteresis already
    // used for step completion just above (stepEndMinDist) — a single fix
    // landing inside LIVE_LEG_ARRIVE_M isn't enough on its own, since GPS
    // noise or a road that just happens to pass close to the stop (without
    // actually stopping there) can land one fix that close in passing. This
    // is also most of what makes automatic multi-stop advance reliable at
    // all, alongside the manual Next button for whatever it still misses
    // (e.g. dropping someone off just off the geocoded pin's exact spot).
    let nearDest = false;
    if (destStop && destStop.lat != null) {
      const d = haversineMeters(lat, lng, destStop.lat, destStop.lng);
      if (liveDrive.legArriveMinDist == null || d < liveDrive.legArriveMinDist) liveDrive.legArriveMinDist = d;
      nearDest = liveDrive.legArriveMinDist < LIVE_LEG_ARRIVE_M && d > liveDrive.legArriveMinDist + LIVE_STEP_PASSED_HYSTERESIS_M;
    }
    // Also treat running out of this leg's own turn-by-turn steps as
    // arrival, not just being within LIVE_LEG_ARRIVE_M of the geocoded
    // stop pin — the two can diverge (a route's last step can end at a
    // slightly different point than the address's own coordinates), which
    // left the app showing "You have arrived" (driven by this same signal
    // in updateLiveDriveDOM) while never actually finishing the leg.
    // Gated on steps actually being loaded: resumeLiveDriveIfAny() restores
    // a drive after a reload with steps deliberately left empty (turn-by-
    // turn goes quiet until a reroute repopulates it), and !step there
    // would otherwise look identical to "ran out of steps" on the very
    // first fix back — ending the leg immediately regardless of where the
    // driver actually is.
    const legStepsExhausted = liveDrive.steps.length > 0 && (!step || step.legIdx !== liveDrive.legIdx);
    if (nearDest || legStepsExhausted) {
      finishCurrentLiveLeg();
      if (liveDrive.legIdx >= p.legs.length) {
        // Reached the final destination — go straight to the Drive Complete
        // screen rather than waiting for a manual Stop tap.
        endLiveDrive();
        return;
      }
    }
  }

  checkLiveRouteDeviation(lat, lng);
  updateLiveDriveDOM();
}

// Off-route detection: a handful of consecutive fixes that land too far
// from the route's own path (not just occasional GPS noise) triggers a
// fresh Directions call from here to the remaining stops, replacing the
// rest of the turn-by-turn and the drawn route line in place.
function checkLiveRouteDeviation(lat, lng) {
  if (!liveDrive || liveDrive.rerouting || !liveDrive.steps.length) return;
  const p = state.planner;
  if (!p || liveDrive.legIdx >= p.legs.length) return; // no remaining stop to reroute toward
  // A real off-route departure only happens while actually moving -- while
  // essentially stationary (parked, or just testing indoors), "distance
  // from the route" is far more likely GPS/WiFi-positioning noise than a
  // genuine wrong turn, and it isn't rare for that noise alone to clear
  // LIVE_OFFROUTE_M for several fixes in a row. Rerouting on that produces
  // a real, if bogus, new route from wherever the noisy fix happened to
  // land -- which then shows up as "a drive that didn't happen" on the
  // drawn line and, if it's the last thing before Stop, on the Drive
  // Complete summary too. Same threshold already used to hold the map's
  // heading steady on the same noise (see LIVE_MIN_ROTATE_SPEED_MS).
  if ((liveDrive.smoothSpeedMs || 0) < LIVE_MIN_ROTATE_SPEED_MS) { liveDrive.offRouteStrikes = 0; return; }
  const offRoute = distanceToLiveRouteMeters(lat, lng) > LIVE_OFFROUTE_M;
  liveDrive.offRouteStrikes = offRoute ? liveDrive.offRouteStrikes + 1 : 0;
  if (liveDrive.offRouteStrikes < LIVE_OFFROUTE_CONFIRM_FIXES) return;
  if (Date.now() - liveDrive.lastRerouteAt < LIVE_REROUTE_COOLDOWN_MS) return;
  liveDrive.offRouteStrikes = 0;
  rerouteLiveDrive(lat, lng);
}

// Recomputes the route from the current position to the remaining stops
// (skipping stops already arrived at) and splices it in as the new
// turn-by-turn — the already-driven distance/duration already banked in
// completedLegs/legDistanceM is untouched, only the guidance ahead changes.
async function rerouteLiveDrive(lat, lng) {
  const p = state.planner;
  if (!p || !liveDrive || liveDrive.rerouting) return;
  const remainingStops = p.stops.slice(liveDrive.legIdx + 1);
  if (!remainingStops.length) return;
  liveDrive.rerouting = true;
  liveDrive.lastRerouteAt = Date.now();
  updateLiveDriveDOM();
  try {
    const library = await getRoutesLibrary();
    if (!library) throw new Error("Directions service isn't ready");
    const { DirectionsService } = library;
    const service = new DirectionsService();
    const destination = remainingStops[remainingStops.length - 1];
    const waypoints = remainingStops.slice(0, -1).map(s => ({ location: { lat: s.lat, lng: s.lng }, stopover: true }));
    const result = await new Promise((resolve, reject) => {
      service.route({
        origin: { lat, lng }, destination: { lat: destination.lat, lng: destination.lng }, waypoints,
        travelMode: google.maps.TravelMode.DRIVING,
      }, (res, status) => {
        if (status !== "OK") { reject(new Error(status)); return; }
        resolve(res);
      });
    });
    if (!liveDrive || !state.planner) return; // drive ended while this was in flight
    const legOffset = liveDrive.legIdx;
    liveDrive.steps = flattenDirectionsSteps(result).map(s => ({ ...s, legIdx: s.legIdx + legOffset }));
    liveDrive.stepIdx = 0;
    liveDrive.stepEndMinDist = null;
    // Don't trust this new route's very first step for the road pill right
    // away -- held through the same debounce as a normal step advance (see
    // LIVE_PILL_HOLD_M) instead. A route recomputed from a raw device
    // position can have Google snap that position to just past a nearby
    // intersection, making step 0 the road *after* an upcoming turn the
    // driver hasn't actually reached yet -- showing that immediately is
    // exactly the "pill shows the upcoming road" bug. Holding the previous
    // committed name a bit longer avoids it; nothing to hold onto right
    // after a resume (steps started empty, pillRoadName is still ""), so
    // that case still commits immediately rather than showing a blank pill.
    const newPillRoadName = liveDrive.steps[0] ? stepStreetName(liveDrive.steps[0].instructions) : "";
    if (liveDrive.pillRoadName) {
      liveDrive.pillPendingRoadName = newPillRoadName;
      liveDrive.pillHoldAnchor = { lat, lng };
    } else {
      liveDrive.pillRoadName = newPillRoadName;
      liveDrive.pillPendingRoadName = null;
      liveDrive.pillHoldAnchor = null;
    }
    plannerDirectionsResult = result;
    if (plannerDirectionsRenderer) plannerDirectionsRenderer.setDirections(result);
    // Redraws the upcoming-stop/destination pins against the new route --
    // ensurePlannerMap only draws these once at drive start, and a reroute
    // never calls that again, so without this they'd keep pointing at
    // wherever the pre-reroute route used to pass through/end.
    drawPlannerRoutePins(result, null, false, "#4C9FF2");
  } catch { /* offline or no viable route from here — keep following the last known route until the next off-route check retries */ }
  if (!liveDrive) return;
  liveDrive.rerouting = false;
  updateLiveDriveDOM();
}

// Rotates the whole map DOM (tiles, route line, and marker together) so

// icon rotation stays heading-relative-to-north (set below), which cancels
// out against this counter-rotation to leave the arrow pointing straight up.
//

// only the shortest delta from its current value is ever added to it — so
// the CSS transition always takes the short way around. A naive
// `rotate(${-heading}deg)` set fresh from a mod-360 heading each fix will,

// at every speed.

  // A two-finger touch rotate (see handleLiveTouchMove) already set

  // auto heading-follow here is what keeps this per-fix/per-frame call

// Ascending tilt/zoom order — simplest to reason about with five manual

  const idx = LIVE_ANGLE_MODE_CYCLE.indexOf(liveDrive.angleMode);
  liveDrive.angleMode = LIVE_ANGLE_MODE_CYCLE[(idx + 1) % LIVE_ANGLE_MODE_CYCLE.length];
  const profile = resolveLiveAngleProfile(liveMapLastSpeedMs);
  const wrap = document.getElementById("plannerMapRotateWrap");
  if (wrap) wrap.classList.toggle("angled", profile.tilt > 0);
  const skyMask = document.getElementById("plannerSkyMask");
  if (skyMask) skyMask.classList.toggle("show", profile.tilt > 0);

function computeLiveRemaining() {
  if (!liveDrive) return { km: 0, min: 0, etaStr: "–" };
  let remainingM = 0;
  const step = liveDrive.steps[liveDrive.stepIdx];
  if (step && liveDrive.lastFix) remainingM += haversineMeters(liveDrive.lastFix.lat, liveDrive.lastFix.lng, step.endLat, step.endLng);
  for (let i = liveDrive.stepIdx + 1; i < liveDrive.steps.length; i++) remainingM += liveDrive.steps[i].distanceM;

  const totalDurS = liveDrive.steps.reduce((s, st) => s + st.durationS, 0);
  const remainingMin = totalDistM > 0
    ? Math.max(1, Math.round((remainingM / totalDistM) * totalDurS / 60))
    : Math.max(1, Math.round(remainingM / 1000 / 40 * 60));

  // default hour cycle, so ETA always reads as 12-hour time.
  const rawEta = eta.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", hour12: true });

  // looser than the rest of this readout.

// Bounds an otherwise-unbounded network call (geocoding, routing) to at

    const leg = p.legs[i], from = p.stops[i], to = cl.partial ? null : p.stops[i + 1];
    const startTimeStr = `${String(cursor.getHours()).padStart(2, "0")}:${String(cursor.getMinutes()).padStart(2, "0")}`;
    cursor = new Date(cursor.getTime() + cl.durationMin * 60000);
    const endTimeStr = `${String(cursor.getHours()).padStart(2, "0")}:${String(cursor.getMinutes()).padStart(2, "0")}`;
    let endPoint = to ? (to.address.trim() || "Unspecified") : "Current location";
    if (!to && lastKnownPos) {
      let matched = null;
      if (mapsConfigured()) {
        try { matched = await withTimeout(matchSavedAddressNear(lastKnownPos.lat, lastKnownPos.lng), 6000); }
        catch { /* rejected or timed out -- fall through to reverse geocoding below */ }
      }
      if (matched) {
        endPoint = matched.address;
      } else {
        try { endPoint = await withTimeout(reverseGeocode(lastKnownPos.lat, lastKnownPos.lng), 6000); } catch { /* keep the "Current location" fallback */ }
      }
    }
    const trip = {
      id: uid(), date, startTime: startTimeStr, endTime: endTimeStr,
      distance: cl.distanceKm, startPoint: from.address.trim() || "Unspecified",
      endPoint, tag: leg.tag,
    };
    if (from.lat != null) { trip.startLat = from.lat; trip.startLng = from.lng; }
    if (to && to.lat != null) { trip.endLat = to.lat; trip.endLng = to.lng; }
    else if (!to && lastKnownPos) { trip.endLat = lastKnownPos.lat; trip.endLng = lastKnownPos.lng; }
    // Consumed by finalizeTrip (see attachTripDetailedImage) once Save Drive
    // actually commits this trip -- stripped there rather than kept on the
    // trip long-term, since only the rendered image (not the raw points)
    // needs to persist.
    trip._pathPoints = liveDrive.breadcrumbs.filter(b => b.legIdx === i).map(b => ({ lat: b.lat, lng: b.lng }));
    trips.push(trip);
  }

  // Nothing is logged yet — show the completed route (green, static) with a
  // summary card first, its briefcase toggles still editable, and defer
  // actually committing these trips until Save Drive is tapped (see
  // plannerCompleteDoneBtn's handler), which re-reads each leg's tag at that
  // point in case it was changed here. Built from what was actually driven
  // (completedLegs), not the original Directions estimate still sitting in
  // p.legs.distanceKm/durationMin.
  p.completeSummary = {
    legs: liveDrive.completedLegs.map((cl, i) => ({ tag: p.legs[i] ? p.legs[i].tag : null, distanceKm: cl.distanceKm, durationMin: cl.durationMin })),
    trips,
  };
  // Stopped before the final destination -- the map still has the full
  // planned route loaded (start -> ... -> a stop that was never actually
  // reached), which would show road ahead as "driven" that never was.
  // Replace it with a fresh route covering only the stops actually reached,
  // ending at wherever GPS last had the driver, so the map on this screen
  // reflects the real drive instead of the plan.
  if (legIdxAtStop < p.legs.length && p.stops[0].lat != null) {
    try {
      const library = await withTimeout(getRoutesLibrary(), 6000);
      if (!library) throw new Error("Directions service isn't ready");
      const { DirectionsService } = library;
      const service = new DirectionsService();
      const destPoint = hadPartialProgress && lastKnownPos
        ? { lat: lastKnownPos.lat, lng: lastKnownPos.lng }
        : { lat: p.stops[legIdxAtStop].lat, lng: p.stops[legIdxAtStop].lng };
      const waypoints = p.stops.slice(1, legIdxAtStop).filter(s => s.lat != null)
        .map(s => ({ location: { lat: s.lat, lng: s.lng }, stopover: true }));
      const result = await withTimeout(new Promise((resolve, reject) => {
        service.route({
          origin: { lat: p.stops[0].lat, lng: p.stops[0].lng }, destination: destPoint, waypoints,
          travelMode: google.maps.TravelMode.DRIVING,
        }, (res, status) => { if (status !== "OK") { reject(new Error(status)); return; } resolve(res); });
      }), 8000);
      plannerDirectionsResult = result;
    } catch (e) { /* keep showing the originally planned route rather than none at all */ }
  }
  p.stage = "complete";
  p.mapFocusMode = false;
  liveDrive = null;
  plannerLiveMarker = null;
  stopLiveMoveAnimation();
  await storageDelete(LIVE_DRIVE_KEY);
  render();
}

// Drive Complete's Back button — undoes endLiveDrive using the snapshot it
// took right before mutating anything, then resumes GPS tracking exactly
// like starting a fresh drive would. The gap between stopping and tapping
// Back is excluded from the resumed leg's duration, same idea as a pause.
async function resumeStoppedDrive() {
  const p = state.planner;
  if (!p || !p.preStopSnapshot) return;
  const snap = p.preStopSnapshot;
  const gapMs = Date.now() - snap.stoppedAt;
  liveDrive = snap.liveDrive;
  liveDrive.startedAt += gapMs;
  liveDrive.legStartedAt += gapMs;
  plannerDirectionsResult = snap.directionsResult;
  p.preStopSnapshot = null;
  p.completeSummary = null;
  p.stage = "driving";
  p.mapFocusMode = false;
  plannerLiveMarker = null;
  liveMapRotationDeg = 0;
  liveMapLastHeadingDeg = 0;
  liveMapLastSpeedMs = 0;
  liveMapCurrentTilt = 0;
  liveMapLastAppliedZoom = null;
  stopLiveMoveAnimation();
  await persistLiveDriveSnapshot();
  render();
  liveWatchId = navigator.geolocation.watchPosition(handleLiveFix, () => { /* a missed fix just means no update this tick */ }, {
    enableHighAccuracy: true, maximumAge: 2000, timeout: 15000,
  });
}

// Drive Complete's Discard button (after the confirm step) — abandons the
// drive entirely; nothing's been saved yet at this point regardless, so
// this is just leaving the planner the same as any other cancel.
function discardStoppedDrive() {
  state.planner = null;
  plannerDirectionsResult = null;
  render();
}

// Best-effort resume after a refresh mid-drive: restores the start time,
// completed legs so far, and current leg's accumulated distance. The turn
// list itself isn't persisted (it's a live Google object graph), so
// turn-by-turn just goes quiet until the next fix re-derives it once Maps
// and the route reload — GPS distance/time tracking itself resumes exactly.
async function resumeLiveDriveIfAny() {
  const saved = await storageGet(LIVE_DRIVE_KEY);
  if (!saved || !saved.plannerSnapshot) return;
  state.planner = {
    stops: saved.plannerSnapshot.stops,
    legs: saved.plannerSnapshot.legs,
    stage: "driving",
    previewing: false,
    previewError: "",
  };
  liveDrive = {
    startedAt: saved.startedAt,
    steps: [],
    stepIdx: 0,
    stepEndMinDist: null,
    pillRoadName: "", pillPendingRoadName: null, pillHoldAnchor: null,
    legIdx: saved.legIdx || 0,
    legStartedAt: saved.legStartedAt || saved.startedAt,
    legDistanceM: saved.legDistanceM || 0,
    legArriveMinDist: null,
    completedLegs: saved.completedLegs || [],
    breadcrumbs: saved.breadcrumbs || [],
    lastFix: null,
    paused: !!saved.paused, pausedAt: saved.pausedAt || null,
    offRouteStrikes: 0, lastRerouteAt: 0, rerouting: false,
    smoothFix: null, smoothHeading: null, smoothSpeedMs: null,
    angleMode: "auto", autoAngleTier: "low", zoomMode: "auto", autoZoomTier: "low", manualZoom: null,
    panMode: "auto", headingMode: "auto", northLocked: false,
  };
  stopLiveMoveAnimation();
  if (navigator.geolocation) {
    liveWatchId = navigator.geolocation.watchPosition(handleLiveFix, () => {}, {
      enableHighAccuracy: true, maximumAge: 2000, timeout: 15000,
    });
  }
}

let mapsLibraryPromise = null;
async function getMapsLibrary() {
  try { await loadGoogleMapsScript(); } catch (e) { return null; }
  if (!window.google || !window.google.maps || typeof google.maps.importLibrary !== "function") return null;
  if (!mapsLibraryPromise) mapsLibraryPromise = google.maps.importLibrary("maps");

// Sunrise/sunset for a given date + coordinates (NOAA solar position
// approximation, accurate to within a minute or two — plenty for deciding
// whether the map should be in night style). Returns Date objects, or
// null/NaN times at extreme latitudes during polar day/night; callers
// should fall back to a fixed-hour heuristic when that happens.
function sunTimesFor(date, lat, lon) {
  const rad = Math.PI / 180;
  const dayMs = 86400000, J1970 = 2440588, J2000 = 2451545;
  const toDays = d => d.getTime() / dayMs - 0.5 + J1970 - J2000;
  const fromJulian = j => new Date((j + 0.5 - J1970) * dayMs);
  const e = rad * 23.4397;
  const lw = rad * -lon, phi = rad * lat;
  const d = toDays(date);
  const n = Math.round(d - 0.0009 - lw / (2 * Math.PI));
  const ds = 0.0009 + lw / (2 * Math.PI) + n;
  const M = rad * (357.5291 + 0.98560028 * ds);
  const C = rad * (1.9148 * Math.sin(M) + 0.02 * Math.sin(2 * M) + 0.0003 * Math.sin(3 * M));
  const L = M + C + rad * 102.9372 + Math.PI;
  const dec = Math.asin(Math.sin(L) * Math.sin(e));
  const Jnoon = J2000 + ds + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const w0 = Math.acos((Math.sin(rad * -0.83) - Math.sin(phi) * Math.sin(dec)) / (Math.cos(phi) * Math.cos(dec)));
  const dsSet = 0.0009 + (w0 + lw) / (2 * Math.PI) + n;
  const Jset = J2000 + dsSet + 0.0053 * Math.sin(M) - 0.0069 * Math.sin(2 * L);
  const Jrise = Jnoon - (Jset - Jnoon);
  return { sunrise: fromJulian(Jrise), sunset: fromJulian(Jset) };
}
// True between sunset and sunrise at the given coordinates (or, without a
// known location, a fixed 7pm-6am fallback).
function isNightTime(lat, lng, now = new Date()) {
  if (lat == null || lng == null) {
    const h = now.getHours();
    return h >= 19 || h < 6;
  }
  const { sunrise, sunset } = sunTimesFor(now, lat, lng);
  if (isNaN(sunrise.getTime()) || isNaN(sunset.getTime())) {
    const h = now.getHours();
    return h >= 19 || h < 6;
  }
  return now < sunrise || now >= sunset;
}

function plannerNextEmptyStopIndex() {
  if (!state.planner) return null;
  const idx = state.planner.stops.findIndex(s => !s.address.trim());
  return idx === -1 ? null : idx;
}

// A plain class toggle (not a render()) so the live map underneath is
// untouched — mapFocusMode is still tracked on state.planner so the class
// survives the next *unrelated* render() (e.g. a stop resolving elsewhere),
// which would otherwise rebuild the template without it and silently
// re-reveal the form.
function toggleMapFocusMode() {
  const p = state.planner;
  if (!p) return;
  p.mapFocusMode = !p.mapFocusMode;
  const el = document.querySelector(".planner-fullscreen");
  if (el) el.classList.toggle("map-focus", p.mapFocusMode);
}

let plannerMapInstance = null;
let plannerMapClickListener = null;
let plannerMapDblClickListener = null;
let plannerDirectionsRenderer = null;
let plannerDirectionsChangedListener = null;
let plannerLiveMarker = null;
let plannerTripStartMarker = null;
let plannerRoutePins = [];
let plannerMapIsNight = false;
// A teardrop pin path (viewBox-style coordinates, tip at 12,24) rather than
// Google's own default marker -- that one only comes in its stock red, and
// suppressed here anyway (see suppressMarkers) since a plain, unlabeled
// default pin can't carry the Start/Stop/End color coding. The anchor
// point matches the path's own tip coordinate, so (like Google's default)
// it's the tip that sits exactly on the real coordinate, not the balloon.
function plannerPinIcon(color) {
  return {
    path: "M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z",
    fillColor: color, fillOpacity: 1, strokeColor: "#fff", strokeWeight: 1.2,
    scale: 1.5, anchor: new google.maps.Point(12, 24),
  };
}
// Pins for each stop on the route, colored Start/Stop/End. A route's own
// leg boundaries are snapped to the nearest routable road, which can
// leave a real gap between where the line actually ends and a stop's real
// coordinate (a building set back from the road, an inexact geocode,
// etc.) -- when the real coordinates are known (the `stops` array, in the
// same order as legs: stops[0] is the start, stops[i+1] is leg i's end),
// the pin goes there instead of the snapped point, and a short connector
// segment in the same route color bridges the two so the line visually
// reaches all the way to the pin. Pass null for stops (the live driving
// map's own caller does -- see rerouteLiveDrive) to skip all that and
// just use the route's own snapped boundaries directly, when the leg
// indices here can't be reliably lined up against p.stops (e.g. after a
// reroute renumbers which stops are left).
async function drawPlannerRoutePins(result, stops, includeStart, lineColor) {
  if (!plannerMapInstance) return;
  clearPlannerRoutePins();
  try {
    const { Marker } = await google.maps.importLibrary("marker");
    if (!plannerMapInstance) return;
    const legs = result.routes[0].legs;
    const CONNECT_THRESHOLD_M = 15;
    const pin = (position, color, title) => plannerRoutePins.push(new Marker({
      map: plannerMapInstance, position, icon: plannerPinIcon(color), zIndex: 3, title,
    }));
    const pinAt = (snappedLatLng, real, color, title) => {
      const snapped = { lat: snappedLatLng.lat(), lng: snappedLatLng.lng() };
      pin(real || snapped, color, title);
      if (real && haversineMeters(real.lat, real.lng, snapped.lat, snapped.lng) > CONNECT_THRESHOLD_M) {
        plannerRoutePins.push(new google.maps.Polyline({
          map: plannerMapInstance, path: [snapped, real],
          strokeColor: lineColor, strokeWeight: 8, strokeOpacity: 0.9,
        }));
      }
    };
    if (includeStart) pinAt(legs[0].start_location, stops ? stops[0] : null, "#4C9F70", "Start");
    legs.forEach((leg, i) => {
      const isLast = i === legs.length - 1;
      pinAt(leg.end_location, stops ? stops[i + 1] : null, isLast ? "#E5484D" : "#E0642C", isLast ? "End" : "Stop");
    });
  } catch { /* map still usable without the stop pins */ }
}
function clearPlannerRoutePins() {
  plannerRoutePins.forEach(m => m.setMap(null));
  plannerRoutePins = [];
}

// Live-updates just the distance/time/hazard/leg-tag card in place, without
// a full render() — used after a drag-to-reroute (directions_changed can
// fire repeatedly mid-drag) so the drag gesture, map, and any focused input
// elsewhere on the page are never interrupted.
function updatePlannerRouteSummaryDOM() {
  const el = document.querySelector(".planner-route-summary");
  if (!el || !state.planner) return;
  const wrap = document.createElement("div");
  wrap.innerHTML = renderPlannerRouteSummary();
  const fresh = wrap.querySelector(".planner-route-summary");
  if (fresh) el.replaceWith(fresh);
  armStaticHazardMarquee();
  armPlannerLegRouteMarquee();
}

// The whole #app subtree is replaced via innerHTML on every render(), which
// destroys any live google.maps.Map bound to the old canvas node — so this
// re-creates the map against the fresh canvas every time the Plan tab
// renders with an active planning session, restoring the click listener and
// redrawing the last-computed route from the cached plannerDirectionsResult
// (see above) rather than re-hitting the Directions API.
async function ensurePlannerMap() {
  const canvas = document.getElementById("plannerMapCanvas");
  if (plannerMapClickListener) { google.maps.event.removeListener(plannerMapClickListener); plannerMapClickListener = null; }
  if (plannerMapDblClickListener) { google.maps.event.removeListener(plannerMapDblClickListener); plannerMapDblClickListener = null; }
  plannerDirectionsRenderer = null;
  plannerDirectionsChangedListener = null;
  plannerMapInstance = null;
  plannerLiveMarker = null;
  plannerTripStartMarker = null;
  plannerRoutePins = []; // belonged to the old map instance, already gone
  if (!canvas || !mapsConfigured()) return;
  const library = await getMapsLibrary();
  if (!library) return;
  const { Map } = library;
  if (document.getElementById("plannerMapCanvas") !== canvas) return; // superseded by a newer render while this was loading

  const p = state.planner;
  const driving = p && p.stage === "driving";
  const complete = p && p.stage === "complete";
  const firstStop = p && p.stops.find(s => s.lat != null);
  let center = firstStop ? { lat: firstStop.lat, lng: firstStop.lng } : { lat: 20, lng: 0 };
  let zoom = firstStop ? 12 : 2;
  // Grab the device's live position once up front — used both to center the
  // fullscreen map on open (when nothing's picked yet) and to drop the
  // "you are here" blue dot below, regardless of where the start ends up.
  // Not needed for a post-drive review, so skipped there.
  let myLocation = null;
  if (!driving && !complete && mapsConfigured()) {
    try {
      const coords = await getCurrentPosition();
      if (document.getElementById("plannerMapCanvas") !== canvas) return;
      myLocation = { lat: coords.latitude, lng: coords.longitude };
      if (!firstStop) { center = myLocation; zoom = 14; }
    } catch { /* keep the world-view fallback — user can still search or tap the map */ }
  }
  // Driving: zoom in to street level and center on the driver's actual
  // position (offset behind them, see lookAheadCenter) rather than the
  // route's start, so the very first render of the driving view already
  // reads as "zoomed in and following you".
  if (driving && liveDrive && liveDrive.lastFix) {
    zoom = resolveLiveZoom(liveDrive.smoothSpeedMs || 0);
    const tiltDeg = resolveLiveAngleProfile(liveDrive.smoothSpeedMs || 0).tilt;
    center = lookAheadCenter(liveDrive.lastFix.lat, liveDrive.lastFix.lng, liveDrive.lastFix.heading, zoom, tiltDeg);
  }
  // Best known fix for deciding day/night styling: live position, else the
  // first resolved stop, else the last GPS fix from an in-progress drive.
  const nightRef = myLocation || firstStop || (driving && liveDrive && liveDrive.lastFix) || null;
  const night = isNightTime(nightRef && nightRef.lat, nightRef && nightRef.lng);
  plannerMapIsNight = night;
  liveMapLabelsKey = null;
  plannerMapInstance = new Map(canvas, {
    // Upright at this point by construction (rotation always starts back at
    // 0 in startLiveDrive/resumeLiveDriveIfAny), so all road labels are safe
    // to show for this very first paint regardless of the chosen profile.
    center, zoom, styles: driving ? drivingMapStyles(true) : (night ? NIGHT_MAP_STYLE : []),
    disableDefaultUI: true, zoomControl: !driving,
    // Native gesture handling is unaware of the CSS rotate/tilt this screen
    // wraps around the map (see .planner-map-rotate-wrap) -- it computes
    // pan/pinch/rotate in the map's own un-rotated, un-tilted pixel space,
    // so the same finger movement produces a visibly different on-screen
    // result depending on the current heading (dragging didn't track the
    // finger once rotated, and two-finger rotate itself fought whatever
    // native handling was also doing with the same touches). Disabled
    // entirely while driving in favor of a fully custom, rotation/tilt-
    // corrected pan+pinch+rotate implementation (see handleLiveTouchMove).
    gestureHandling: driving ? "none" : "greedy",
    // Frees up double-click for toggling map-focus mode below instead of
    // the default double-click-to-zoom-in.
    disableDoubleClickZoom: !driving && !complete,
  });

  if (driving) {
    // Still fires (and still the right signal for "pinch changed the
    // zoom") for the setZoom() calls handleLiveTouchMove makes itself now,
    // same as it did for Maps' own native pinch before gestureHandling was
    // turned off here.
    plannerMapInstance.addListener("zoom_changed", handleLiveZoomChanged);
    // Native touch listeners rather than Maps' own dragstart/dragend -- see
    // handleLiveTouchStart's own comment for why this screen replaces
    // Maps' native gesture handling outright instead of just watching
    // alongside it. Not passive: these need to preventDefault so the
    // browser doesn't also try to scroll/zoom the page from the same
    // touches now that Maps itself won't.
    canvas.addEventListener("touchstart", handleLiveTouchStart, { passive: false });
    canvas.addEventListener("touchmove", handleLiveTouchMove, { passive: false });
    canvas.addEventListener("touchend", handleLiveTouchEnd, { passive: false });
    canvas.addEventListener("touchcancel", handleLiveTouchEnd, { passive: false });
  }

  if (!driving && !complete) {
    plannerMapClickListener = plannerMapInstance.addListener("click", async (e) => {
      const targetIdx = plannerNextEmptyStopIndex();
      if (targetIdx == null) return;
      const stop = state.planner.stops[targetIdx];
      const lat = e.latLng.lat(), lng = e.latLng.lng();
      let address;
      try { address = await reverseGeocode(lat, lng); }
      catch { address = `${lat.toFixed(5)}, ${lng.toFixed(5)}`; }
      if (!state.planner || state.planner.stops[targetIdx] !== stop) return;
      await plannerResolveStop(stop, address, { lat, lng });
    });
    // Double-click toggles hiding the address form and bottom sheet so the
    // whole route is visible edge-to-edge — double-clicking again brings
    // them back. A single click still just fills the next empty stop.
    plannerMapDblClickListener = plannerMapInstance.addListener("dblclick", () => toggleMapFocusMode());
  }

  if (plannerDirectionsResult) {
    try {
      const { DirectionsRenderer } = await getRoutesLibrary();
      if (document.getElementById("plannerMapCanvas") !== canvas) return;
      plannerDirectionsRenderer = new DirectionsRenderer({
        map: plannerMapInstance, draggable: !driving && !complete,
        // Always suppressed -- Google's own default pins only ever come in
        // stock red regardless of role, and (while driving specifically)
        // a reroute replaces this result with one whose origin is wherever
        // the car currently is, which would jump its own A/B pins around on
        // every reroute. drawPlannerRoutePins below replaces them
        // everywhere with the same Start/Stop/End colors, at the cost of
        // losing the ability to drag an individual default pin to nudge a
        // stop directly during Preview -- dragging the route line itself
        // to insert a new one still works.
        suppressMarkers: true,
        // Always true -- the default un-padded auto-fit centers the route
        // within the *entire* map div, ignoring that the topbar (address
        // fields) and bottom sheet (summary/buttons) overlay a big chunk of
        // it from the top and bottom. Fitted manually just below instead,
        // padded to the real height of whichever of those are on screen, so
        // the route ends up centered in the part of the map actually visible.
        preserveViewport: true,
        // Thicker than Google's default, and green once the drive is done
        // (marking it as completed) rather than the in-progress blue.
        polylineOptions: { strokeColor: complete ? "#4C9F70" : "#4C9FF2", strokeWeight: 8, strokeOpacity: 0.9 },
      });
      plannerDirectionsRenderer.setDirections(plannerDirectionsResult);
      if (!driving) {
        const routeBounds = plannerDirectionsResult.routes[0].bounds;
        if (routeBounds) {
          const topEl = document.querySelector(".planner-topbar");
          const bottomEl = document.querySelector(".planner-bottom-sheet");
          const topPad = (topEl ? topEl.getBoundingClientRect().height : 0) + 20;
          const bottomPad = (bottomEl ? bottomEl.getBoundingClientRect().height : 0) + 20;
          plannerMapInstance.fitBounds(routeBounds, { top: topPad, right: 24, bottom: bottomPad, left: 24 });
        }
      }
      if (!driving && !complete) {
        plannerDirectionsChangedListener = plannerDirectionsRenderer.addListener("directions_changed", () => {
          const result = plannerDirectionsRenderer.getDirections();
          plannerDirectionsResult = result;
          const route = result.routes[0];
          const pp = state.planner;
          if (!pp) return;
          route.legs.forEach((leg, i) => {
            if (pp.legs[i]) {
              pp.legs[i].distanceKm = leg.distance.value / 1000;
              pp.legs[i].durationMin = Math.max(1, Math.round(leg.duration.value / 60));
            }
          });
          updatePlannerRouteSummaryDOM();
          // Dragging the route line can insert a new via-point that isn't
          // reflected in pp.stops at all (it only changes the path/distance
          // numbers, not the stop list) -- passing pp.stops when the
          // lengths no longer match would misalign every pin after that
          // point, so this falls back to the route's own snapped
          // boundaries (no connector) rather than risk that.
          const stopsForPins = pp.stops.length === route.legs.length + 1 ? pp.stops : null;
          drawPlannerRoutePins(result, stopsForPins, true, "#4C9FF2");
        });
      }
      if (driving) {
        // Upcoming stops/destination, visible on the live nav map itself
        // rather than only appearing once the drive is over -- start is
        // covered separately below by the fixed, reroute-proof marker.
        // No real stop coordinates passed -- see rerouteLiveDrive's own
        // call for why leg indices here can't be reliably lined up
        // against p.stops after a reroute.
        await drawPlannerRoutePins(plannerDirectionsResult, null, false, "#4C9FF2");
        if (document.getElementById("plannerMapCanvas") !== canvas) return;
      } else if (complete) {
        // Built from completeSummary.trips, not p.stops -- a drive stopped
        // short of its final planned destination gets its route redrawn
        // (see endLiveDrive) to end wherever it actually did, which can
        // mean *fewer* legs than the original plan; trips already has
        // exactly one entry per leg of whatever route this now is, so
        // this can't drift out of alignment with it the way re-deriving
        // from the full original stop list could. Each entry is already
        // the real endpoint either way -- the planned stop's own
        // coordinate for one fully reached, or the real GPS one
        // (reverse-geocoded) endLiveDrive resolved for a partial leg.
        const realStops = [{ lat: p.stops[0].lat, lng: p.stops[0].lng },
          ...p.completeSummary.trips.map(t => ({ lat: t.endLat, lng: t.endLng }))];
        await drawPlannerRoutePins(plannerDirectionsResult, realStops, true, "#4C9F70");
        if (document.getElementById("plannerMapCanvas") !== canvas) return;
      } else {
        // Preview gets the start pin too -- the fixed reroute-proof start
        // marker below is only ever drawn for a live "driving" map.
        await drawPlannerRoutePins(plannerDirectionsResult, p.stops, true, "#4C9FF2");
        if (document.getElementById("plannerMapCanvas") !== canvas) return;
      }
    } catch { /* map still usable without the route line */ }
  }

  if (driving && liveDrive && liveDrive.lastFix) {
    updateLiveMarker(liveDrive.lastFix.lat, liveDrive.lastFix.lng, liveDrive.lastFix.heading, liveDrive.smoothSpeedMs);
  }

  // A small, fixed marker at the trip's original starting point — placed
  // once here and never touched by a reroute (which only ever replaces the
  // DirectionsRenderer's own line/markers), so where the drive began stays
  // visible on the map no matter how many times the route ahead changes.
  if (driving && p.stops[0] && p.stops[0].lat != null) {
    try {
      const { Marker } = await google.maps.importLibrary("marker");
      if (document.getElementById("plannerMapCanvas") !== canvas) return;
      plannerTripStartMarker = new Marker({
        map: plannerMapInstance,
        position: { lat: p.stops[0].lat, lng: p.stops[0].lng },
        icon: plannerPinIcon("#4C9F70"),
        zIndex: 3, title: "Start",
      });
    } catch { /* map still usable without the start pin */ }
  }

  // "You are here" — a standard soft-halo-plus-solid-dot blue marker at the
  // device's actual GPS position, shown regardless of what the start field
  // ended up resolving to (a saved address, a search result, or a manual
  // pin), so it always reads as "this is you" rather than a place pick.
  if (myLocation) {
    try {
      const { Marker } = await google.maps.importLibrary("marker");
      if (document.getElementById("plannerMapCanvas") !== canvas) return;
      new Marker({
        map: plannerMapInstance, position: myLocation,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 16, fillColor: "#4C9FF2", fillOpacity: 0.18, strokeWeight: 0 },
        zIndex: 4, clickable: false,
      });
      new Marker({
        map: plannerMapInstance, position: myLocation,
        icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: "#4C9FF2", fillOpacity: 1, strokeColor: "#FFFFFF", strokeWeight: 2 },
        zIndex: 5, title: "Your location",
      });
    } catch { /* map still usable without the dot */ }
  }
}

const hasClaudeStorage = typeof window.storage !== "undefined" && !!window.storage;

async function storageGet(key) {
  try {
    if (hasClaudeStorage) {
      const res = await window.storage.get(key, false);
      return res ? JSON.parse(res.value) : null;
    }
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : null;
  } catch { return null; }
}
async function storageSet(key, value) {
  try {
    if (hasClaudeStorage) { await window.storage.set(key, JSON.stringify(value), false); return; }
    localStorage.setItem(key, JSON.stringify(value));
  } catch (e) { console.error("storage set failed", e); }
}
async function storageDelete(key) {
  try {
    if (hasClaudeStorage) { await window.storage.delete(key, false); return; }
    localStorage.removeItem(key);
  } catch {}
}

function renderLogin() {

function attachLoginHandlers() {
  const existing = state._existingProfile;
  if (!existing) {
    document.getElementById("createBtn").onclick = async () => {
      const name = document.getElementById("loginName").value.trim();
      const pin = document.getElementById("loginPin").value.trim();
      if (!name) { state.loginError = "Enter a name."; render(); return; }
      if (pin.length < 4) { state.loginError = "PIN needs at least 4 digits."; render(); return; }
      const profile = { name, pin };
      await storageSet(PROFILE_KEY, profile);
      state.profile = profile;
      await loadData();
      render();
    };
  } else {
    document.getElementById("unlockBtn").onclick = () => {
      const pin = document.getElementById("enterPin").value.trim();
      if (pin !== existing.pin) { state.loginError = "Wrong PIN."; render(); return; }
      state.profile = existing;
      loadData().then(render);
    };
  }
}

  if (state.settings.lastSyncAt === undefined) state.settings.lastSyncAt = null;
  if (!state.settings.supervisedTotalHoursTarget || !state.settings.supervisedNightHoursTarget) {

  state.fuelFillups = (await storageGet(FUEL_FILLUPS_KEY)) || [];
