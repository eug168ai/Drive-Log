// --- Odometer reconciliation reminders -----------------------------------
const ODOMETER_FREQUENCY_DAYS = { monthly: 30, quarterly: 91, biannual: 182, yearly: 365 };
// Most recent odometer reading from either an explicit "Enter Now" entry or
// a refuel log's odometer field — whichever is more recent counts as the
// last reconciliation, so a logged refuel resets the reminder clock too.
function lastKnownOdometerDate() {
  let latest = (state.settings.lastOdometerReading && state.settings.lastOdometerReading.date) || null;
  state.fuelFillups.forEach(f => {
    if (f.odometer != null && !isNaN(f.odometer) && (!latest || f.date > latest)) latest = f.date;
  });
  return latest;
}
function odometerDueDate() {
  const lastDate = lastKnownOdometerDate();
  if (!lastDate) return null; // never entered — due immediately
  const days = ODOMETER_FREQUENCY_DAYS[state.settings.odometerFrequency] || 91;
  const due = new Date(`${lastDate}T00:00:00`);
  due.setDate(due.getDate() + days);
  return due;
}
function checkOdometerDue() {
  if (state.settings.odometerReminders === false) return;
  const lastDate = lastKnownOdometerDate();
  if (!lastDate) {
    // Never entered a reading — don't nag a brand-new install with zero drives yet.
    if (state.trips.length === 0) return;
    state.odometerPrompt = { value: "" };
    return;
  }
  const due = odometerDueDate();
  if (due && Date.now() >= due.getTime()) {
    state.odometerPrompt = { value: "" };
  }
}

// --- Google Sheets sync reminders -----------------------------------------
const SYNC_REMINDER_FREQUENCY_DAYS = { weekly: 7, monthly: 30, quarterly: 91 };
function syncReminderDueDate() {
  const days = SYNC_REMINDER_FREQUENCY_DAYS[state.settings.syncReminderFrequency];
  if (!days) return null;
  const last = state.settings.lastSyncAt;
  if (!last) return new Date(); // never synced yet — due immediately
  const due = new Date(`${last}T00:00:00`);
  due.setDate(due.getDate() + days);
  return due;
}
function checkSyncReminderDue() {
  if (!state.sheetLink) return; // nothing to remind about if Google Sync isn't connected
  if (!state.settings.syncRemindersEnabled) return;
  const unsyncedCount = state.trips.filter(t => !t.synced).length;
  if (unsyncedCount === 0) return; // already fully synced — nothing to nag about
  const due = syncReminderDueDate();
  if (due && Date.now() >= due.getTime()) {
    state.syncReminderPrompt = { unsyncedCount };
  }
}

let tickerId = null;
function startTicker() {
  if (tickerId) return;
  tickerId = setInterval(() => { if (state.tab === "drive" && state.active) renderTimerOnly(); }, 1000);
}
function stopTicker() { if (tickerId) { clearInterval(tickerId); tickerId = null; } }

function renderTimerOnly() {
  const el = document.getElementById("timerDisplay");
  if (!el || !state.active) return;
  const elapsed = Math.max(0, Math.floor((Date.now() - state.active.startedAt) / 1000));
  const mm = String(Math.floor(elapsed / 60)).padStart(2, "0");
  const ss = String(elapsed % 60).padStart(2, "0");
  el.textContent = `${mm}:${ss}`;
}

function odometer(value) {
  const str = Math.round(Math.max(0, value)).toString().padStart(6, "0").slice(-6);
  return `<div class="odo">${str.split("").map(d => `<span>${d}</span>`).join("")}</div>`;
}
function odometerTime(mins) {
  const h = String(Math.min(999, Math.floor(mins / 60)));
  const m = String(mins % 60).padStart(2, "0");
  const str = `${h}:${m}`;
  return `<div class="odo">${str.split("").map(d => `<span>${d}</span>`).join("")}</div>`;
}

function totalMiles() { return state.trips.reduce((s, t) => s + t.distance, 0); }
// Normalizes any stored time string (24hr "HH:MM", or a legacy 12hr value
// like "9:37 pm" / "09:37 PM") into a plain 24hr "HH:MM" string for display
// and calculation. Returns "" for anything unparseable.
function formatTime24(raw) {
  if (!raw) return "";
  const s = String(raw).trim();
  const ampmMatch = s.match(/^(\d{1,2}):(\d{2})\s*(am|pm)$/i);
  if (ampmMatch) {
    let h = parseInt(ampmMatch[1], 10);
    const m = ampmMatch[2];
    const isPm = /pm/i.test(ampmMatch[3]);
    if (h === 12) h = isPm ? 12 : 0;
    else if (isPm) h += 12;
    return `${String(h).padStart(2, "0")}:${m}`;
  }
  const plainMatch = s.match(/^(\d{1,2}):(\d{2})$/);
  if (plainMatch) {
    return `${plainMatch[1].padStart(2, "0")}:${plainMatch[2]}`;
  }
  return s;
}
// 24hr "HH:MM" -> "h:MM am/pm", for official log-book style output.
function formatTime12(raw) {
  const s24 = formatTime24(raw);
  const m = s24.match(/^(\d{2}):(\d{2})$/);
  if (!m) return "";
  let h = parseInt(m[1], 10);
  const isPm = h >= 12;
  h = h % 12; if (h === 0) h = 12;
  return `${h}:${m[2]} ${isPm ? "pm" : "am"}`;
}
function tripMinutes(t) {
  const start = new Date(`1970/01/01 ${formatTime24(t.startTime)}`);
  let end = new Date(`1970/01/01 ${formatTime24(t.endTime)}`);
  if (isNaN(start) || isNaN(end)) return 0;
  if (end < start) end = new Date(end.getTime() + 24 * 60 * 60 * 1000);
  return Math.round((end - start) / 60000);
}
function totalMinutes() { return state.trips.reduce((s, t) => s + tripMinutes(t), 0); }
function formatDuration(mins) {
  const h = Math.floor(mins / 60), m = mins % 60;
  return h === 0 ? `${m}m` : `${h}h ${m}m`;
}

// --- Log-screen dashboard (Supervised Driving / All Driving bar charts) --
function toDateStr(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }
function dashRange(period, offset) {
  const now = new Date();
  if (period === "week") {
    const start = new Date(now); start.setDate(now.getDate() - ((now.getDay() + 6) % 7) + offset * 7); start.setHours(0, 0, 0, 0);
    const end = new Date(start); end.setDate(start.getDate() + 6);
    return { start, end, unit: "day", count: 7 };
  }
  if (period === "month") {
    const start = new Date(now.getFullYear(), now.getMonth() + offset, 1);
    const end = new Date(now.getFullYear(), now.getMonth() + offset + 1, 0);
    return { start, end, unit: "day", count: end.getDate() };
  }
  if (period === "quarter") {
    const totalQ = now.getFullYear() * 4 + Math.floor(now.getMonth() / 3) + offset;
    const year = Math.floor(totalQ / 4), qIdx = ((totalQ % 4) + 4) % 4;
    const start = new Date(year, qIdx * 3, 1);
    const end = new Date(year, qIdx * 3 + 3, 0);
    return { start, end, unit: "month", count: 3 };
  }
  const year = now.getFullYear() + offset;
  const start = new Date(year, 0, 1);
  const end = new Date(year, 11, 31);
  return { start, end, unit: "month", count: 12 };
}
function daysInRange(range) { return Math.round((range.end - range.start) / 86400000) + 1; }
// Calendar days actually elapsed within a range (clamped to today), so an
// average doesn't get diluted by future days/buckets that haven't happened
// yet — e.g. viewing "this year" in August shouldn't average distance over
// the whole 365 days when only ~225 of them have occurred.
function daysElapsedInRange(range) {
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const end = range.end < today ? range.end : today;
  if (end < range.start) return 0;
  return Math.round((end - range.start) / 86400000) + 1;
}
// Same idea at bucket granularity: average only over FULLY-elapsed buckets
// (to <= today). For day buckets (week/month view) that still includes
// today, since a day's own "to" date is today. For month buckets
// (quarter/year view) it excludes the current in-progress month, whose
// partial total would otherwise drag the average down as if it were a
// complete month's worth of data.
function elapsedBucketAvg(buckets, series) {
  const todayStr = toDateStr(new Date());
  let sum = 0, n = 0;
  buckets.forEach((b, i) => { if (b.to <= todayStr) { sum += series[i]; n++; } });
  return sum / Math.max(1, n);
}
function dashRangeLabel(period, range) {
  if (period === "week" || period === "month" && range.count <= 7)
    return `${range.start.toLocaleDateString(undefined, { day: "numeric", month: "short" })} – ${range.end.toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" })}`;
  if (period === "month") return range.start.toLocaleDateString(undefined, { month: "long", year: "numeric" });
  if (period === "quarter") return `Q${Math.floor(range.start.getMonth() / 3) + 1} ${range.start.getFullYear()}`;
  return `${range.start.getFullYear()}`;
}
function dashBuckets(period, range) {
  const buckets = [];
  if (range.unit === "day") {
    for (let i = 0; i < range.count; i++) {
      const d = new Date(range.start); d.setDate(range.start.getDate() + i);
      const ds = toDateStr(d);
      buckets.push({ from: ds, to: ds, label: period === "week" ? d.toLocaleDateString(undefined, { weekday: "short" }) : String(d.getDate()) });
    }
  } else {
    for (let i = 0; i < range.count; i++) {
      const d = new Date(range.start.getFullYear(), range.start.getMonth() + i, 1);
      const dEnd = new Date(d.getFullYear(), d.getMonth() + 1, 0);
      buckets.push({ from: toDateStr(d), to: toDateStr(dEnd), label: d.toLocaleDateString(undefined, { month: "short" }) });
    }

  return buckets;
}
function dashSupervisedBucketData(bucket) {
  let minutes = 0, nightMinutes = 0;
  state.trips.forEach(t => {
    if (t.tag !== "supervised" || t.date < bucket.from || t.date > bucket.to) return;
    const m = tripMinutes(t);
    minutes += m;
    if (t.timeOfDay === "night") nightMinutes += m;
  });

}

  const ty = Math.max(2, topY - h - 6);
  return `<g class="tip"><rect class="tip-bg" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" width="${textW.toFixed(1)}" height="${h}" rx="5"/><text class="tip-text" x="${(tx + padX).toFixed(1)}" y="${(ty + padY + fontSize - 1).toFixed(1)}">${escAttr(text)}</text></g>`;

// Shared x-position math for both the bars and their labels, so the two

  const gap = n > 1 ? Math.max(minGap, (availW - n * barW) / (n - 1)) : 0;
  const xs = Array.from({ length: n }, (_, i) => sidePad + i * (barW + gap));

  const items = buckets.map((b, i) => {
    if (i % thin !== 0) return "";
    const pct = ((layout.xs[i] + layout.barW / 2) / layout.w) * 100;
    return `<span style="left:${pct.toFixed(2)}%;">${b.label}</span>`;

// N-series overlay bar chart: every series shares the same column, drawn
// from the same baseline. Each series' `bFactor` (< 1 shrinks it relative to
// its own max) lets it read as visually "smaller" than the others rather
// than risking an exact-height match — and for each bucket, series are drawn
// tallest-to-shortest so the shorter ones end up on top/in front and always
// stay visible, even on the rare bucket where the shrink still isn't enough.
// `series` is an array of { data, avg, color, bFactor }.
function renderBarChart(chartId, buckets, series, height, tipIndex) {
  const padTop = 6, padBottom = 6;
  const plotH = height - padTop - padBottom;
  const n = buckets.length;
  const { w, barW, xs } = dashColumnLayout(n);
  const baseline = height - padBottom;
  const prepared = series.map(s => ({
    ...s,
    factor: s.bFactor || 1,
    max: Math.max(1, ...s.data.map(v => v || 0)),
  }));
  let tip = "";
  const cols = buckets.map((b, i) => {
    const x = xs[i];
    const bars = prepared.map(s => {
      const v = s.data[i];
      if (v == null) return null;
      const h = (v / s.max) * plotH * s.factor;
      return { h, y: baseline - h, color: s.color };
    }).filter(Boolean);
    bars.sort((p, q) => q.h - p.h);
    const rects = bars.map(bar => `<rect x="${x.toFixed(1)}" y="${bar.y.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(0, bar.h).toFixed(1)}" rx="3" fill="${bar.color}"/>`).join("");
    if (i === tipIndex) tip = renderChartTip(x + barW / 2, bars.length ? Math.min(...bars.map(p => p.y)) : baseline, b.tip, w);
    return `<g class="col" data-i="${i}" data-chart="${chartId}">${rects}</g>`;
  }).join("");
  const avgLines = prepared.map(s => {
    const yAvg = baseline - (s.avg / s.max) * plotH * s.factor;
    return `<line x1="0" y1="${yAvg.toFixed(1)}" x2="${w}" y2="${yAvg.toFixed(1)}" stroke="${s.color}" stroke-width="1" stroke-dasharray="3,4" opacity=".6"/>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${w} ${height}" preserveAspectRatio="none" style="height:${height}px;">
    ${avgLines}
    <g class="cols">${cols}</g>
    ${tip}
  </svg>`;
}

    if (remainingHours <= 0) sub = "Hours requirement already met";

// --- Supervised (learner) licence hour tracking -----------------------------
// Cumulative across all logged supervised drives (not just this week), since
// licence hour requirements accrue over the life of the learner permit.
function supervisedTotals() {
  let minutes = 0, nightMinutes = 0, distance = 0;
  state.trips.forEach(t => {
    if (t.tag !== "supervised") return;
    const m = tripMinutes(t);
    minutes += m;
    if (t.timeOfDay === "night") nightMinutes += m;
    distance += t.distance;
  });
  return { minutes, nightMinutes, distance, hours: minutes / 60, nightHours: nightMinutes / 60 };
}
// Fires the completion modal once, the first time both targets are met.
// If a later edit/delete drops totals back below target, the flag resets
// so the person gets notified again if they re-cross the line.
function checkSupervisedLicenceComplete() {
  const totalTarget = state.settings.supervisedTotalHoursTarget || 75;
  const nightTarget = state.settings.supervisedNightHoursTarget || 15;
  const { hours, nightHours } = supervisedTotals();
  const met = hours >= totalTarget && nightHours >= nightTarget;
  if (met && !state.settings.supervisedCompletionNotified) {
    state.settings.supervisedCompletionNotified = true;
    state.supervisedCompletionPrompt = { hours, nightHours, totalTarget, nightTarget };
    storageSet(SETTINGS_KEY, state.settings);
  } else if (!met && state.settings.supervisedCompletionNotified) {
    state.settings.supervisedCompletionNotified = false;
    storageSet(SETTINGS_KEY, state.settings);
  }
}

// --- Fuel cost -------------------------------------------------------------
function monthsAgoStr(monthsBack) {
  const cutoff = new Date();
  cutoff.setMonth(cutoff.getMonth() - monthsBack);
  return cutoff.toISOString().slice(0, 10);
}
// Consecutive full-tank-to-full-tank intervals, built from refuels that have
// an odometer reading (sorted by odometer, not date — protects against
// refuels logged out of order). The fuel added at the *later* refuel of each
// pair is what was actually consumed traveling between the two readings, so
// this is real usage, independent of whether every trip in between got
// logged in the app.
function fuelIntervals() {
  const withOdo = state.fuelFillups
    .filter(f => f.odometer != null && !isNaN(f.odometer))
    .slice()
    .sort((a, b) => a.odometer - b.odometer);
  const intervals = [];
  for (let i = 1; i < withOdo.length; i++) {
    const prev = withOdo[i - 1], cur = withOdo[i];
    const distance = cur.odometer - prev.odometer;
    if (distance <= 0) continue; // bad/duplicate reading — skip rather than corrupt the average
    intervals.push({ date: cur.date, distance, amount: Number(cur.amount) || 0, price: Number(cur.price) || 0 });
  }
  return intervals;
}
// "Accurate" mode's $/km rate. Prefers real odometer-interval data — exact
// distance per dollar spent, unaffected by gaps in trip logging. Falls back
// to the old trip-distance method (spend since earliest refuel vs. logged
// trip distance since then) when there isn't yet a full odometer interval.
function accurateFuelCostPerKm() {
  if (!state.fuelFillups.length) return null;
  const intervals = fuelIntervals();
  if (intervals.length) {
    const totalDistance = intervals.reduce((s, iv) => s + iv.distance, 0);
    const totalPrice = intervals.reduce((s, iv) => s + iv.price, 0);
    if (!totalDistance) return null;
    const totalDistanceKm = state.settings.unit === "mi" ? totalDistance / 0.621371 : totalDistance;
    return totalPrice / totalDistanceKm;
  }
  const dates = state.fuelFillups.map(f => f.date).sort();
  const from = dates[0];
  const totalSpend = state.fuelFillups.reduce((s, f) => s + (Number(f.price) || 0), 0);
  const distanceKm = state.trips.filter(t => t.date >= from).reduce((s, t) => s + t.distance, 0);
  if (!distanceKm) return null;
  return totalSpend / distanceKm;
}
// Real fuel usage (L/100km or MPG, matching the current unit) from odometer
// intervals — not an estimate, the actual litres burned per km covered.
// Returns null until there's at least one complete odometer-to-odometer
// interval (i.e. at least two refuels logged with an odometer reading).
function accurateFuelUsage(monthsBack) {
  let intervals = fuelIntervals();
  if (monthsBack != null) {
    const cutoffStr = monthsAgoStr(monthsBack);
    intervals = intervals.filter(iv => iv.date >= cutoffStr);
  }
  const totalDistance = intervals.reduce((s, iv) => s + iv.distance, 0);
  const totalAmount = intervals.reduce((s, iv) => s + iv.amount, 0);
  if (!totalDistance || !totalAmount) return null;
  return state.settings.unit === "mi" ? totalDistance / totalAmount : (totalAmount / totalDistance) * 100;
}
// Average price paid per litre/gallon over a trailing window, from logged
// refuels. Weighted by volume (total spend / total volume) rather than a
// simple mean of each refuel's unit price, so bigger fill-ups count more.
function avgFuelPriceForPeriod(monthsBack) {
  let refuels = state.fuelFillups;
  if (monthsBack != null) {
    const cutoffStr = monthsAgoStr(monthsBack);
    refuels = refuels.filter(f => f.date >= cutoffStr);
  }
  const totalAmount = refuels.reduce((s, f) => s + (Number(f.amount) || 0), 0);
  if (!totalAmount) return null;
  const totalPrice = refuels.reduce((s, f) => s + (Number(f.price) || 0), 0);
  return totalPrice / totalAmount;
}
function estimatedFuelCostPerKm() {
  const rate = parseFloat(state.settings.fuelRate);
  const price = parseFloat(state.settings.fuelPrice);
  if (!rate || !price || isNaN(rate) || isNaN(price)) return null;
  if (state.settings.unit === "mi") {
    // MPG (miles per gallon) -> cost per mile, then converted to cost per km for internal storage.
    const costPerMile = price / rate;
    return costPerMile * 0.621371;
  }
  // L/100km -> cost per km
  return (rate / 100) * price;
}
function fuelCostPerKm() {
  if (state.settings.fuelTrackingEnabled === false) return null;
  return state.settings.fuelMode === "accurate" ? accurateFuelCostPerKm() : estimatedFuelCostPerKm();
}
function formatFuelCostPerUnit() {
  const perKm = fuelCostPerKm();
  if (perKm == null) return "—";
  const perDisplayUnit = state.settings.unit === "mi" ? perKm / 0.621371 : perKm;
  return perDisplayUnit.toFixed(2);
}
function tripFuelCost(t) {
  const perKm = fuelCostPerKm();
  if (perKm == null) return null;
  return t.distance * perKm;
}
function filteredTrips() {
  return state.trips.filter(t => {
    if (state.filterTag !== "all" && t.tag !== state.filterTag) return false;
    if (state.filterFrom && t.date < state.filterFrom) return false;
    if (state.filterTo && t.date > state.filterTo) return false;
    if (state.filterMinDistance && kmToDisplay(t.distance) < state.filterMinDistance) return false;
    if (state.filterSearch) {
      const q = state.filterSearch.toLowerCase();
      if (!t.startPoint.toLowerCase().includes(q) && !t.endPoint.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

function sortHistoryRows(rows) {
  const dir = state.historySortDir === "asc" ? 1 : -1;
  const sorted = rows.slice();
  if (state.historySortBy === "distance") {
    sorted.sort((a, b) => (a.distance - b.distance) * dir);
  } else {
    sorted.sort((a, b) => {
      const ak = a.date + (a.startTime || ""), bk = b.date + (b.startTime || "");
      return ak < bk ? -1 * dir : ak > bk ? 1 * dir : 0;
    });
  }
  return sorted;
}

  return idx === 0 ? "start" : idx === total - 1 ? "end" : "stop";
}

// Saved-place pills for one stop's field: every saved address as a
// candidate pill, plus a "more saved addresses" trigger (a native <select>,
// invisibly overlaid on the icon — hidden until fitPlannerPillRow finds
// pills that don't fit and moves them here, keeping the row to one line) —
// hidden by default via CSS (.planner-pill-row.show), revealed on focus by
// the .plannerStopInput onfocus handler, for every address field alike.
// The Business toggle lives only in the route summary card, not per-field.
// Add Stop lives in its own always-visible row (renderPlannerLegGapRow /
// the row beneath the last field) rather than here — this row is hidden
// whenever the field isn't focused and already has an address, which would
// make Add Stop disappear along with it.
function renderPlannerFieldPills(idx) {
  const list = savedAddressList();
  const homeWork = list.filter(a => a.id === "home" || a.id === "work");
  const others = list.filter(a => a.id !== "home" && a.id !== "work");
  const allPills = [...homeWork, ...others];
  let html = allPills.map(a => `<button type="button" class="planner-chip" data-stopidx="${idx}" data-address="${escAttr(a.address)}">${escAttr(a.name)}</button>`).join("");
  html += `<span class="planner-chip-icon planner-pill-more" title="More saved addresses" style="display:none;">${icons.moreDots}
    <select class="plannerAddressOverflowSelect" data-stopidx="${idx}"><option value=""></option></select>
  </span>`;
  return html;
}

// trailingAddStop: only ever passed for the very last stop -- when its pill
// row is showing (address still empty), the always-visible Add Stop chip
// (see renderPlannerAddStopRow, skipped by the caller in that case) rides
// the end of that same scrollable row instead of sitting on its own line
// right below it, which used to read as two separate rows stacked for no
// reason once both were visible at once.
function renderPlannerFieldBlock(stop, idx, total, trailingAddStop) {
  const kind = plannerFieldKind(idx, total);
  const removable = kind === "stop";
  const placeholder = kind === "start" ? "Start location" : kind === "end" ? "End location" : "Add a stop";
  const trimmed = stop.address.trim();
  const pillRowShows = !trimmed;
  const isSavedAddress = !!trimmed && savedAddressList().some(a => a.address.trim().toLowerCase() === trimmed.toLowerCase());
  return `
  <div class="planner-field-block" data-stopblock="${idx}">
    <div class="planner-field-row">
      <div class="input-icon ${kind}">
        ${icons.pin}
        <div class="loc-field-wrap">
          <input id="plannerStopInput-${idx}" class="plannerStopInput" data-stopidx="${idx}" placeholder="${placeholder}" value="${escAttr(stop.address)}" autocomplete="off" />
          <div class="loc-overlay"><div class="route-clip"><span class="route-track"></span></div></div>
        </div>
        <button type="button" class="planner-save-address-btn plannerSaveAddressBtn" data-stopidx="${idx}" title="${isSavedAddress ? "Saved address" : "Save this address"}" ${(stop.lat == null || isSavedAddress) ? "disabled" : ""}>${isSavedAddress ? icons.starFilled : icons.starOutline}</button>
      </div>
      ${removable ? `<button type="button" class="planner-remove-btn plannerRemoveStopBtn" data-stopidx="${idx}" title="Remove stop">${icons.close}</button>` : ""}
    </div>
    ${stop.resolving ? `<p class="settings-desc" style="margin:4px 2px 0;">Locating…</p>` : ""}
    ${stop.resolveError ? `<p class="settings-desc" style="color:var(--work);margin:4px 2px 0;">${escAttr(stop.resolveError)}</p>` : ""}
    <div class="planner-pill-row${pillRowShows ? " show" : ""}" id="plannerPillRow-${idx}">${renderPlannerFieldPills(idx)}${trailingAddStop && pillRowShows ? `<button type="button" class="planner-addstop-chip plannerAddStopChip trailing">${icons.plus} Add Stop</button>` : ""}</div>
  </div>`;
}

// Collapses saved-address pills that don't fit a row into the "more"
// dropdown instead, so a pill row never actually needs its scrollbar — run
// after render (widths aren't knowable before layout) and again whenever a
// row is freshly revealed on focus. Pills stay in the DOM (just hidden)
// rather than being removed/recreated, so their click handlers, attached
// once after render, keep working across repeated fit passes.
function fitPlannerPillRow(row) {
  if (!row) return;
  const moreEl = row.querySelector(".planner-pill-more");
  const select = moreEl && moreEl.querySelector("select");
  if (!moreEl || !select) return;
  const pills = Array.from(row.querySelectorAll(".planner-chip[data-address]"));
  pills.forEach(el => { el.style.display = ""; });
  while (select.options.length > 1) select.remove(1);
  moreEl.style.display = "none";
  let guard = 0;
  while (row.scrollWidth > row.clientWidth + 1 && guard++ < pills.length) {
    const last = [...pills].reverse().find(el => el.style.display !== "none");
    if (!last) break;
    last.style.display = "none";
    const opt = document.createElement("option");
    opt.value = last.dataset.address;
    opt.textContent = last.textContent;
    select.appendChild(opt);
    moreEl.style.display = "";
  }
}
function fitPlannerPillRows() {
  document.querySelectorAll(".planner-pill-row").forEach(fitPlannerPillRow);
}

// Between each pair of address boxes: that leg's own distance/time,
// centered — the real Directions figure once it's in (leg.distanceKm, from
// runPlannerPreview) taking priority over the fast pairwise estimate
// (leg.quickDistanceKm, from updatePlannerLegQuickEstimate) that shows the
// moment both ends are resolved but before the full multi-stop route has
// run — plus Add Stop, far right. Always visible (unlike the saved-address
// pill row above/below each field, which only shows on focus) since it
// isn't something to hide once a field already has an address in it.
function renderPlannerLegGapRow(legIdx) {
  const leg = state.planner.legs[legIdx];
  const fromStop = state.planner.stops[legIdx], toStop = state.planner.stops[legIdx + 1];
  const distanceKm = leg.distanceKm != null ? leg.distanceKm : leg.quickDistanceKm;
  const durationMin = leg.distanceKm != null ? leg.durationMin : leg.quickDurationMin;
  const text = distanceKm != null ? `${kmToDisplay(distanceKm).toFixed(1)} ${unitLabel()} · ${formatDuration(durationMin)}`
    : leg.quickEstimating ? "Calculating…" : "";
  // Both ends of this leg need an address in before there's anything
  // meaningful to tag — an empty gap (still typing the next stop) shows no
  // toggle at all rather than one that would silently apply to nothing.
  const showTagToggle = fromStop && toStop && fromStop.address.trim() && toStop.address.trim();
  return `
  <div class="planner-leg-gap-row">
    <span class="planner-leg-gap-left">${showTagToggle ? renderPlannerLegBusinessBtn(legIdx) : ""}</span>
    <span class="planner-quick-estimate mono">${text}</span>
    <button type="button" class="planner-addstop-chip plannerAddStopChip">${icons.plus} Add Stop</button>
  </div>`;
}
// Same always-visible Add Stop as renderPlannerLegGapRow, on its own
// beneath the last (destination) field — there's no leg/distance to show
// there since it's the end of the route, not a gap between two stops.
function renderPlannerAddStopRow() {
  return `
  <div class="planner-leg-gap-row">
    <span class="planner-leg-gap-left"></span>
    <span></span>
    <button type="button" class="planner-addstop-chip plannerAddStopChip">${icons.plus} Add Stop</button>
  </div>`;
}

// Personal/Business toggle for one leg — shown inline between that leg's
// two addresses once both are filled in, and again per-leg in the Drive
// Complete summary. Supervised legs get no toggle at all (there's no quick
// tap between Supervised and anything else, and briefcase icons are a
// Personal/Business-only concept).
function renderPlannerLegBusinessBtn(legIdx) {
  const leg = state.planner.legs[legIdx];
  if (!leg || leg.tag === "supervised") return "";
  const on = leg.tag === "work";
  return `<button type="button" class="planner-leg-business-btn plannerLegBusinessBtn ${on ? "on" : ""}" data-legidx="${legIdx}" title="${on ? "Business drive — tap to switch to Personal" : "Personal drive — tap to switch to Business"}">${on ? icons.briefcaseFilled : icons.briefcase}</button>`;
}

// The road/suburb line is the resolved stop's own short label (see
// resolvePlannerStopRoadSuburb) — falling back to the raw field text (often
// a venue name or full formatted address) while that's still loading, and
// to the generic Start/Stop N/Destination label if the stop somehow has no
// address at all. Shown as one full, unclipped line — CSS lets it scroll
// horizontally rather than truncating with an ellipsis.
//
// The business toggle only appears here (in the route summary), not
// between the address fields. Used for both the pre-drive summary and the
// post-drive "Drive Complete" one — the tag stays changeable right up
// until Save Drive actually commits the trips (see endLiveDrive /
// plannerCompleteDoneBtn), so this always reads the *live*
// state.planner.legs tag rather than the `leg` param's own (which, for the
// complete summary, is a distanceKm/durationMin snapshot of what was
// actually driven — real numbers that shouldn't shift, unlike the tag).
function renderPlannerLegRow(leg, idx, stops, actualTrip) {
  const fromStop = stops[idx], toStop = stops[idx + 1];
  const fromLabel = (fromStop && (fromStop.roadSuburb || fromStop.address)) || plannerStopLabel(idx, stops.length);
  // actualTrip (only passed for the post-drive Drive Completed summary) is
  // endLiveDrive's own record of where each leg actually ended -- for every
  // leg that reached its planned stop this is the same address anyway, but
  // a drive stopped before reaching its final destination ends at wherever
  // GPS actually had the driver (reverse-geocoded), which the planned
  // stop's own address would otherwise wrongly claim was reached.
  const toLabel = actualTrip && actualTrip.endPoint && (!toStop || actualTrip.endPoint !== toStop.address)
    ? actualTrip.endPoint
    : (toStop && (toStop.roadSuburb || toStop.address)) || plannerStopLabel(idx + 1, stops.length);
  const hasDistance = leg.distanceKm != null;
  const liveLeg = state.planner && state.planner.legs[idx];
  const tag = liveLeg ? liveLeg.tag : leg.tag;
  return `
  <div class="planner-leg-row">
    <div class="planner-leg-route-line"><div class="route-clip"><span class="route-track">${escAttr(fromLabel)} → ${escAttr(toLabel)}</span></div></div>
    <div class="planner-leg-meta-row">
      <span class="planner-leg-meta-side">${tag === "supervised" ? `<span class="tag supervised">${labelFor(DRIVE_TYPES, "supervised")}</span>` : ""}</span>
      <span class="planner-leg-meta mono">${hasDistance ? `${kmToDisplay(leg.distanceKm).toFixed(1)} ${unitLabel()} · ${formatDuration(leg.durationMin)}` : "Preview to calculate"}</span>
      <span class="planner-leg-meta-side right">${renderPlannerLegBusinessBtn(idx)}</span>
    </div>
  </div>`;
}

function renderSavedRoutesList() {
  if (!state.plannedRoutes.length) {
    return `<div class="card"><p class="settings-desc" style="margin:0;">No saved routes yet. Plan a multi-stop drive and save it here to reuse later.</p></div>`;
  }
  return state.plannedRoutes.map(r => {
    const totalKm = r.legs.reduce((s, l) => s + (l.distanceKm || 0), 0);
    const totalMin = r.legs.reduce((s, l) => s + (l.durationMin || 0), 0);
    const stopCount = r.stops.length - 2;
    const untagged = r.legs.some(l => !l.tag);
    return `
    <div class="card">
      <div style="display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px;">
        <p class="settings-title" style="margin:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;">${escAttr(r.name || `${r.stops[0].address || "Start"} → ${r.stops[r.stops.length - 1].address || "Destination"}`)}</p>
        <p class="settings-desc" style="margin:0;flex-shrink:0;white-space:nowrap;">${stopCount > 0 ? `${stopCount} stop${stopCount > 1 ? "s" : ""} · ` : ""}${kmToDisplay(totalKm).toFixed(1)} ${unitLabel()} · ${formatDuration(totalMin)}${untagged ? " · needs tagging" : ""}</p>
      </div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn btn-amber plannerLogSavedBtn" data-routeid="${r.id}" style="width:auto;flex:1;">${icons.clock} Log Drive</button>
        <button type="button" class="btn btn-amber plannerStartSavedBtn" data-routeid="${r.id}" style="width:auto;flex:1;">${icons.play} Start Drive</button>
        <button type="button" class="icon-btn plannerEditSavedBtn" data-routeid="${r.id}" title="Edit">${icons.edit}</button>
        <button type="button" class="icon-btn plannerDeleteSavedBtn" data-routeid="${r.id}" title="Delete">${icons.trash}</button>
      </div>
    </div>`;
  }).join("");
}

// Only ever renders anything for a Quick Drive already in progress (the
// manual/no-GPS timer, started before this was retired below, or resumed
// after a reload) -- its own pre-drive setup form (address fields,
// Estimate Drive, Start Drive) used to live here too, but the Trip
// Planner's Start Drive/Log Drive already cover the exact same single
// A-to-B case and more, so that entry point is gone; this just keeps the
// still-live in-progress card working rather than stranding it with no
// way to see/end it.
function renderQuickDriveSection() {
  const a = state.active;
  if (!a) return "";
  return `
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <span class="tag ${a.tag}">${labelFor(DRIVE_TYPES, a.tag)}</span>
      <div class="timer">${icons.clock}<span id="timerDisplay" class="mono">00:00</span></div>
    </div>
    <p style="color:var(--muted);font-size:13px;margin:0 0 16px;">From <b class="route-clip" style="color:var(--text);display:inline-block;width:auto;max-width:200px;vertical-align:bottom;overflow:hidden;white-space:nowrap;"><span class="route-track" id="activeStartPointTrack">${a.startPoint}</span></b> at ${formatTime24(a.startTime)}</p>

    ${state.endDriveError ? `
    <p class="settings-desc" style="color:var(--work);margin:0 0 10px;">${state.endDriveError}</p>
    <label class="field-label">Distance (${unitLabel()})</label>
    <input id="manualDistanceInput" class="input" placeholder="0.0" inputmode="decimal" value="${state.manualDistanceFallback}" style="margin-bottom:10px;" />
    <button id="saveManualDistanceBtn" class="btn btn-ghost" style="margin-bottom:14px;">${icons.check} Save with this distance</button>
    ` : ""}

    <button id="endDriveBtn" class="btn btn-stop" ${state.endDriveBusy ? "disabled" : ""}>${icons.stop} ${state.endDriveBusy ? "Ending Drive…" : "End Drive"}</button>
  </div>`;
}

function renderPlanTab() {
  const p = state.planner;
  const mapsError = state.mapsAuthError ? `<div class="card" style="border-color:rgba(224,100,44,.4);"><p class="settings-desc" style="color:var(--work);margin:0;">${state.mapsAuthError}</p></div>` : "";

  if (!p) {
    // Saved routes live only inside the planner itself now (tap the star
    // in its header, see plannerBrowseSavedBtn) -- showing the same list
    // again here too just duplicated it on the Drive tab's home screen.
    // Entering the planner itself is its own standalone, theme-colored
    // button at the very bottom of the page now, rather than nested
    // inside this card -- primary action for the page, not one buried
    // under an "Under Construction" label.
    const refuelBtn = state.settings.fuelTrackingEnabled !== false && state.settings.fuelMode === "accurate"
      ? `<button id="logFillupBtnLog" class="btn btn-ghost">${icons.locate} Log a Refuel</button>` : "";
    const plannerEntry = state.active ? "" : `
    <button type="button" id="newPlannerRouteBtn" class="btn btn-amber">${icons.route} Plan Drive</button>`;
    return `${renderDashboardSection()}${mapsError}${renderQuickDriveSection()}${refuelBtn}${plannerEntry}`;
  }

  const n = p.stops.length;
  const driving = p.stage === "driving";
  const complete = p.stage === "complete";
  const liveAngleProfile = driving && liveDrive ? resolveLiveAngleProfile(liveDrive.smoothSpeedMs || 0) : null;

  return `
  <div class="planner-fullscreen ${p.mapFocusMode ? "map-focus" : ""}">
    <div class="planner-map-rotate-wrap ${driving ? "driving" : ""} ${liveAngleProfile && liveAngleProfile.tilt > 0 ? "angled" : ""}" id="plannerMapRotateWrap"><div id="plannerMapCanvas"></div></div>
    ${driving ? `<div class="planner-sky-mask ${liveAngleProfile && liveAngleProfile.tilt > 0 ? "show" : ""}" id="plannerSkyMask" style="--mask-vh:${skyMaskVh(liveAngleProfile ? liveAngleProfile.tilt : 0)}vh"></div>` : ""}
    ${(!driving && !complete && p.stage !== "preview" && !p.showSavedList) ? `<button type="button" class="planner-recenter-fab" id="plannerRecenterBtn" title="Recenter on current location">${icons.locate}</button>` : ""}
    ${driving ? `<button type="button" class="planner-angle-fab ${liveDrive && liveDrive.angleMode !== "auto" ? "active" : ""}" id="plannerAngleBtn" title="Cycle angle: ${LIVE_ANGLE_MODE_CYCLE.map(m => LIVE_ANGLE_MODE_LABELS[m].replace("Angle: ", "")).join(" / ")}">${icons.angleView}</button>
    <button type="button" class="planner-compass-fab ${liveDrive && liveDrive.northLocked ? "active" : ""}" id="plannerCompassBtn" title="${liveDrive && liveDrive.northLocked ? "North locked — tap to follow direction of travel" : "Tap to lock the map facing North"}"><span class="planner-compass-needle" id="plannerCompassNeedle">${icons.compassNeedle}</span></button>
    <span class="planner-angle-flash" id="plannerAngleFlash"></span>` : ""}
    ${driving && liveDrive && liveDrive.paused ? `<div class="planner-paused-overlay">${icons.pause}</div>` : ""}

    ${driving ? renderPlannerDrivingBanner() : complete ? "" : `
    <div class="planner-topbar">
      <div class="planner-header">
        <div class="brand" id="plannerBackBtn" title="Tap to return to Drive">
          <span class="planner-header-icon">${icons.steeringWheel}</span>
          <div><h1>Drive Log</h1><p>${escAttr(state.profile.name)}</p></div>
        </div>
        <div class="planner-header-actions">
          <button type="button" class="icon-btn planner-header-star ${p.showSavedList ? "active" : ""}" id="plannerBrowseSavedBtn" title="Saved routes">${icons.starFilled}</button>
          <button type="button" class="icon-btn" id="plannerSettingsBtn" title="Settings">${icons.gear}</button>
        </div>
      </div>
      ${p.showSavedList ? `
      <div class="planner-saved-list">${renderSavedRoutesList()}</div>
      ` : `
      ${!mapsConfigured() ? `<p class="settings-desc" style="margin:0 0 8px;">Map isn't set up for this app yet — you can still plan by typing addresses.</p>` : ""}
      ${mapsError}
      ${renderPlannerFieldBlock(p.stops[0], 0, n)}
      ${p.stops[0].lat != null ? `
      ${p.stops.slice(1).map((s, i) => renderPlannerLegGapRow(i) + renderPlannerFieldBlock(s, i + 1, n, i === p.stops.length - 2)).join("")}
      ${p.stops[p.stops.length - 1].address.trim() ? renderPlannerAddStopRow() : ""}
      ` : ""}
      `}
    </div>`}

    ${driving ? renderPlannerEtaBar() : complete ? `
    <div class="planner-bottom-sheet">
      ${renderPlannerCompleteSummary()}
      ${p.saved
        ? `<button type="button" id="plannerCompleteCloseBtn" class="btn btn-amber">${icons.check} Done</button>`
        : `
        <div class="row-2">
          <button type="button" id="plannerBackToDriveBtn" class="btn btn-ghost">${icons.chevronLeft} Back</button>
          <button type="button" id="plannerCompleteDoneBtn" class="btn btn-amber">${icons.check} Save Drive</button>
        </div>`}
    </div>
    ${p.confirmingDiscard ? `
    <div class="modal-backdrop">
      <div class="modal-card">
        <h2 style="color:var(--work);">Discard this drive?</h2>
        <p class="settings-desc" style="margin:0 0 18px;">Nothing from this drive will be saved. This action can't be undone.</p>
        <div class="row-2">
          <button type="button" id="plannerKeepDriveBtn" class="btn btn-ghost">Keep Drive</button>
          <button type="button" id="plannerConfirmDiscardBtn" class="btn btn-stop">Discard</button>
        </div>
      </div>
    </div>` : ""}` : (p.showSavedList ? "" : `
    <div class="planner-bottom-sheet">
      ${p.previewError ? `<p class="settings-desc" style="color:var(--work);margin:0 0 8px;">${escAttr(p.previewError)}</p>` : ""}
      ${p.previewing && !plannerDirectionsResult ? `<p class="settings-desc" style="text-align:center;margin:0 0 8px;">${icons.route} Calculating route…</p>` : ""}
      ${p.stage === "preview" ? renderPlannerRouteSummary() : ""}
      ${p.stage === "preview" ? `
      <div style="display:flex;gap:8px;">
        <button type="button" id="plannerLogDriveBtn" class="btn btn-ghost" style="width:auto;flex:1;">${icons.clock} Log Drive</button>
        <button type="button" id="plannerStartDrivingBtn" class="btn btn-amber" style="width:auto;flex:1;">${icons.play} Start Drive</button>
      </div>
      ` : ""}
    </div>`)}
    ${state.plannerSaveRouteForm ? renderPlannerSaveRouteModal() : ""}
    ${state.plannerSaveAddressForm ? renderPlannerSaveAddressModal() : ""}
    ${state.plannerLogForm ? renderPlannerLogModal() : ""}
  </div>`;
}

function renderPlannerRouteSummary() {
  const p = state.planner;
  const totalKm = p.legs.reduce((s, l) => s + (l.distanceKm || 0), 0);
  const totalMin = p.legs.reduce((s, l) => s + (l.durationMin || 0), 0);
  const warnings = (plannerDirectionsResult && plannerDirectionsResult.routes[0].warnings) || [];
  // Extra stops beyond the plain start->end pair make this a multi-leg trip
  // worth calling out as such — each leg is now tagged inline between its
  // own two address fields (renderPlannerLegGapRow) rather than listed here.
  const cardLabel = p.stops.length > 2 ? "Total Drive" : "Drive";
  return `
  <div class="planner-route-summary">
    <div class="planner-route-badge">
      <span class="planner-route-badge-label">${icons.route} ${cardLabel}</span>
      <button type="button" class="icon-btn planner-save-star ${p.savedRouteId ? "active" : ""}" id="plannerSaveRouteBtn" title="${p.savedRouteId ? "Saved — tap to remove" : "Save this Drive"}">${p.savedRouteId ? icons.starFilled : icons.starOutline}</button>
    </div>
    <div class="planner-route-metrics centered">
      <div class="metric"><div class="v mono">${tightenDecimal(kmToDisplay(totalKm).toFixed(1))}<span class="unit">${unitLabel()}</span></div><div class="l">Distance</div></div>
      <div class="div"></div>
      <div class="metric"><div class="v mono">${formatDuration(totalMin)}</div><div class="l">Est. time</div></div>
    </div>
    ${warnings.length ? `
    <div class="planner-hazard-row">${icons.warning}<div class="loc-field-wrap"><div class="route-clip" id="plannerHazardClip"><span class="route-track" id="plannerHazardTrack">${escAttr(warnings.join(" · "))}</span></div></div></div>
    ` : ""}
  </div>`;
}

// Same card as renderPlannerRouteSummary, styled the same way, but built
// from what was actually driven (endLiveDrive's p.completeSummary.legs —
// real GPS distance/duration) rather than the pre-drive Directions
// estimate still sitting in p.legs. Nothing is logged yet at this point —
// the briefcase toggles stay editable and Save Drive (plannerCompleteDoneBtn)
// is what actually commits the trips, using whatever tag is set at that
// moment.
function renderPlannerCompleteSummary() {
  const p = state.planner;
  const legs = p.completeSummary.legs;
  const totalKm = legs.reduce((s, l) => s + (l.distanceKm || 0), 0);
  const totalMin = legs.reduce((s, l) => s + (l.durationMin || 0), 0);
  // Multi-leg trips can carry a different tag per leg (still visible below,
  // leg by leg) -- this one badge is just a quick read of the overall
  // drive, so it reads off the first leg's live tag.
  const overallTag = (state.planner.legs[0] && state.planner.legs[0].tag) || legs[0].tag;
  return `
  <div class="planner-route-summary">
    <div class="planner-route-badge">
      <span class="planner-route-badge-label">${icons.flag} Drive Completed</span>
      <div style="display:flex;align-items:center;gap:12px;">
        <button type="button" class="icon-btn planner-discard-drive-btn" id="plannerDiscardDriveBtn" title="Discard drive" style="color:var(--work);">${icons.trash}</button>
        <button type="button" class="icon-btn planner-save-star ${p.savedRouteId ? "active" : ""}" id="plannerSaveRouteBtn" title="${p.savedRouteId ? "Saved — tap to remove" : "Save this Drive"}">${p.savedRouteId ? icons.starFilled : icons.starOutline}</button>
      </div>
    </div>
    <div class="planner-route-metrics">
      <div class="metric" style="text-align:left;"><span class="tag ${overallTag}">${labelFor(DRIVE_TYPES, overallTag)}</span></div>
      <div class="div"></div>
      <div class="metric"><div class="v mono">${tightenDecimal(kmToDisplay(totalKm).toFixed(1))}<span class="unit">${unitLabel()}</span></div><div class="l">Distance</div></div>
      <div class="div"></div>
      <div class="metric"><div class="v mono">${formatDuration(totalMin)}</div><div class="l">Duration</div></div>

// Same single-window shape as Drive Summary: route preview on top,
// editable date/start/end time (defaulted from the Directions estimate
// but not locked to it), and

// no separate step to hop to afterward, same as the other two flows.
function renderPlannerLogModal() {
  const f = state.plannerLogForm;
  const p = state.planner;
  const totalMin = p.legs.reduce((s, l) => s + (l.durationMin || 0), 0);
  const totalKm = p.legs.reduce((s, l) => s + (l.distanceKm || 0), 0);
  const supervised = p.legs.some(l => l.tag === "supervised");
  const mapUrl = mapsConfigured() ? staticMapUrlForPlannerRoute() : null;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2>Log this Drive</h2>
      ${mapUrl ? `<img src="${mapUrl}" alt="" class="log-drive-map" />` : ""}
      <p class="settings-desc" style="margin:0 0 18px;">Logs ${p.legs.length > 1 ? "every leg back-to-back" : "this drive"} using the estimated distance (~${kmToDisplay(totalKm).toFixed(1)} ${unitLabel()}, ~${formatDuration(totalMin)}) instead of live tracking.</p>

      <label class="field-label">Date</label>
      <input id="plannerLogDate" type="date" class="input date-compact" value="${f.date}" style="margin-bottom:14px;" />

      <div class="row-2">
        <div>
          <label class="field-label">Start time (24hr)</label>
          <input id="plannerLogStartTime" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" class="input time-compact" value="${escAttr(f.startTime || "")}" />
        </div>
        <div>
          <label class="field-label">End time (24hr)</label>
          <input id="plannerLogEndTime" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" class="input time-compact" value="${escAttr(f.endTime || "")}" />
        </div>
      </div>
      <p class="settings-desc" style="margin:6px 0 20px;">${p.legs.length > 1 ? "Both default from the total estimated drive time — edit either if it ran differently, split proportionally across legs." : "Both default from the estimated drive time — edit either if it ran differently."}</p>

      ${supervised ? renderConditionsFields(state.conditionsForm) : ""}

      <div class="row-2">
        <button id="plannerLogCancelBtn" class="btn btn-ghost">Cancel</button>
        <button id="plannerLogConfirmBtn" class="btn btn-amber">Save Drive</button>
      </div>
    </div>
  </div>`;
}

function renderHistoryTab() {
  const rows = sortHistoryRows(filteredTrips());
  const sel = state.historySelectMode;
  const selectedCount = state.selectedTripIds.length;
  const allVisibleSelected = rows.length > 0 && rows.every(t => state.selectedTripIds.includes(t.id));
  const sortArrow = (field) => state.historySortBy === field ? (state.historySortDir === "asc" ? " ▲" : " ▼") : "";
  const distValues = state.trips.map(t => kmToDisplay(t.distance));
  const distMaxBound = distValues.length ? Math.max(1, Math.ceil(Math.max(...distValues) * 10) / 10) : 0;
  return `
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;margin-bottom:10px;">
      <div style="display:flex;align-items:center;gap:6px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;flex-shrink:0;">
        ${icons.filter} Filters
      </div>
      <div class="history-actions" style="display:flex;gap:6px;flex-wrap:nowrap;">
        <button id="openReportBtn" class="chip" title="Report">${icons.download} <span class="chip-label">Report</span></button>
        ${state.sheetLink ? `<a href="https://docs.google.com/spreadsheets/d/${state.sheetLink.spreadsheetId}/export?format=xlsx" target="_blank" class="chip" style="text-decoration:none;" title="Export">${icons.drive} <span class="chip-label">Export</span></a>` : ""}
        <button id="openAddDrivesBtn" class="chip" title="Add Drives from Google Timeline">${icons.route} <span class="chip-label">Timeline</span></button>
        <button id="toggleSelectModeBtn" class="chip ${sel ? "active" : ""}" title="${sel ? "Done" : "Edit"}">${sel ? `${icons.check} <span class="chip-label">Done</span>` : `${icons.edit} <span class="chip-label">Edit</span>`}</button>
      </div>
    </div>
    <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;">
      ${[{ v: "all", l: "All" }, ...DRIVE_TYPES].map(tg => `<button class="chip ${state.filterTag===tg.v?"active":""}" data-filtertag="${tg.v}">${tg.l}</button>`).join("")}
    </div>
    <div class="row-2" style="margin-bottom:10px;">
      <input type="date" id="filterFrom" class="input" value="${state.filterFrom}" style="font-size:12px;" />
      <input type="date" id="filterTo" class="input" value="${state.filterTo}" style="font-size:12px;" />
    </div>
    ${distMaxBound > 0 ? `
    <label class="field-label" style="margin-top:2px;">Min distance</label>
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:10px;">
      <span class="mono" style="font-size:12px;color:var(--muted);width:56px;flex-shrink:0;">${Math.min(state.filterMinDistance, distMaxBound).toFixed(1)} ${unitLabel()}</span>
      <input type="range" id="filterMinDistanceSlider" min="0" max="${distMaxBound}" step="0.1" value="${Math.min(state.filterMinDistance, distMaxBound)}" style="flex:1;accent-color:var(--amber);" />
    </div>
    ` : ""}
    <input id="filterSearch" class="input" placeholder="Search Start and End Location..." value="${state.filterSearch}" style="font-size:12px;" />
  </div>

  ${sel ? `
  <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;">
    <label style="display:flex;align-items:center;gap:8px;color:var(--muted);font-size:13px;">
      <input type="checkbox" id="selectAllVisible" ${allVisibleSelected ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--amber);" />

    </label>
    <span class="mono" style="color:var(--muted);font-size:12px;">${selectedCount} selected</span>
    <button id="deleteSelectedBtn" class="btn btn-stop" style="width:auto;padding:8px 14px;font-size:13px;" ${selectedCount === 0 ? "disabled" : ""}>
      ${icons.trash} Delete
    </button>
  </div>` : ""}

  <div class="card" style="padding:0;overflow:hidden;">
    <div class="table-scroll">
      <table>
        <thead><tr>
          ${sel ? `<th style="width:28px;"></th>` : ""}
          <th class="col-date" data-sort="date" style="cursor:pointer;">Date${sortArrow("date")}</th><th class="col-time">Time</th><th class="col-num" data-sort="distance" style="text-align:right;cursor:pointer;">${unitLabel()}${sortArrow("distance")}</th><th>Route</th>
          ${sel ? `<th style="width:36px;"></th>` : ""}
        </tr></thead>
        <tbody>
          ${rows.length === 0
            ? `<tr><td colspan="${sel ? 6 : 4}" class="empty">No trips logged yet.</td></tr>`
            : rows.map(t => `
              <tr class="history-row" data-tripid="${t.id}">
                ${sel ? `<td><input type="checkbox" class="tripCheckbox" data-tripid="${t.id}" ${state.selectedTripIds.includes(t.id) ? "checked" : ""} style="width:16px;height:16px;accent-color:var(--amber);" /></td>` : ""}

                <td class="mono num-cell" style="text-align:right;">${kmToDisplay(t.distance).toFixed(1)}</td>
                <td class="route-cell"><div class="route-clip"><span class="route-track">${t.startPoint} → ${t.endPoint}</span></div></td>
                ${sel ? `<td><button class="icon-btn editTripBtn" data-tripid="${t.id}" title="Edit">${icons.edit}</button></td>` : ""}
              </tr>`).join("")}
        </tbody>
      </table>
    </div>
  </div>

  ${state.settings.fuelTrackingEnabled !== false ? `
  <div class="card">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
      <p class="settings-title" style="margin:0;">${icons.fuelPump} Refuels</p>
      <button id="logFillupBtnHistory" class="chip" title="Log a Refuel">${icons.locate} <span class="chip-label">Log a Refuel</span></button>
    </div>
    ${state.fuelFillups.length ? `
      <div class="table-scroll" style="max-height:260px;">
        <table>
          <thead><tr><th>Date</th><th style="text-align:right;">Odo</th><th style="text-align:right;">Litres/Gal</th><th style="text-align:right;">Price</th><th></th></tr></thead>
          <tbody>
            ${state.fuelFillups.slice().sort((a,b) => b.date.localeCompare(a.date)).map(f => `
              <tr>
                <td>${formatDateForDisplay(f.date)}</td>
                <td class="mono" style="text-align:right;">${f.odometer != null ? Number(f.odometer).toLocaleString() : "—"}</td>
                <td class="mono" style="text-align:right;">${Number(f.amount).toFixed(2)}</td>
                <td class="mono" style="text-align:right;">${Number(f.price).toFixed(2)}</td>
                <td><button class="icon-btn deleteFillupBtn" data-id="${f.id}" title="Remove">${icons.trash}</button></td>
              </tr>`).join("")}
          </tbody>
        </table>
      </div>
    ` : `<p class="settings-desc" style="margin:0;">No refuels logged yet.</p>`}
  </div>
  ` : ""}`;
}

  <div class="card">

    ${state.settings.fuelMode === "estimated" ? `
      <label class="field-label">Vehicle</label>
      ${state.settings.selectedVehicle ? `
        <button id="carDetailsChip" class="input" style="width:100%;text-align:left;cursor:pointer;margin-bottom:14px;">${state.settings.selectedVehicle.label}</button>
      ` : `
        <button id="carLookupBtn" class="btn btn-ghost" style="width:100%;margin-bottom:14px;">${icons.search} Search Vehicle</button>
      `}
      <div class="row-2" style="margin-bottom:6px;">
        <div>
          <label class="field-label">Fuel Usage<br>(${state.settings.unit === "mi" ? "MPG" : "L/100km"})</label>
          <input id="fuelRateInput" class="input" inputmode="decimal" placeholder="${state.settings.unit === "mi" ? "e.g. 32" : "e.g. 7.5"}" value="${escAttr(state.settings.fuelRate)}" onfocus="setTimeout(() => this.select())" />

      </div>
      <p class="settings-desc" style="margin:6px 0 0;">Estimates each drive's cost from these figures.</p>
    ` : `

      <div class="row-2" style="margin-bottom:12px;">
        <button id="logFillupBtn" class="btn btn-ghost">${icons.locate} Log a Refuel</button>
        <button id="viewRefillHistoryBtn" class="btn btn-ghost">${icons.clock} Refuel History</button>
      </div>
      ${state.fuelFillups.length ? `
        <p class="settings-desc" style="margin-top:0;">Current average: <b class="mono" style="color:var(--text);">${formatFuelCostPerUnit()}</b> / ${unitLabel()}</p>
        <div style="margin-top:10px;">
          <label class="field-label">Average Fuel Price &amp; Usage</label>
          <select id="fuelPriceAvgPeriodSelect" class="input" style="margin-bottom:6px;">
            <option value="1" ${state.fuelPriceAvgPeriod === "1" ? "selected" : ""}>Last month</option>
            <option value="3" ${state.fuelPriceAvgPeriod === "3" ? "selected" : ""}>Last 3 months</option>
            <option value="6" ${state.fuelPriceAvgPeriod === "6" ? "selected" : ""}>Last 6 months</option>
            <option value="9" ${state.fuelPriceAvgPeriod === "9" ? "selected" : ""}>Last 9 months</option>
            <option value="12" ${state.fuelPriceAvgPeriod === "12" ? "selected" : ""}>Last year</option>
            <option value="all" ${state.fuelPriceAvgPeriod === "all" ? "selected" : ""}>All time</option>

                ? `Price: <b class="mono" style="color:var(--text);">${avg.toFixed(2)}</b> / ${state.settings.unit === "mi" ? "gallon" : "litre"}`

            ${(() => {
              const months = state.fuelPriceAvgPeriod === "all" ? null : parseInt(state.fuelPriceAvgPeriod, 10);

          </p>
        </div>
      ` : `<p class="settings-desc" style="margin:0;">No refuels logged yet.</p>`}
    `}
    `}

    </div>

        <option value="biannual" ${state.settings.odometerFrequency === "biannual" ? "selected" : ""}>Every 6 months</option>
        <option value="yearly" ${state.settings.odometerFrequency === "yearly" ? "selected" : ""}>Yearly</option>

      <button id="enterOdometerNowBtn" class="btn btn-ghost">Enter Now</button>

  <div class="card">

    <p class="settings-desc">Permanently deletes all logged drives from this device. Google Sheet is not affected.</p>
    <button id="clearHistoryBtn" class="btn btn-ghost" style="margin-top:12px;color:var(--work);border-color:rgba(224,100,44,.4);">Clear All Drive History</button>
  </div>

const ROAD_TYPES = [
  { v: "sealed", l: "Sealed" }, { v: "unsealed", l: "Unsealed" }, { v: "quiet", l: "Quiet Street" },
  { v: "busy", l: "Busy Road" }, { v: "multilane", l: "Multi-laned Road" },
];
const WEATHER_TYPES = [{ v: "dry", l: "Dry" }, { v: "wet", l: "Wet" }];
const TRAFFIC_LEVELS = [{ v: "light", l: "Light" }, { v: "medium", l: "Medium" }, { v: "heavy", l: "Heavy" }];
// Display labels only — the underlying "normal"/"work" values stay as-is
// in storage, settings keys and data attributes for backward compatibility.
const DRIVE_TYPES = [{ v: "normal", l: "Personal" }, { v: "work", l: "Business" }, { v: "supervised", l: "Supervised" }];

// Shown right after "End Drive", before any supervised conditions prompt,
// so the driver can double-check the auto-calculated distance/end point
// (and the drive as a whole) before it's logged. There's no longer a
// manual entry form to go back to (End Drive is fully automatic), so
// declining here goes through a confirm-to-discard step instead of "Edit".
function renderCancelDriveModal() {
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2 style="color:var(--work);">Cancel this drive?</h2>
      <p class="settings-desc" style="margin:0 0 18px;">This drive will not be saved. This action can't be undone.</p>
      <div class="row-2">
        <button id="keepDriveBtn" class="btn btn-ghost">Keep Drive</button>
        <button id="confirmCancelDriveBtn" class="btn btn-stop">Discard Drive</button>
      </div>
    </div>
  </div>`;
}

// Same single-window shape as the other log modals: route preview on
// top, editable times (these ones are real observed
// times off the timer, not an estimate, but still worth a quick fix if
// End Drive got tapped late), driving conditions inline at the bottom for
// a Supervised trip. Business still continues to its own purpose/notes
// step afterward -- unlike Personal/Supervised, that step still has
// something real left to ask for once this one's done.
function renderDriveSummaryModal() {
  const t = state.driveSummary.trip;
  const supervised = t.tag === "supervised";
  const mapUrl = mapsConfigured() ? staticMapUrlForTrip(t) : null;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2>Log this Drive</h2>
      ${mapUrl ? `<img src="${mapUrl}" alt="" class="log-drive-map" />` : ""}
      <div class="kv-line"><span class="k">Type</span><span class="tag ${t.tag}">${labelFor(DRIVE_TYPES, t.tag)}</span></div>
      <div class="kv-line" style="margin-bottom:14px;"><span class="k">Distance</span><span class="v mono">${kmToDisplay(t.distance).toFixed(1)} ${unitLabel()}</span></div>

      <div class="row-2">
        <div>
          <label class="field-label">Start time (24hr)</label>
          <input id="summaryStartTime" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" class="input time-compact" value="${escAttr(t.startTime || "")}" />
        </div>
        <div>
          <label class="field-label">End time (24hr)</label>
          <input id="summaryEndTime" type="text" inputmode="numeric" maxlength="5" placeholder="HH:MM" class="input time-compact" value="${escAttr(t.endTime || "")}" />
        </div>
      </div>
      <p class="settings-desc" style="margin:6px 0 14px;">Edit either time if the drive didn't start or end exactly then.</p>

      <div class="kv-line" style="align-items:flex-start;"><span class="k">Start</span><span class="v" style="text-align:right;max-width:70%;">${escAttr(t.startPoint)}</span></div>
      <div class="kv-line" style="align-items:flex-start;margin-bottom:18px;"><span class="k">End</span><span class="v" style="text-align:right;max-width:70%;">${escAttr(t.endPoint)}</span></div>

      ${supervised ? renderConditionsFields(state.conditionsForm) : ""}

      <div class="row-2">
        <button id="cancelDriveSummaryBtn" class="btn btn-ghost">Cancel</button>
        <button id="continueDriveSummaryBtn" class="btn btn-amber">${t.tag === "work" ? "Continue" : "Save Drive"}</button>
      </div>
    </div>
  </div>`;
}

function renderBusinessDetailsModal() {
  const f = state.businessForm;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2>Business drive details</h2>

      <label class="field-label">Purpose / notes</label>
      <input id="businessPurposeInput" class="input" value="${escAttr(f.purpose)}" placeholder="e.g. Client visit" style="margin-bottom:20px;" />

      <div class="row-2">
        <button id="backBusinessBtn" class="btn btn-ghost">Back</button>
        <button id="saveBusinessTripBtn" class="btn btn-amber">Save Drive</button>
      </div>
    </div>
  </div>`;
}

// The Day/Night through Supervisor fields, shared by the standalone
// Driving Conditions step (Trip Planner's multi-leg Save Drive, see
// renderConditionsModal) and inlined directly into the single-window
// Log this Drive / Drive Summary flows below -- one set of markup and
// bindings either way rather than three near-duplicates drifting apart.
function renderConditionsFields(f) {
  return `
      <label class="field-label">Day / Night <span style="opacity:.7;">(auto, from time of day)</span></label>
      <select id="condTimeOfDay" class="input" style="margin-bottom:14px;">
        <option value="day" ${f.timeOfDay === "day" ? "selected" : ""}>Day</option>
        <option value="night" ${f.timeOfDay === "night" ? "selected" : ""}>Night</option>
      </select>

      <label class="field-label">Road type</label>
      <select id="condRoadType" class="input" style="margin-bottom:14px;">
        ${ROAD_TYPES.map(r => `<option value="${r.v}" ${f.roadType === r.v ? "selected" : ""}>${r.l}</option>`).join("")}
      </select>

      <label class="field-label">Weather</label>
      <select id="condWeather" class="input" style="margin-bottom:14px;">
        ${WEATHER_TYPES.map(w => `<option value="${w.v}" ${f.weather === w.v ? "selected" : ""}>${w.l}</option>`).join("")}
      </select>

      <label class="field-label">Traffic density</label>
      <select id="condTraffic" class="input" style="margin-bottom:14px;">
        ${TRAFFIC_LEVELS.map(t => `<option value="${t.v}" ${f.traffic === t.v ? "selected" : ""}>${t.l}</option>`).join("")}
      </select>

      <label class="field-label">Supervisor</label>
      <select id="condSupervisor" class="input" style="margin-bottom:${state.addingSupervisor ? "10" : "18"}px;">
        <option value="" ${!f.supervisorId ? "selected" : ""}>None</option>
        ${state.supervisors.map(s => `<option value="${s.id}" ${f.supervisorId === s.id ? "selected" : ""}>${s.name} (${s.licence})</option>`).join("")}
        <option value="__new__">+ Add new supervisor</option>
      </select>

      ${state.addingSupervisor ? `
        <div class="card" style="padding:12px;margin-bottom:18px;">
          <label class="field-label">Full name</label>
          <input id="newSupervisorName" class="input" style="margin-bottom:10px;" value="${state.newSupervisorName}" placeholder="e.g. Jane Smith" />
          <label class="field-label">Licence no.</label>
          <input id="newSupervisorLicence" class="input" style="margin-bottom:12px;" value="${state.newSupervisorLicence}" placeholder="e.g. 123456789" />
          <button id="saveSupervisorBtn" class="btn btn-ghost">Add supervisor</button>
        </div>
      ` : ""}
  `;
}
// The standalone version -- its own screen with Back/Save, used only when
// there's no single richer window to inline into (the Trip Planner's Save
// Drive can commit several legs/trips at once; see pendingPlannerTrips).
function renderConditionsModal() {
  const f = state.conditionsForm;
  return `
  <div class="modal-backdrop">
    <div class="modal-card">
      <h2>Driving conditions</h2>
      ${renderConditionsFields(f)}
      <div class="row-2">
        <button id="backConditionsBtn" class="btn btn-ghost">Back</button>
        <button id="saveConditionsTripBtn" class="btn btn-amber">Save Drive</button>
      </div>
    </div>
  </div>`;
}

function renderCarLookupModal() {

  return `

        <select id="carLookupYear" class="input" style="margin-bottom:14px;" ${!f.years.length && f.error ? "disabled" : ""}>

          ${f.years.map(y => `<option value="${escAttr(y.value)}" ${f.year === y.value ? "selected" : ""}>${y.text}</option>`).join("")}
        </select>
        ${f.year ? `
        <label class="field-label">Make</label>
        <select id="carLookupMake" class="input" style="margin-bottom:14px;" ${!f.makes.length && f.error ? "disabled" : ""}>
          <option value="">${f.makes.length ? "Select Make" : f.error ? "Unavailable" : "Loading..."}</option>
          ${f.makes.map(m => `<option value="${escAttr(m.value)}" ${f.make === m.value ? "selected" : ""}>${m.text}</option>`).join("")}
        </select>` : ""}
        ${f.make ? `
        <label class="field-label">Model</label>
        <select id="carLookupModel" class="input" style="margin-bottom:14px;" ${!f.models.length && f.error ? "disabled" : ""}>
          <option value="">${f.models.length ? "Select Model" : f.error ? "Unavailable" : "Loading..."}</option>

        <select id="carLookupTrim" class="input" style="margin-bottom:14px;" ${!f.trims.length && f.error ? "disabled" : ""}>

        </select>` : ""}
      ` : `
        <p class="settings-desc" style="margin:0 0 12px;">Approximate figures — adjust if you know the exact number.</p>
        <label class="field-label">Make</label>
        <select id="carLookupNonUsMake" class="input" style="margin-bottom:14px;">
          <option value="">Select Make</option>
          ${nonUsMakes.map(m => `<option value="${escAttr(m)}" ${f.nonUsMake === m ? "selected" : ""}>${m}</option>`).join("")}
        </select>
        ${f.nonUsMake ? `
        <label class="field-label">Model</label>
        <select id="carLookupNonUsModel" class="input" style="margin-bottom:14px;">
          <option value="">Select Model</option>
          ${nonUsModels.map(c => `<option value="${escAttr(c.model)}" ${f.nonUsModel === c.model ? "selected" : ""}>${c.model}${c.yearFrom ? ` (${c.yearFrom}–${c.yearTo || currentYear})` : ""}</option>`).join("")}
        </select>` : ""}
      `}
      ${f.error ? `<p class="err" style="margin:8px 0 0;">${f.error}</p>` : ""}
      ${f.result != null ? `
        <p class="settings-desc" style="margin:14px 0 0;">Estimated consumption: <b class="mono" style="color:var(--text);">${f.result.toFixed(1)}</b> ${unitLabelStr}</p>
      ` : ""}

        <button id="cancelCarLookupBtn" class="btn btn-ghost">Cancel</button>
        <button id="applyCarLookupBtn" class="btn btn-amber" ${f.result == null ? "disabled" : ""}>Use This Figure</button>
      </div>
    </div>
  </div>`;
}

            <button id="backAddDrivesBtn" class="btn btn-ghost">Back</button>
